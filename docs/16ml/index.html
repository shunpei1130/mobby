    <style>
        :root {
            --font-main: 'Yomogi', cursive;
            --bg: #10141d;
            --surface: #181e2a;
            --surface2: #202838;
            --surface3: #121722;
            --text-main: #eef3fb;
            --text-sub: #aab5c7;
            --accent: #91c7d8;
            --accent-soft: rgba(145, 199, 216, 0.16);
            --accent2: #d9a7b7;
            --line: rgba(255, 255, 255, 0.11);
            --shadow-lg: 0 18px 44px rgba(0, 0, 0, 0.34);
            --shadow-sm: 0 8px 20px rgba(0, 0, 0, 0.18);
            --danger: #ff7a90;
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            margin: 0;
            font-family: var(--font-main);
            color: var(--text-main);
            background:
                radial-gradient(circle at 20% 0%, rgba(145, 199, 216, 0.12), transparent 34%),
                linear-gradient(180deg, #0e121b 0%, var(--bg) 48%, #131019 100%);
            line-height: 1.7;
        }

        a {
            color: var(--accent);
            text-decoration: none;
        }

        button {
            border: 1px solid transparent;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: 999px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            transition: transform 0.18s ease, background 0.2s, box-shadow 0.2s, border-color 0.2s;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0) scale(0.97);
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        .primary {
            background: linear-gradient(135deg, var(--accent), #6aa6bc);
            color: #081018;
            box-shadow: 0 10px 24px rgba(145, 199, 216, 0.24);
        }

        .wrap {
            max-width: 820px;
            margin: 0 auto;
            padding: 36px 18px 72px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .home-btn {
            border-color: var(--line);
            background: var(--surface);
            color: var(--accent);
        }

        .logo {
            width: 30px;
            height: 30px;
            border-radius: 10px;
            background-image: url('../mobby_logo2_trimmed.webp');
            background-size: cover;
            background-position: center;
            box-shadow: 0 8px 18px rgba(145, 199, 216, 0.24);
        }

        .title h1 {
            margin: 0;
            color: var(--accent);
            font-size: 15px;
            font-weight: 700;
        }

        .title p {
            margin: 0;
            color: var(--text-sub);
            font-size: 12px;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nav a,
        .nav button {
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-main);
            font-size: 12px;
        }

        .nav a.active {
            background: var(--accent-soft);
            color: var(--accent);
        }

        .panel {
            background: rgba(24, 30, 42, 0.92);
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: var(--shadow-lg);
            padding: 30px;
            margin-bottom: 22px;
            backdrop-filter: blur(8px);
        }

        .kicker {
            margin: 0 0 8px;
            color: var(--accent);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .big {
            margin: 0 0 16px;
            font-size: 26px;
            line-height: 1.45;
        }

        .text-body {
            color: var(--text-sub);
            font-size: 15px;
        }

        .intro-copy {
            max-width: 500px;
            margin: 0 auto 26px;
        }

        .progress-wrap {
            margin-bottom: 26px;
        }

        .progress-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            color: var(--text-sub);
            font-size: 12px;
        }

        .progress-track {
            height: 7px;
            border-radius: 999px;
            overflow: hidden;
            background: var(--surface3);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            transition: width 0.35s ease;
        }

        .qCard {
            padding: 0 0 28px;
            margin-bottom: 28px;
            border-bottom: 1px solid var(--line);
        }

        .qCard:last-child {
            border-bottom: 0;
            margin-bottom: 6px;
            padding-bottom: 6px;
        }

        .qText {
            margin: 0 0 16px;
            font-size: 16px;
            font-weight: 700;
        }

        .likert5 {
            display: grid;
            gap: 9px;
        }

        .likert-labels {
            display: flex;
            justify-content: space-between;
            color: var(--text-sub);
            font-size: 11px;
            font-weight: 700;
            padding: 0 4px;
        }

        .likert-buttons {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 8px;
        }

        .likert-btn {
            min-height: 48px;
            padding: 8px 6px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-sub);
            font-size: 12px;
            line-height: 1.35;
        }

        .likert-btn.selected {
            border-color: rgba(145, 199, 216, 0.8);
            background: rgba(145, 199, 216, 0.2);
            color: var(--text-main);
            box-shadow: 0 0 0 4px rgba(145, 199, 216, 0.08);
        }

        .result-hero {
            text-align: center;
        }

        .char-image {
            width: min(100%, 340px);
            aspect-ratio: 1/1;
            margin: 20px auto;
            border-radius: 22px;
            overflow: hidden;
            background: var(--surface2);
            border: 1px solid var(--line);
            box-shadow: var(--shadow-sm);
        }

        .char-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .result-tag {
            display: inline-flex;
            padding: 6px 14px;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 12px;
            font-weight: 700;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .info-card {
            background: var(--surface2);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 18px;
        }

        .info-card h3 {
            margin: 0 0 10px;
            color: var(--accent);
            font-size: 14px;
        }

        .info-card p {
            margin: 0;
            color: var(--text-main);
            font-size: 14px;
        }

        .axis-row {
            margin-bottom: 16px;
        }

        .axis-head {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            color: var(--text-sub);
            font-size: 12px;
            margin-bottom: 7px;
        }

        .axis-track {
            position: relative;
            height: 9px;
            border-radius: 999px;
            background: var(--surface3);
            overflow: hidden;
        }

        .axis-fill {
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
        }

        .music-panel {
            background: linear-gradient(145deg, rgba(145, 199, 216, 0.13), rgba(217, 167, 183, 0.12));
            border-color: rgba(145, 199, 216, 0.32);
        }

        .listen-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        .listen-buttons a {
            display: inline-flex;
            justify-content: center;
            min-width: 142px;
            padding: 11px 18px;
            border-radius: 999px;
            background: var(--surface3);
            border: 1px solid var(--line);
            color: var(--text-main);
            font-size: 13px;
            font-weight: 700;
        }

        .share-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .fade-in {
            animation: fadeIn 0.35s ease both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        footer {
            text-align: center;
            color: var(--text-sub);
            font-size: 12px;
            margin-top: 34px;
        }

        @media(max-width:640px) {
            .wrap {
                padding: 22px 14px 58px;
            }

            header {
                align-items: flex-start;
            }

            .panel {
                padding: 22px 15px;
                border-radius: 16px;
            }

            .big {
                font-size: 22px;
            }

            .likert-buttons {
                gap: 6px;
            }

            .likert-btn {
                min-height: 52px;
                padding: 7px 4px;
                border-radius: 10px;
                font-size: 10px;
            }

            .result-grid {
                grid-template-columns: 1fr;
            }

            .listen-buttons a,
            .listen-buttons button {
                flex: 1;
                min-width: 0;
            }
        }
    </style>
