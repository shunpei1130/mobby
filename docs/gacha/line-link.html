<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobby Gacha Result</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #fff7fb;
      color: #34242d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(360px, calc(100vw - 40px));
      text-align: center;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 22px;
    }
    p {
      margin: 0 0 18px;
      line-height: 1.7;
      color: #6d5964;
    }
    button, a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 999px;
      border: 0;
      background: #06c755;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
    .secondary {
      margin-top: 10px;
      background: transparent;
      color: #6d5964;
      border: 1px solid #e8d8df;
    }
    .status {
      min-height: 24px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Mobby Gacha Result</h1>
    <p>シールガチャ結果をLINEで受け取るために連携します。</p>
    <p class="status" id="status">LINEを確認しています...</p>
    <button id="loginButton" type="button" hidden>LINEで連携する</button>
    <a id="addFriendButton" href="https://lin.ee/pNFlqJ6" hidden>公式LINEを友だち追加する</a>
    <br>
    <a class="secondary" href="index.html">ガチャページへ戻る</a>
  </main>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    (() => {
      const LIFF_ID = "2010241086-zi2RBQek";
      const VERIFY_ENDPOINT = "/api/gacha-line-verify";
      const ADD_FRIEND_URL = "https://lin.ee/pNFlqJ6";
      const TOKEN_STORAGE_KEY = "mobbyGachaLineLinkToken";
      const PROFILE_STORAGE_KEY = "mobbyGachaLineProfile";
      const status = document.getElementById("status");
      const loginButton = document.getElementById("loginButton");
      const addFriendButton = document.getElementById("addFriendButton");

      const setStatus = (message) => {
        if (status) status.textContent = message;
      };

      const finish = (data) => {
        sessionStorage.setItem(TOKEN_STORAGE_KEY, data.lineLinkToken);
        sessionStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(data.profile || {}));
        setStatus("LINE連携が完了しました。購入ページへ戻ります。");
        window.setTimeout(() => {
          window.location.href = "index.html?line_linked=1";
        }, 700);
      };

      const verify = async () => {
        if (typeof liff.getFriendship === "function") {
          const friendship = await liff.getFriendship().catch(() => null);
          if (!friendship?.friendFlag) {
            addFriendButton.hidden = false;
            addFriendButton.href = ADD_FRIEND_URL;
            setStatus("結果画像の配信には公式LINEの友だち追加が必要です。追加後、このページに戻ってください。");
            return;
          }
        }
        const idToken = liff.getIDToken();
        if (!idToken) throw new Error("LINEログイン情報を取得できませんでした。");
        const response = await fetch(VERIFY_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ idToken })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data?.ok || !data?.lineLinkToken) {
          throw new Error(data?.error || "LINE連携に失敗しました。");
        }
        finish(data);
      };

      const start = async () => {
        try {
          await liff.init({ liffId: LIFF_ID });
          if (!liff.isLoggedIn()) {
            loginButton.hidden = false;
            setStatus("LINEログインをしてください。");
            return;
          }
          await verify();
        } catch (error) {
          console.error(error);
          loginButton.hidden = false;
          setStatus(error?.message || "LINE連携に失敗しました。");
        }
      };

      loginButton?.addEventListener("click", () => {
        liff.login({ redirectUri: window.location.href });
      });

      start();
    })();
  </script>
</body>
</html>
