<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シールガチャ | Mobby</title>
  <meta name="description" content="Mobbyのシールガチャ。かわいいシールデザインを集めるガチャページです。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="seal-styles.css">
</head>
<body>
  <main class="seal-page-shell">
    <header class="seal-header">
      <button class="seal-back" type="button" onclick="window.location.href='../index.html'" aria-label="ホームに戻る">
        <span aria-hidden="true"></span>
      </button>
      <button class="seal-list-open" id="openSealList" type="button" aria-haspopup="dialog" aria-controls="sealListModal">
        <span class="seal-list-icon" aria-hidden="true"></span>
        <span>シール一覧</span>
      </button>
    </header>

    <section class="seal-hero" aria-labelledby="sealGachaTitle">
      <div class="seal-sparkles" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>

      <div class="seal-hero-copy">
        <h2 id="sealGachaTitle" class="seal-logo">
          <span>シール</span>
          <span>ガチャ</span>
        </h2>
      </div>

      <div class="seal-machine" aria-hidden="true">
        <img class="seal-machine-image" src="../gacha-new/assets/gacha/gachagacha-mobby.png" alt="">
      </div>
    </section>

    <section class="seal-lineup-panel" aria-labelledby="sealLineupTitle">
      <h2 id="sealLineupTitle">♡ こんなのが出るかも ♡</h2>
      <div class="seal-lineup">
        <article class="seal-item">
          <span class="rarity normal">R</span>
          <div class="seal-placeholder">
            <img src="../gacha-new/assets/r/%E7%A7%98%E5%AF%86%E3%81%AE%E6%98%9F.png" alt="秘密の星">
          </div>
        </article>
        <article class="seal-item">
          <span class="rarity rare">SR</span>
          <div class="seal-placeholder">
            <img src="../gacha-new/assets/sr/%E9%9D%99%E3%81%8B%E3%81%AA%E6%B8%AF%E3%81%AE%E7%9B%B8%E6%A3%92-sr.png" alt="静かな港の相棒 SR">
          </div>
        </article>
        <article class="seal-item">
          <span class="rarity sparkle">UR</span>
          <div class="seal-placeholder">
            <img src="../gacha-new/assets/ur/%E4%BD%99%E7%99%BD%E3%82%92%E9%A3%BE%E3%82%8B%E6%BC%94%E5%87%BA%E5%AE%B6-ur.png" alt="余白を飾る演出家 UR">
          </div>
        </article>
        <article class="seal-item">
          <span class="rarity special">プリ</span>
          <div class="seal-placeholder">
            <img src="../gacha-new/assets/gal/%E8%8A%B1%E6%9D%9F%E3%81%AE%E4%B8%BB%E4%BA%BA%E5%85%AC-gal.png" alt="花束の主人公 プリ">
          </div>
        </article>
      </div>
      <p>どのシールが出るかはおたのしみ♪</p>
    </section>

    <section class="seal-spin-panel" aria-label="ガチャをまわす">
      <a class="spin-button" href="spin.html">
        1回まわす
        <span class="spin-capsule" aria-hidden="true"></span>
      </a>
      <p class="spin-note"><span aria-hidden="true">ⓘ</span> ガチャから出るシールは重複することがあります</p>
    </section>
  </main>

  <section class="seal-list-modal" id="sealListModal" aria-labelledby="sealListTitle" aria-modal="true" role="dialog" hidden>
    <button class="seal-list-backdrop" id="closeSealListBackdrop" type="button" aria-label="シール一覧を閉じる"></button>
    <div class="seal-list-sheet">
      <div class="seal-list-head">
        <div>
          <p class="seal-list-kicker">Sticker Lineup</p>
          <h2 id="sealListTitle">シール一覧</h2>
        </div>
        <button class="seal-list-close" id="closeSealList" type="button" aria-label="シール一覧を閉じる">×</button>
      </div>
      <div class="seal-list-content" id="sealListContent"></div>
    </div>
  </section>

  <script>
    (() => {
      const modal = document.getElementById("sealListModal");
      const openButton = document.getElementById("openSealList");
      const closeButton = document.getElementById("closeSealList");
      const closeBackdrop = document.getElementById("closeSealListBackdrop");
      const content = document.getElementById("sealListContent");
      if (!modal || !openButton || !closeButton || !closeBackdrop || !content) return;

      const groups = [
        { label: "R", className: "normal", dir: "r", files: ["ひなたの愛され人.png", "余白を飾る演出家.png", "地図を広げる冒険家.png", "夜風のロマンチスト.png", "恋に旗を振る人.png", "晴れ間の本命.png", "月影のミューズ.png", "毛布を掛ける人.png", "秘密の星.png", "胸奥のロマン.png", "花束の主人公１.png", "陽だまりを分ける人.png", "雨宿りの待ち人.png", "静かな港の相棒.png", "静かな灯.png", "風まかせの小悪魔.png"] },
        { label: "SR", className: "rare", dir: "sr", softPreview: true, files: ["ひなたの愛され人-sr.png", "余白を飾る演出家-sr.png", "地図を広げる冒険家-sr.png", "夜風のロマンチスト-sr.png", "恋に旗を振る人-sr.png", "晴れ間の本命-sr.png", "月影のミューズ-sr.png", "毛布を掛ける人-sr.png", "秘密の星-sr.png", "胸奥のロマン-sr.png", "花束の主人公-sr.png", "陽だまりを分ける人-sr.png", "雨宿りの待ち人-sr.png", "静かな港の相棒-sr.png", "静かな灯-sr.png", "風まかせの小悪魔-sr.png"] },
        { label: "UR", className: "sparkle", dir: "ur", softPreview: true, files: ["ひなたの愛され人-ur.png", "余白を飾る演出家-ur.png", "地図を広げる冒険家-ur.png", "夜風のロマンチスト-ur.png", "恋に旗を振る人-ur.png", "晴れ間の本命-ur.png", "月影のミューズ-ur.png", "毛布を掛ける人-ur.png", "秘密の星-ur.png", "胸奥のロマン-ur.png", "花束の主人公-ur.png", "陽だまりを分ける人-ur.png", "雨宿りの待ち人-ur.png", "静かな港の相棒-ur.png", "静かな灯-ur.png", "風まかせの小悪魔-ur.png"] },
        { label: "プリ", className: "special", dir: "gal", softPreview: true, files: ["ひなたの愛され人-gal.png", "余白を飾る演出家-gal.png", "地図を広げる冒険家-gal.png", "夜風のロマンチスト-gal.png", "恋に旗を振る人-gal.png", "晴れ間の本命-gal.png", "月影のミューズ-gal.png", "毛布を掛ける人-gal.png", "秘密の星-gal.png", "胸奥のロマン-gal.png", "花束の主人公-gal.png", "陽だまりを分ける人-gal.png", "雨宿りの待ち人-gal.png", "静かな港の相棒-gal.png", "静かな灯り-gal.png", "風まかせの小悪魔-gal.png"] }
      ];

      const stripName = (file) => file.replace(/\.png$/u, "").replace(/-(sr|ur|gal)$/u, "").replace(/１$/u, "");
      const assetPath = (dir, file) => `../gacha-new/assets/${dir}/${encodeURIComponent(file)}`;

      content.innerHTML = groups.map((group) => `
        <section class="seal-list-group ${group.softPreview ? "is-soft-preview" : ""} is-${group.dir}-preview" aria-label="${group.label}のシール">
          <div class="seal-list-group-head">
            <span class="rarity ${group.className}">${group.label}</span>
            <span>${group.files.length}種類</span>
          </div>
          <div class="seal-list-grid">
            ${group.files.map((file) => {
              const name = stripName(file);
              return `<article class="seal-list-card"><div class="seal-list-image-guard"><img src="${assetPath(group.dir, file)}" alt="${name}" draggable="false"></div><p>${name}</p></article>`;
            }).join("")}
          </div>
        </section>
      `).join("");

      const openModal = () => {
        modal.hidden = false;
        document.body.classList.add("is-seal-list-open");
        closeButton.focus();
      };

      const closeModal = () => {
        modal.hidden = true;
        document.body.classList.remove("is-seal-list-open");
        openButton.focus();
      };

      openButton.addEventListener("click", openModal);
      closeButton.addEventListener("click", closeModal);
      closeBackdrop.addEventListener("click", closeModal);
      content.addEventListener("contextmenu", (event) => event.preventDefault());
      content.addEventListener("dragstart", (event) => event.preventDefault());
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !modal.hidden) closeModal();
      });
    })();
  </script>
</body>
</html>
