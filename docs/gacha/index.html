<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シールガチャ | Mobby</title>
  <meta name="description" content="Mobbyのシールガチャ。かわいいシールデザインを集めるガチャページです。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="seal-styles.css">
</head>
<body>
  <main class="seal-page-shell">
    <header class="seal-header">
      <button class="seal-back" type="button" onclick="window.location.href='../index.html'" aria-label="ホームに戻る">
        <span aria-hidden="true"></span>
      </button>
      <h1>シールガチャ</h1>
    </header>

    <section class="seal-hero" aria-labelledby="sealGachaTitle">
      <div class="seal-sparkles" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>

      <div class="seal-hero-copy">
        <h2 id="sealGachaTitle" class="seal-logo">
          <span>シール</span>
          <span>ガチャ</span>
        </h2>
        <p>ガチャをまわして<br>かわいいシールデザインを<br>ゲットしよう！</p>
        <div class="seal-coin-card" aria-label="所持コイン 0枚">
          <span>所持コイン</span>
          <strong><span class="coin-icon" aria-hidden="true"></span>0枚</strong>
          <small>シールガチャに使えます</small>
        </div>
      </div>

      <div class="seal-machine" aria-hidden="true">
        <div class="machine-dome">
          <span class="capsule c1"></span>
          <span class="capsule c2"></span>
          <span class="capsule c3"></span>
          <span class="capsule c4"></span>
          <span class="capsule c5"></span>
          <span class="capsule c6"></span>
          <span class="capsule c7"></span>
        </div>
        <div class="machine-body">
          <span class="machine-handle"></span>
          <span class="machine-slot"></span>
        </div>
      </div>
    </section>

    <section class="seal-lineup-panel" aria-labelledby="sealLineupTitle">
      <h2 id="sealLineupTitle">♡ こんなのが出るかも ♡</h2>
      <div class="seal-lineup">
        <article class="seal-item">
          <span class="rarity normal">ノーマル</span>
          <div class="seal-placeholder">
            <img src="../gacha-new/assets/r/%E3%81%B2%E3%81%AA%E3%81%9F%E3%81%AE%E6%84%9B%E3%81%95%E3%82%8C%E4%BA%BA.png" alt="ひなたの愛され人">
          </div>
        </article>
        <article class="seal-item">
          <span class="rarity rare">レア</span>
          <div class="seal-placeholder">
            <img src="../gacha-new/assets/r/%E4%BD%99%E7%99%BD%E3%82%92%E9%A3%BE%E3%82%8B%E6%BC%94%E5%87%BA%E5%AE%B6.png" alt="余白を飾る演出家">
          </div>
        </article>
        <article class="seal-item">
          <span class="rarity sparkle">きらきら</span>
          <div class="seal-placeholder">
            <img src="../gacha-new/assets/sr/%E5%9C%B0%E5%9B%B3%E3%82%92%E5%BA%83%E3%81%92%E3%82%8B%E5%86%92%E9%99%BA%E5%AE%B6-sr.png" alt="地図を広げる冒険家 SR">
          </div>
        </article>
        <article class="seal-item">
          <span class="rarity special">スペシャル</span>
          <div class="seal-placeholder">
            <img src="../gacha-new/assets/sr/%E5%A4%9C%E9%A2%A8%E3%81%AE%E3%83%AD%E3%83%9E%E3%83%B3%E3%83%81%E3%82%B9%E3%83%88-sr.png" alt="夜風のロマンチスト SR">
          </div>
        </article>
        <article class="seal-item">
          <span class="rarity ultra">ウルトラ</span>
          <div class="seal-placeholder">
            <img src="../gacha-new/assets/ur/%E3%81%B2%E3%81%AA%E3%81%9F%E3%81%AE%E6%84%9B%E3%81%95%E3%82%8C%E4%BA%BA-ur.png" alt="ひなたの愛され人 UR">
          </div>
        </article>
      </div>
      <p>どのシールが出るかはおたのしみ♪</p>
    </section>

    <section class="seal-spin-panel" aria-labelledby="sealCoinTitle">
      <div class="ribbon">★ 1回まわすのに必要なコイン ★</div>
      <h2 id="sealCoinTitle"><span class="coin-icon large" aria-hidden="true"></span>1枚</h2>
      <a class="spin-button" href="spin.html">
        1回まわす
        <span class="spin-capsule" aria-hidden="true"></span>
      </a>
      <p class="spin-note"><span aria-hidden="true">ⓘ</span> ガチャから出るシールは重複することがあります</p>
    </section>
  </main>

</body>
</html>
