<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シールガチャ | Mobby</title>
  <meta name="description" content="Mobbyのシールガチャ。かわいいシールデザインを集めるガチャページです。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="seal-styles.css">
</head>
<body>
  <main class="seal-page-shell">
    <header class="seal-header">
      <button class="seal-back" type="button" onclick="window.location.href='../index.html'" aria-label="ホームに戻る">
        <span aria-hidden="true"></span>
      </button>
    </header>

    <section class="seal-hero" aria-labelledby="sealGachaTitle">
      <div class="seal-sparkles" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>

      <div class="seal-hero-copy">
        <h2 id="sealGachaTitle" class="seal-logo">
          <span>シール</span>
          <span>ガチャ</span>
        </h2>
        <p>三種のレアリティと<br>シークレットレア！？<br>可愛いデザインのシールをゲットしよう！</p>
      </div>

      <div class="seal-machine" aria-hidden="true">
        <img class="seal-machine-image" src="../gacha-new/assets/gacha/gachagacha-mobby.png" alt="">
      </div>
    </section>

    <section class="seal-lineup-panel" aria-labelledby="sealLineupTitle">
      <h2 id="sealLineupTitle">♡ こんなのが出るかも ♡</h2>
      <div class="seal-lineup">
        <article class="seal-item">
          <span class="rarity normal">R</span>
          <div class="seal-placeholder">
            <img src="../gacha-new/assets/r/%E7%A7%98%E5%AF%86%E3%81%AE%E6%98%9F.png" alt="秘密の星">
          </div>
        </article>
        <article class="seal-item">
          <span class="rarity rare">SR</span>
          <div class="seal-placeholder">
            <img src="../gacha-new/assets/sr/%E9%9D%99%E3%81%8B%E3%81%AA%E6%B8%AF%E3%81%AE%E7%9B%B8%E6%A3%92-sr.png" alt="静かな港の相棒 SR">
          </div>
        </article>
        <article class="seal-item">
          <span class="rarity sparkle">UR</span>
          <div class="seal-placeholder">
            <img src="../gacha-new/assets/ur/%E4%BD%99%E7%99%BD%E3%82%92%E9%A3%BE%E3%82%8B%E6%BC%94%E5%87%BA%E5%AE%B6-ur.png" alt="余白を飾る演出家 UR">
          </div>
        </article>
        <article class="seal-item">
          <span class="rarity special">プリ</span>
          <div class="seal-placeholder">
            <img src="../gacha-new/assets/gal/%E8%8A%B1%E6%9D%9F%E3%81%AE%E4%B8%BB%E4%BA%BA%E5%85%AC-gal.png" alt="花束の主人公 プリ">
          </div>
        </article>
      </div>
      <p>どのシールが出るかはおたのしみ♪</p>
    </section>

    <section class="seal-spin-panel" aria-label="ガチャをまわす">
      <a class="spin-button" href="spin.html">
        1回まわす
        <span class="spin-capsule" aria-hidden="true"></span>
      </a>
      <p class="spin-note"><span aria-hidden="true">ⓘ</span> ガチャから出るシールは重複することがあります</p>
    </section>
  </main>

</body>
</html>
