        const CH = {
            "こなはひ": { name: "最前列速報モビー", catch: "推しの一瞬を逃さない、現場×即レス型。", hook: "新情報は早く掴みたいし、現場の空気も浴びたい。追うことが日常のリズムになっていて、良かった瞬間はすぐ言葉にして共有すると満足度が上がるタイプ。", tough: ["供給が多い時：追えない＝負け、みたいに感じて息切れしやすい。", "現場とSNSが連続する時：楽しいのに『義務感』が出やすい。", "対処：優先度を3段階（絶対／余裕あれば／切る）にして、通知と追う時間を区切る。"], seen: "周りには「情報が早い」「フッ軽」「熱が伝染する」と映りやすい。頼られやすい分、無理していると気づかれにくい。", strengths: ["反応速度が速く、機会損失が少ない。", "現場の熱をエネルギーに変えやすい。", "推しを『見える形』で支える行動力がある。"], cautions: ["追う量が増えるほど休息が後回しになりやすい。", "『全部追う』基準で自己評価が下がりやすい。", "反応（数や手応え）に気持ちが引っ張られやすい。"], advice: ["追う対象を「絶対／余裕／切る」で固定して、毎回悩まない。", "通知は『公式だけ』などルール化して、常時フル受信をやめる。", "現場翌日は最初から予定を軽くして、回復も推し活に含める。", "投稿は「1行速報＋後日まとめ」で十分、と上限を決める。"] },
            "こなはみ": { name: "現場ハブレポモビー", catch: "箱の熱を現場で回収して、界隈に循環させる。", hook: "現場で感じた熱を、推しだけでなく箱全体・作品全体の魅力として受け取る。日々の情報も拾いつつ、共有で盛り上げることで自分も満たされるタイプ。", tough: ["追う範囲が広がる時：情報過多で『全部やらなきゃ』モードに入りやすい。", "界隈の温度差がある時：善意の共有が疲れに変わりやすい。", "対処：今期は『推し中心／箱中心／作品中心』のどれかに寄せ、ノイズはミュートで遮断する。"], seen: "界隈のハブ・まとめ役に見られやすい。頼れる人扱いされる反面、ずっと動ける人だと思われがち。", strengths: ["現場体験を言語化して、価値に変えられる。", "箱・作品の全体像を掴むのが上手い。", "共有で周りの熱量を上げられる。"], cautions: ["守備範囲が拡張し続けて、キャパが割れやすい。", "対人・界隈の空気を受けすぎて消耗しやすい。", "『役割』として動くと、楽しさが薄れやすい。"], advice: ["今期の守備範囲を先に決めて、追わない領域を作る。", "ミュート／リスト／通知整理で、情報の入口を管理する。", "レポはテンプレ化（見出し3つ）して、毎回フルで作らない。", "『参加しない日』をスケジュールに入れて、回復を確保する。"] },
            "こなしひ": { name: "無言最前列モビー", catch: "現場は全力、SNSは静か。", hook: "推しの存在を『同じ空間』で感じるのが一番の栄養。こまめに追うけど、外へ出すより内側で噛み締めることで深く満たされるタイプ。", tough: ["感情が大きい時：言葉にしない分、自分の中で渋滞しやすい。", "現場が続く時：人混み・音量・気遣いで気力が削れやすい。", "対処：終演後に『3行メモ』だけ残す（外に出さなくてOK）。余韻と回復をセットで確保する。"], seen: "一見クール。でも現場では必ずいる『静かなガチ勢』として認識されやすい。", strengths: ["一点集中で推しの変化に気づきやすい。", "外野に左右されにくく、熱が安定している。", "現場の体験を深く自分の中に残せる。"], cautions: ["感情の処理が内側で滞って疲れやすい。", "刺激が強い現場ほど回復が遅れやすい。", "孤立感が出ても相談せず抱えがち。"], advice: ["終演後は「感情／良かった点／次にしたいこと」を3行だけメモする。", "耳栓・水分・休憩導線など『疲れにくい現場設計』を持つ。", "共有は公開でなくていい。信頼できる1人に一言でも効果がある。", "現場を連続させるなら、回復日込みでスケジュールを組む。"] },
            "こなしみ": { name: "空気吸収現場モビー", catch: "作品世界を『現場の空気』で理解する。", hook: "現場の音・照明・流れ、その日の空気を受け取って作品世界を味わう。日々はこまめに追い、現場体験は内側で熟成させるタイプ。", tough: ["刺激が強い時：感動と疲労が同時に来て、翌日どっと落ちやすい。", "情報が増える時：追うほど『体験の余白』が減りやすい。", "対処：現場翌日は『回復日』に固定。アウトプットは短文で十分、と割り切る。"], seen: "感受性が高く『通』っぽい。普段は落ち着いているのに、語り出すと深いと思われる。", strengths: ["空気・流れ・演出を全体として掴める。", "余韻を熟成させて、満足感を長持ちさせられる。", "作品世界や関係性の解像度が上がりやすい。"], cautions: ["現場＋情報の二重摂取でオーバーフローしやすい。", "余韻を守ろうとして現実復帰が遅れやすい。", "広く味わうほど『消化不足』の焦りが出やすい。"], advice: ["現場後24時間は追加情報を入れない（余韻の保護）。", "『今日のテーマ』を1つに絞って味わう（演出／関係性など）。", "余韻回収はメモやプレイリストで固定し、追い足しを減らす。", "次の現場までの『軽い栄養』だけ決めて、追いすぎない。"] },
            "こうはひ": { name: "常駐即レスモビー", catch: "在宅で毎日、反応で支える。", hook: "自分の環境で推しを丁寧に味わい、日々の供給をこまめに拾って反応するタイプ。言語化と共有がモチベになる。", tough: ["タイムラインが濃い時：常駐しすぎて頭が休まらなくなりやすい。", "反応が気になる時：いいね数・既読感覚で気分が揺れやすい。", "対処：ログイン時間を『朝 / 夜だけ』などに固定。反応は『推しに出す』で完結させる。"], seen: "レスが早く、言葉が上手い人に見られやすい。いつでもいる人扱いで頼られがち。", strengths: ["継続力があり、日々の供給を取りこぼしにくい。", "反応の積み上げで応援の実感を作れる。", "在宅でも熱量を保ちやすい。"], cautions: ["常時接続で疲れやすく、睡眠が削れやすい。", "数字や反応の多寡に気分が左右されやすい。", "『見なきゃ』が強くなると楽しさが薄れる。"], advice: ["ログイン時間を固定して、だらだら滞在を切る。", "通知は重要だけに絞って、脳の割り込みを減らす。", "投稿は下書き→翌日見直しで温度を調整する。", "画面を閉じる儀式（風呂・ストレッチ等）を作って終了を明確化する。"] },
            "こうはみ": { name: "考察まとめ編集モビー", catch: "情報を整えて、箱の魅力を広げる。", hook: "作品/箱全体を俯瞰し、情報を整理して分かりやすく共有するのが得意。快適な環境でじっくり見てから言葉にするタイプ。", tough: ["ネタが多い時：整理が終わらず『未完のタスク』が溜まりやすい。", "議論が荒れる時：まとめ役ほど巻き込まれて消耗しやすい。", "対処：扱うテーマを固定（例：ライブ感想だけ/公式情報だけ）。反応は追いすぎず、出したら閉じる。"], seen: "界隈の編集長・まとめ職人に見られやすい。冷静で頼れる一方、距離があると思われることも。", strengths: ["情報整理・編集のスキルで価値を作れる。", "箱・作品の文脈をつなげて理解できる。", "落ち着いた環境で再現性高く推し活できる。"], cautions: ["完璧主義に寄ると、出せずに疲れる。", "収集→整理→出力が長期化して消耗しやすい。", "対立や解釈違いに触れるとダメージが大きい。"], advice: ["扱う範囲を固定して、入力を制限する（公式/感想/考察など）。", "1投稿の上限を決める（見出し3つまで等）。", "『暫定版で出す』を許可して、完成度より区切りを優先する。", "荒れた日は見ない。自分のログに戻る（メモ/保存）で回復する。"] },
            "こうしひ": { name: "日課深掘りモビー", catch: "マイペースに毎日、推しを深く。", hook: "推し活が生活に溶けていて、短時間でも毎日触れることで深掘りが進む。外に出さなくても満足できる静かな集中型。", tough: ["忙しい時：できない日が続くと『途切れた感』が気になりやすい。", "周りが盛り上がる時：静かに好きな自分が置いていかれた気になりやすい。", "対処：連続にこだわらず『週合計』で数える。自分用ログ（1行）で満足を可視化する。"], seen: "落ち着いていてブレない人。言葉少なめでも愛が深いと思われる。", strengths: ["安定した継続で推し活が崩れにくい。", "自分のペースで深掘りしやすい。", "ノイズに振り回されにくい。"], cautions: ["『続けられない日』への罪悪感が出やすい。", "達成感が可視化されず、満足感が薄れることがある。", "一人で完結しすぎると孤独感が出やすい。"], advice: ["連続より『週の合計』で管理して、自分を責めない。", "1行ログ（今日触れた／良かった）で満足を見える化する。", "共有は不要。必要なら身内に一言だけでも十分。", "『触れない日』を先に予定に入れて、休むことを通常運転にする。"] },
            "こうしみ": { name: "自宅シアター世界観モビー", catch: "快適な環境で、世界観に浸る。", hook: "在宅環境を整えて、作品世界・関係性・背景までじっくり味わう。毎日少しずつ触れて理解を深めるタイプ。", tough: ["沼が深い時：気づくと時間が溶けて、生活が押されやすい。", "情報が多い時：細部まで追って疲れやすい。", "対処：今週のテーマを1つに絞る（例：インタビューだけ）。ノイズはミュートして『静けさ』を守る。"], seen: "知識が深く、話すと解像度が高い。落ち着いた『世界観ガチ勢』に見られやすい。", strengths: ["世界観・関係性・背景の理解が深い。", "快適な環境で集中でき、満足度を上げやすい。", "長期的に沼を育てるのが上手い。"], cautions: ["深掘りが止まらず生活を圧迫しやすい。", "調べすぎて満腹になり、楽しいより疲れるに寄りやすい。", "情報を入れ続けて余韻が薄くなりやすい。"], advice: ["週テーマ制で範囲を絞り、深掘りの方向を固定する。", "『今日はここまで』の終了ラインを決めてから始める。", "リンクは保存して即読みにしない（入力を後ろへ送る）。", "体を動かす休憩をルール化して、没入の反動を減らす。"] },
            "まなはひ": { name: "イベント期爆速レポモビー", catch: "普段は溜めて、ここぞで現場＆発信。", hook: "日常は無理に追わず、イベントや大きな供給が来たときに一気に追って現場にも出る。熱が上がった瞬間のアウトプットが強いタイプ。", tough: ["イベント前：直前に情報を詰め込んで疲れやすい。", "イベント後：燃え尽きで一気に空っぽになりやすい。", "対処：事前は『最低限の予習』だけ。翌日は休む前提で予定を切る。"], seen: "イベント期に突然強くなる人。勢いのあるレポを書く人、と見られやすい。", strengths: ["ここぞの瞬間に爆発力が出る。", "短期間でキャッチアップして現場に強い。", "熱のある言葉で周りを動かしやすい。"], cautions: ["直前詰め込みで当日の体力が落ちやすい。", "終わった後の落差が大きくなりやすい。", "追えてない期間に罪悪感が出やすい。"], advice: ["事前は『最低限セット』（公式1本＋要点メモ）だけにする。", "当日の持ち物・導線はテンプレ化して、脳の負荷を減らす。", "終了後はSNSを短時間で切って、睡眠と回復を最優先にする。", "後追いは翌週に回して、現場体験を先に消化する。"] },

            const { code, pcts } = computeResult(); const ch = CH[code]; if (!ch) { renderIntro(); return; } const app = document.getElementById("app");
            const imgPath = `img/${ch.name}.jpg`;
            let html = `<div class="fade-in"><div class="panel result-hero">
    <p class="kicker">あなたの推し活タイプは…</p>
    <h2 class="big" style="font-size:28px;">🎤 ${ch.name}</h2>
    <p style="font-family:monospace;color:var(--text-sub);font-size:13px;margin-bottom:16px;">${code}</p>
    <div class="char-image-placeholder"><img src="${imgPath}" alt="${ch.name}" onerror="this.parentElement.innerHTML='Image coming soon'"></div>
    <p style="font-size:18px;font-weight:600;color:var(--accent);margin:16px 0 8px;">${ch.catch}</p>
    <p class="text-body" style="max-width:560px;margin:0 auto;">${ch.hook}</p>
    </div>
    <div class="panel"><h3 style="margin:0 0 20px;">📊 あなたの4軸バランス</h3>`;
            ["A", "B", "C", "D"].forEach(k => {
                const ax = AXES[k]; const p = pcts[k];
                html += `<div class="axis-row"><span class="axis-name">${ax.name}</span><div class="axis-labels"><span>${ax.left}</span><span>${ax.right}</span></div><div class="axis-track"><div class="axis-center"></div><div class="axis-dot" style="left:${p}%"></div></div><div class="axis-meta"><span>${Math.round(100 - p)}%</span><span>${Math.round(p)}%</span></div></div>`;
            });
            html += `</div><div class="card-grid">
    <div class="info-card"><h3>💪 強み</h3><ul>${ch.strengths.map(s => `<li>${s}</li>`).join("")}</ul></div>
    <div class="info-card"><h3>👁️ 周りからの見え方</h3><p style="font-size:13px;line-height:1.7;">${ch.seen}</p></div>
    <div class="info-card"><h3>⚠️ 注意点</h3><ul>${ch.cautions.map(s => `<li>${s}</li>`).join("")}</ul></div>
    <div class="info-card"><h3>😰 しんどくなりやすい場面</h3><ul>${ch.tough.map(s => `<li>${s}</li>`).join("")}</ul></div>
    </div>
    <div class="panel" style="margin-top:24px;"><h3 style="margin:0 0 16px;">💡 推し活を長く楽しむために</h3><ul style="padding-left:20px;font-size:14px;line-height:2;">${ch.advice.map(s => `<li>${s}</li>`).join("")}</ul></div>
    <div class="panel" style="text-align:center;margin-top:24px;">
    <h3 style="margin:0 0 16px;">結果をシェア 🎉</h3>
    <div class="share-buttons">
    <a class="share-btn share-x" href="https://twitter.com/intent/tweet?text=${encodeURIComponent(`推し活モビー診断の結果は「${ch.name}」でした！🎤✨\n${ch.catch}\n`)}&url=${encodeURIComponent("https://www.mobby.online/16stan")}" target="_blank" rel="noopener">𝕏 でシェア</a>
    <a class="share-btn share-line" href="https://social-plugins.line.me/lineit/share?url=${encodeURIComponent("https://www.mobby.online/16stan")}&text=${encodeURIComponent(`推し活モビー診断の結果は「${ch.name}」でした！`)}" target="_blank" rel="noopener">LINE でシェア</a>
    </div></div>
    <div style="text-align:center;margin-top:24px;"><button onclick="resetState();render();" style="font-size:14px;">もう一度診断する</button></div>
    </div>`; app.innerHTML = html;
        }
        function renderCharacters() {
            const app = document.getElementById("app"); const codes = Object.keys(CH);
            let html = `<div class="fade-in"><div class="panel"><p class="kicker">全16タイプ</p><h2 class="big">推し活モビーキャラ一覧</h2><p class="text-body">タップすると詳細が見られます</p></div><div class="char-grid">`;
            codes.forEach(code => {
                const c = CH[code];
                html += `<div class="char-card" onclick="showCharDetail('${code}')">
    <div class="char-card-image"><img src="img/${c.name}.jpg" alt="${c.name}" onerror="this.style.display='none'"></div>
    <div class="char-card-name">${c.name}</div>
    <span class="char-card-type">${code}</span>
    <p class="char-card-desc">${c.catch}</p></div>`;
            });
            html += `</div></div>`; app.innerHTML = html;
        }
        function showCharDetail(code) {
            const c = CH[code]; if (!c) return;
            const existing = document.querySelector(".char-modal-overlay"); if (existing) existing.remove();
            const overlay = document.createElement("div"); overlay.className = "char-modal-overlay";
            overlay.innerHTML = `<div class="char-modal">
    <button class="char-modal-close" onclick="this.closest('.char-modal-overlay').remove()">✕</button>
    <div style="text-align:center;margin-bottom:20px;">
    <div class="char-image-placeholder" style="max-width:240px;"><img src="img/${c.name}.jpg" alt="${c.name}" onerror="this.parentElement.innerHTML='Image'"></div>
    <h2 style="margin:12px 0 4px;font-size:22px;">${c.name}</h2>
    <p style="font-family:monospace;color:var(--text-sub);font-size:12px;">${code}</p></div>
    <p style="color:var(--accent);font-weight:600;margin-bottom:8px;">${c.catch}</p>
    <p style="font-size:14px;line-height:1.7;margin-bottom:20px;">${c.hook}</p>
    <div class="info-card" style="margin-bottom:12px;"><h3>💪 強み</h3><ul>${c.strengths.map(s => `<li>${s}</li>`).join("")}</ul></div>
    <div class="info-card" style="margin-bottom:12px;"><h3>👁️ 見え方</h3><p style="font-size:13px;line-height:1.7;">${c.seen}</p></div>
    <div class="info-card" style="margin-bottom:12px;"><h3>⚠️ 注意点</h3><ul>${c.cautions.map(s => `<li>${s}</li>`).join("")}</ul></div>
    <div class="info-card" style="margin-bottom:12px;"><h3>😰 しんどい場面</h3><ul>${c.tough.map(s => `<li>${s}</li>`).join("")}</ul></div>
    <div class="info-card"><h3>💡 アドバイス</h3><ul>${c.advice.map(s => `<li>${s}</li>`).join("")}</ul></div>
    </div>`;
            overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); }; document.body.appendChild(overlay);
        }
        function showTypeGuide() {
            const existing = document.querySelector(".char-modal-overlay"); if (existing) existing.remove();
            const overlay = document.createElement("div"); overlay.className = "char-modal-overlay";
            let html = `<div class="char-modal"><button class="char-modal-close" onclick="this.closest('.char-modal-overlay').remove()">✕</button>
    <h2 style="margin:0 0 20px;font-size:20px;">タイプ解説</h2>
    <p style="font-size:14px;color:var(--text-sub);margin-bottom:20px;">推し活モビー診断は4つの軸であなたの推し活スタイルを分析します。各軸の組み合わせで16タイプが決まります。</p>`;
            ["A", "B", "C", "D"].forEach(k => {
                const ax = AXES[k];
                html += `<div style="background:var(--surface2);padding:16px;border-radius:12px;margin-bottom:12px;">
    <h3 style="margin:0 0 8px;font-size:15px;">軸${k}: ${ax.name}</h3>
    <div style="display:flex;justify-content:space-between;font-size:13px;">
    <span style="color:#e86aaf;">← ${ax.left}（${ax.leftCode}）</span>
    <span style="color:#9b6dff;">${ax.right}（${ax.rightCode}）→</span>
    </div></div>`;
            });
            html += `<p style="font-size:13px;color:var(--text-sub);margin-top:16px;">例：「こなはひ」= 日常派 × 現場派 × 発信派 × 単体派</p></div>`;
            overlay.innerHTML = html; overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); }; document.body.appendChild(overlay);
        }
        document.getElementById("navDiagnosis").onclick = (e) => { e.preventDefault(); if (state.step === "characters") { state.step = "intro"; saveState(); } render(); };
        document.getElementById("navCharacters").onclick = (e) => { e.preventDefault(); state.step = "characters"; saveState(); render(); };
        document.getElementById("btnReset").onclick = () => { if (confirm("診断をリセットしますか？")) { resetState(); render(); } };
        document.getElementById("btnTypeGuide").onclick = () => { showTypeGuide(); };
        loadState(); render();
    </script>
    <noscript>
        <div style="padding:40px 20px;max-width:800px;margin:0 auto;font-family:sans-serif;">
            <h1>推し活モビー診断 | あなたの推し活スタイルを16種類で診断</h1>
            <p>推し活モビー診断は、40問の質問に答えるだけで、あなたの推し活スタイルを16種類から無料で診断できるサービスです。</p>
            <h2>あなたの推し活タイプは？</h2>
            <p>モビー診断では、以下の4つの軸であなたの推し活スタイルを分析します：</p>
            <ul>
                <li><strong>追い方</strong> — 日常派 vs まとめ派</li>
                <li><strong>接点</strong> — 現場派 vs 在宅派</li>
                <li><strong>関わり方</strong> — 発信派 vs 静観派</li>
                <li><strong>焦点</strong> — 単体派 vs 周辺派</li>
            </ul>
            <p>この診断を利用するにはJavaScriptを有効にしてください。</p>
        </div>
    </noscript>
