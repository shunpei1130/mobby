    <script>
        async function submitLead(p) { try { const r = await fetch("/api/lead", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(p) }); const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d?.error || "送信失敗"); return d; } catch (e) { console.error("[Stan] Lead error:", e); throw e; } }
        async function submitDiagnosis(p) { try { const r = await fetch("/api/diagnosis", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(p) }); const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d?.error || "保存失敗"); return d; } catch (e) { console.error("[Stan] Diag error:", e); throw e; } }
        const AXES = { A: { key: "A", name: "追い方", left: "日常派", right: "まとめ派", leftCode: "こ", rightCode: "ま" }, B: { key: "B", name: "接点", left: "現場派", right: "在宅派", leftCode: "な", rightCode: "う" }, C: { key: "C", name: "関わり方", left: "発信派", right: "静観派", leftCode: "は", rightCode: "し" }, D: { key: "D", name: "焦点", left: "単体派", right: "周辺派", leftCode: "ひ", rightCode: "み" } };
        const QUESTIONS = [
            { id: "A1", axis: "A", text: "新情報が出ると、なるべく早く確認する。", reverse: false }, { id: "A2", axis: "A", text: "推し関連の通知は、基本オンにしている。", reverse: false }, { id: "A3", axis: "A", text: "忙しい日でも、数分でも推しに触れる時間を作る。", reverse: false }, { id: "A4", axis: "A", text: "推しの情報収集は、ほぼ毎日の習慣だ。", reverse: false }, { id: "A5", axis: "A", text: "推し活は、生活の中に自然に組み込まれている。", reverse: false },
            { id: "A6", axis: "A", text: "配信・放送・試合は、リアタイよりアーカイブで追うことが多い。", reverse: true }, { id: "A7", axis: "A", text: "応援の熱量は、普段よりイベント期に一気に上がりやすい。", reverse: true }, { id: "A8", axis: "A", text: "過去コンテンツは、まとまった休みにまとめて消化する。", reverse: true }, { id: "A9", axis: "A", text: "推し活の予定は、直前に決めることが多い。", reverse: true }, { id: "A10", axis: "A", text: "推しの動きが多い時は、優先度を決めて追う。", reverse: true },
            { id: "B1", axis: "B", text: "行ける状況なら、現場（ライブ・イベント・試合など）に足を運びたい。", reverse: false }, { id: "B2", axis: "B", text: "推しの良さは、その場の熱や空気で増すと思う。", reverse: false }, { id: "B3", axis: "B", text: "応援の満足感は、同じ空間にいることで大きくなる。", reverse: false }, { id: "B4", axis: "B", text: "現場の音・歓声・空気感は、推し活に欠かせない。", reverse: false }, { id: "B5", axis: "B", text: "推し活では、快適さより臨場感を優先したい。", reverse: false },
            { id: "B6", axis: "B", text: "推しの良さは、落ち着いた環境でじっくり見る方が引き出せると思う。", reverse: true }, { id: "B7", axis: "B", text: "推し活は、移動や待ち時間が少ない方が満足度が上がる。", reverse: true }, { id: "B8", axis: "B", text: "推し活は、自分のペースで楽しめることが一番大事だ。", reverse: true }, { id: "B9", axis: "B", text: "推し活は、在宅中心で環境を整える方がしっくりくる。", reverse: true }, { id: "B10", axis: "B", text: "推しは、生で見なくても配信や映像で十分満足できる。", reverse: true },
            { id: "C1", axis: "C", text: "推し活の感想は、SNSなどに投稿したくなる。", reverse: false }, { id: "C2", axis: "C", text: "いいね・コメント・投票などの反応は、こまめにする方だ。", reverse: false }, { id: "C3", axis: "C", text: "推しの良さを言葉で語るのが好きだ。", reverse: false }, { id: "C4", axis: "C", text: "推し活の記録は、人に見える形で残すことが多い。", reverse: false }, { id: "C5", axis: "C", text: "推しを応援する気持ちは、見える形で示したい。", reverse: false },
            { id: "C6", axis: "C", text: "推し活の感想は、自分の中で味わっておきたい。", reverse: true }, { id: "C7", axis: "C", text: "界隈の情報交換は、参加するより眺める方が心地いい。", reverse: true }, { id: "C8", axis: "C", text: "推しの話題が出ても、自分からはあまり話さず聞き役になりがちだ。", reverse: true }, { id: "C9", axis: "C", text: "推し活では、熱を外に出すより守ることが大事だと思う。", reverse: true }, { id: "C10", axis: "C", text: "SNSは距離を取りつつ、必要な時だけ使いたい。", reverse: true },
            { id: "D1", axis: "D", text: "推し活の関心の中心は、基本的に推し本人だ。", reverse: false }, { id: "D2", axis: "D", text: "推し以外のメンバー／登場人物は、必要な分だけ追えば十分だと思う。", reverse: false }, { id: "D3", axis: "D", text: "公式の動きで一番嬉しいのは、推しが目立つ瞬間だ。", reverse: false }, { id: "D4", axis: "D", text: "現場や配信は、推しのパートを最優先で追う。", reverse: false }, { id: "D5", axis: "D", text: "理想の推し活は、一点集中で深掘りすることだ。", reverse: false },
            { id: "D6", axis: "D", text: "推しは入口で、グループ／作品全体も自然に好きになりやすい。", reverse: true }, { id: "D7", axis: "D", text: "推しの関係性や共演者も含めて味わう方が楽しい。", reverse: true }, { id: "D8", axis: "D", text: "推し活の楽しさは、世界観や物語にもあると思う。", reverse: true }, { id: "D9", axis: "D", text: "周辺文化（用語・歴史・界隈ネタなど）を知るほど楽しい。", reverse: true }, { id: "D10", axis: "D", text: "応援の対象は、推しの成長だけでなく全体の成功にも向く。", reverse: true }
        ];
        const CH = {
            "こなはひ": {
                name: "現場至上主義推しモビー", catch: "現場で毎日、推しを最前線で上げる。", hook: "生活に現場が組み込まれていて、推しの「今この瞬間」を取り逃さないタイプ。現場の熱と発信の勢いで、推し単体の魅力をまっすぐ届ける。", tough: ["現場が続く時：体力とお金が削れて焦りやすい。", "取れない時：置いていかれ感が出やすい。", "対処：「行く現場／見送る現場」のルールを先に決める（優先順位表）。"], seen: "フッ軽で頼れる人。現場に強い「前線の人」として一目置かれやすい。", strengths: ["行動力があり、現場のチャンスを逃しにくい。", "熱量のある発信で推しの価値を押し上げられる。", "「今の推し」に強く、空気を変えられる。"], cautions: ["予定と体力が推し中心になり、回復が追いつきにくい。", "参加できない時に自己否定に寄りやすい。", "発信が義務になると楽しさが薄れる。"], advice: ["週1は「推しオフ日」を固定して回復を確保。", "発信は短文テンプレでOK（例：良かった点3つ）。", "体調管理も推しへの投資、って捉えると折れにくい。"]
            },
            "こなはみ": { name: "箱推し熱心モビー", catch: "現場で毎日、箱の熱をみんなで回す。", hook: "推し本人だけでなく、グループ・作品・チーム・界隈ごと好きになれるタイプ。現場で拾った熱を発信して、仲間の熱量も上げていく。", tough: ["界隈が荒れる時：巻き込まれて心が削れやすい。", "頼られすぎる時：ハブ役が義務になる。", "対処：反応する範囲を線引き（見る場所・返す相手を限定）。"], seen: "「その界隈の中心にいる人」。相談されやすく、輪を作れる人に見られがち。", strengths: ["周辺ごと愛せるので推し活の幸福度が高い。", "界隈のムードメーカーになりやすい。", "情報や魅力を循環させるのが得意。"], cautions: ["人間関係の負荷（気遣い/揉め事）を受けやすい。", "温度差に疲れて、推しより界隈が重くなることがある。", "追う範囲が広がりすぎて消耗しやすい。"], advice: ["共有は「週◯回まで」と上限を作る。", "しんどい日は推しを見るだけに戻す。", "界隈は遊び場。職場にしない。"] },
            "こなしひ": { name: "ソロ神聖視推しモビー", catch: "現場で毎日、推しを静かに守り抜く。", hook: "現場には行く。けど騒がない。比較や雑音から距離を取り、推し単体の尊さを自分の中で丁寧に守るタイプ。", tough: ["周りが盛り上がってる時：置いていかれ感。", "推しが叩かれる時：守りたい気持ちが過熱。", "対処：安全圏を小さく確保（信頼できる場所・人だけ）。"], seen: "クールで芯がある人。黙って強い「本気の人」に見られやすい。", strengths: ["推しへの集中力が高く、心がブレにくい。", "自分のペースで推しを大事にできる。", "体験を深く自分のものにできる。"], cautions: ["孤独になりやすく、共有不足で息苦しくなることがある。", "情報を遮断しすぎると取りこぼしが出る。", "守りが強すぎると攻撃的になりやすい（正義感過多）。"], advice: ["共有は一言でもOK（「今日ここが好き」だけで十分）。", "情報源を2〜3個に固定して安心を作る。", "推しを守るために自分を削らない、が最優先。"] },
            "こなしみ": { name: "作品反復推しモビー", catch: "現場で毎日、世界観を体に染み込ませる。", hook: "推し本人だけでなく、作品・演出・空気感まで含めて味わい、繰り返し反芻して理解を深めるタイプ。静かだけど、体験の深度がすごい。", tough: ["重い回：余韻が強すぎて引きずる。", "現場続き：感情の回復が間に合わない。", "対処：余韻日を予定に入れる（翌日は予定を軽く）。"], seen: "センスが良い人、通な人。「わかってる人」枠に見られやすい。", strengths: ["「現場の空気」から読み取る力がある。", "余韻が長く、推し活が豊かになる。", "周辺（曲・脚本・制作）まで楽しめる。"], cautions: ["反芻が強すぎると現実に戻りづらい。", "情緒が揺れやすく、回復に時間がかかる。", "伝えないと周りに熱量が伝わりにくい。"], advice: ["帰還ルート（散歩/音楽/風呂/日記）を決める。", "語るならワンフレーズで十分。", "反復は才能。あなたの美学でOK。"] },
            "こうはひ": { name: "リアクション職人推しモビー", catch: "在宅で毎日、反応で支える。", hook: "自分の環境で推しを丁寧に味わい、日々の供給をこまめに拾って反応するタイプ。言語化と共有がモチベになりやすく、「届く応援」を積み上げていく。", tough: ["TLが濃い時：常駐しすぎて頭が休まらない。", "反応が気になる時：いいね数・既読感覚で揺れる。", "対処：ログインを「朝/夜だけ」に固定。反応は「推しに出す」で完結。"], seen: "レスが早く、言葉が上手い人に見られやすい。「いつもいる」「頼れる」枠になりがち。", strengths: ["継続力があり、供給を取りこぼしにくい。", "いいね・コメント・投票などリアクションで支援が形になる。", "在宅でも熱量が落ちにくい。"], cautions: ["常時接続で疲れやすく、睡眠が削れやすい。", "数字や反応の多寡に気分が左右されやすい。", "「見なきゃ」が強くなると楽しさが薄れる。"], advice: ["通知は重要だけに絞る。", "投稿は下書き→翌日見直しで温度調整。", "画面を閉じる儀式を作って終了を明確化する。"] },
            "こうはみ": { name: "布教うまい推しモビー", catch: "在宅で毎日、推しの入口を作る。", hook: "推しの良さを見つけて、相手に合わせて刺さる1本を渡せるタイプ。周辺（作品・制作・メンバー）まで含めて魅力を広げられる。", tough: ["反応が薄い時：虚しさで熱が冷める。", "界隈が広がりすぎる時：空気変化で疲れる。", "対処：布教は推しの良さ確認として自分のためにやる。"], seen: "「沼の案内人」。紹介が上手くて信頼されやすい。", strengths: ["魅力を短く伝えるのが上手い。", "入口を作って界隈を育てられる。", "在宅でも熱量を回し続けられる。"], cautions: ["布教が過ぎると押し付けに見えやすい。", "相手の反応に期待しすぎると疲れる。", "数字（拡散/新規）に心が寄ると消耗する。"], advice: ["「初見用おすすめ3本」をテンプレ化。", "求められた時だけ渡す（押し付け防止）。", "布教しない日も推し活。休むのが強い。"] },
            "こうしひ": { name: "やさしい見守り推しモビー", catch: "在宅で毎日、推しを静かに大事にする。", hook: "推しの心身と安全を最優先に、距離感を丁寧に保つタイプ。詮索や過剰な期待をせず、健全な応援で長く推す美学がある。", tough: ["推しが心配な時：情報を追いすぎて不安が増える。", "界隈が荒れる時：守りたい気持ちが過熱する。", "対処：公式情報を見る時間を決めて、深追いを止める。"], seen: "落ち着いていて大人。安心感のある人に見られやすい。", strengths: ["推しにも自分にも優しい推し方ができる。", "ノイズや炎上に巻き込まれにくい。", "長期的に推しを支え続けられる。"], cautions: ["守りに寄りすぎると熱を出しづらい。", "感情を溜めて、ある日どっと疲れることがある。", "正義感が強まると自他に厳しくなりがち。"], advice: ["「推しを守る＝自分も守る」を最優先ルールに。", "情報遮断日（週1でも）で心を回復させる。", "静かな応援は弱さじゃない。強さとして誇っていい。"] },
            "こうしみ": { name: "尊い記録係推しモビー", catch: "在宅で毎日、尊さを残して守る。", hook: "スクショ・メモ・日記・プレイリストなどで、推しと周辺の良さを丁寧に保管するタイプ。静観だけど、愛は深くて確か。", tough: ["供給が多い時：全部残したくなって追いつかない。", "未整理が溜まる時：未処理がストレスになる。", "対処：残す基準を決める（1日3枚・1投稿1行など）。"], seen: "丁寧でセンスが良い人。「保存神」「まとめ上手」扱いされやすい。", strengths: ["記録が資産になる（あとで自分を救う）。", "魅力を言語化・整理できる。", "周辺込みで推し活の解像度が上がる。"], cautions: ["「残さなきゃ」が強いと疲れる。", "保存に集中して体験が薄くなることがある。", "整理が終わらず沼りやすい。"], advice: ["記録は軽量版でOK（タイトル＋一言）。", "月1で神回だけまとめを作ると達成感が出る。", "記録は愛の形。自信を持っていい。"] },
            "まなはひ": { name: "ご褒美課金推しモビー", catch: "節目で現場、そこで全部出す。", hook: "普段は追いすぎないけど、ここぞの現場で一気に熱が爆発するタイプ。単推しへの集中と、節目の投下がとにかく強い。", tough: ["連続で節目が来る時：判断疲れ。", "現場前：準備が間に合わず焦る。", "対処：年間の課金枠を先に決めて迷いを減らす。"], seen: "賢い推し方をしている人。「メリハリが上手い」枠。", strengths: ["使う時にしっかり使える決断力。", "推し活と生活のバランスが取りやすい。", "節目の熱量が大きく思い出が濃い。"], cautions: ["節目が重なると出費と疲労が急増する。", "情報差で焦りやすい。", "行く価値の判定で迷いがち。"], advice: ["「今年は2現場＋1配信」など枠を設定。", "行く/行かない基準をメモ化。", "節目以外は軽く在宅で十分。"] },
