<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>絵本を見る | Mobby</title>
  <meta name="description" content="Mobbyの絵本を縦スクロールで読めるページです。">
  <style>
    * {
      box-sizing: border-box;
    }

    html {
      background: #f8efe2;
    }

    body {
      margin: 0;
      color: #32251c;
      background:
        linear-gradient(90deg, rgba(168, 105, 58, 0.12) 0, rgba(168, 105, 58, 0) 8%, rgba(168, 105, 58, 0) 92%, rgba(168, 105, 58, 0.12) 100%),
        #f8efe2;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    }

    .ehon-header {
      position: sticky;
      top: 0;
      z-index: 10;
      width: 100%;
      padding: 10px 12px;
      background: rgba(248, 239, 226, 0.92);
      border-bottom: 1px solid rgba(112, 76, 45, 0.18);
      backdrop-filter: blur(10px);
    }

    .ehon-header-inner {
      width: min(1100px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) 44px;
      align-items: center;
      gap: 8px;
    }

    .ehon-back {
      width: 44px;
      height: 44px;
      display: inline-grid;
      place-items: center;
      border: 1px solid rgba(93, 59, 32, 0.24);
      border-radius: 999px;
      color: #5d3b20;
      background: #fff8ed;
      font-size: 1.35rem;
      font-weight: 900;
      line-height: 1;
      text-decoration: none;
      box-shadow: 0 8px 16px rgba(91, 67, 42, 0.1);
    }

    .ehon-title {
      margin: 0;
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      line-height: 1.35;
      text-align: center;
    }

    .ehon-page-stack {
      width: min(1100px, 100%);
      margin: 0 auto;
      padding: 0;
      background: #fffaf2;
      box-shadow:
        -10px 0 22px rgba(91, 67, 42, 0.08),
        10px 0 22px rgba(91, 67, 42, 0.08);
    }

    .ehon-page-stack img {
      width: 100%;
      height: auto;
      max-width: 100%;
      object-fit: contain;
      margin: 0;
      display: block;
      border: 0;
      border-radius: 0;
      background: #fffaf2;
      vertical-align: top;
    }

    .ehon-footer {
      width: min(1100px, 100%);
      margin: 0 auto;
      padding: 18px 14px 28px;
      background: #fffaf2;
      text-align: center;
    }

    .ehon-footer a {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      border: 1px solid rgba(93, 59, 32, 0.24);
      border-radius: 999px;
      color: #5d3b20;
      background: #fff8ed;
      font-size: 0.92rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-decoration: none;
      box-shadow: 0 8px 16px rgba(91, 67, 42, 0.1);
    }

    @media (max-width: 520px) {
      .ehon-header {
        padding: 8px;
      }

      .ehon-header-inner {
        grid-template-columns: 40px minmax(0, 1fr) 40px;
      }

      .ehon-back {
        width: 40px;
        height: 40px;
        font-size: 1.2rem;
      }

      .ehon-title {
        font-size: 0.9rem;
      }
    }
  </style>
  <link rel="stylesheet" href="../assets/mobby-guide.css">
</head>
<body>
  <header class="ehon-header">
    <div class="ehon-header-inner">
      <a class="ehon-back" href="../index.html" aria-label="メインページへ戻る">‹</a>
      <h1 class="ehon-title">絵本を見る</h1>
      <span aria-hidden="true"></span>
