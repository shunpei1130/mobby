    function getQuestionOrder(){
      if(Array.isArray(state.questionOrder) && state.questionOrder.length === QUESTIONS.length) return state.questionOrder;
      state.questionOrder = AXIS_KEYS.flatMap(axis => QUESTIONS.filter(q => q.axis === axis)).map(q => q.id);
      saveState();
      return state.questionOrder;
    }
    function getQuestions(){ return getQuestionOrder().map(id => QUESTIONS.find(q => q.id === id)).filter(Boolean); }
    function calcResult(){
      const SCALE = 7, MID = 4, MAX_DEV = 3, GAMMA = 1.35, EXTREME_BONUS = 0.35, COHERENCE_SHRINK = 0.20;
      const raw = Object.fromEntries(AXIS_KEYS.map(k => [k, 0]));
      const maxRaw = Object.fromEntries(AXIS_KEYS.map(k => [k, 0]));
      const absSum = Object.fromEntries(AXIS_KEYS.map(k => [k, 0]));
      const shapeAnswer = ans => {
        const centered = MID - ans;
        const t = centered / MAX_DEV;
        const mag = Math.min(1, Math.abs(t));
        if(mag === 0) return 0;
        const bonus = mag === 1 ? EXTREME_BONUS : 0;
        return Math.sign(t) * Math.min(1, Math.pow(mag, GAMMA) + bonus);
      };
      QUESTIONS.forEach(q => {
        const ans = Number(state.answers[q.id] || MID);
        const shaped = shapeAnswer(ans) * (q.reverse ? -1 : 1) * q.weight;
        raw[q.axis] += shaped;
        maxRaw[q.axis] += q.weight * (1 + EXTREME_BONUS);
        absSum[q.axis] += Math.abs(shaped);
      });
      const norm = {};
      const pos = {};
      const hard = {};
      AXIS_KEYS.forEach(k => {
        const coherence = absSum[k] ? Math.min(1, Math.abs(raw[k]) / absSum[k]) : 1;
        const adjusted = raw[k] * (1 - COHERENCE_SHRINK * (1 - coherence));
        norm[k] = Math.max(-1, Math.min(1, adjusted / Math.max(1, maxRaw[k])));
        const axis = AXES[k];
        pos[k] = norm[k] >= 0 ? axis.leftCode : axis.rightCode;
        hard[k] = Math.abs(norm[k]) >= 0.62;
      });
      const code = AXIS_KEYS.map(k => pos[k]).join("");
      const answered = Object.values(state.answers).map(Number);
      const decisiveness = AXIS_KEYS.reduce((sum, k) => sum + Math.abs(norm[k]), 0) / AXIS_KEYS.length;
      const confidenceLevel = decisiveness >= 0.62 ? "high" : decisiveness >= 0.34 ? "mid" : "soft";
      const confidenceLabel = confidenceLevel === "high" ? "くっきりめ" : confidenceLevel === "mid" ? "ほどよい確度" : "やわらか判定";
      const straightLine = answered.length === QUESTIONS.length && new Set(answered).size <= 2;
      const adjacentTypes = [];
      AXIS_KEYS.forEach(k => {
        if(Math.abs(norm[k]) < 0.22) {
          const axis = AXES[k];
          const flipped = norm[k] >= 0 ? axis.rightCode : axis.leftCode;
          const altCode = AXIS_KEYS.map(a => a === k ? flipped : pos[a]).join("");
          if(CHARACTERS[altCode] && altCode !== code) adjacentTypes.push({axis:k, code:altCode, name:CHARACTERS[altCode].name});
        }
      });
      return {code, char: CHARACTERS[code], norm, pos, hard, decisiveness, confidenceLevel, confidenceLabel, straightLine, adjacentTypes};
    }
    function isComplete(){ return Object.keys(state.answers || {}).length >= QUESTIONS.length; }
    function socialLinksHtml(){
      return `<div class="social-links">${SOCIAL_LINKS.map((l, i) => `<a class="social-link ${i === 0 ? "primary" : ""}" href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`).join("")}</div>`;
    }
    function sceneHtml(src, alt, variant){
      return `<div class="mobby-scene ${variant}"><img class="scene-bg" src="${src}" alt="${alt}"><img class="mobby-overlay" src="../img/Mobby.png" alt="Mobby"></div>`;
    }
    function render(){
      document.getElementById("navDiagnosis").classList.toggle("active", state.step !== "characters");
      document.getElementById("navCharacters").classList.toggle("active", state.step === "characters");
      if(state.step === "intro") renderIntro();
      else if(state.step === "quiz") renderQuiz();
      else if(state.step === "characters") renderCharacters();
      else renderResult();
      window.scrollTo({top:0, behavior:"smooth"});
    }
    function renderIntro(){
      const count = Object.keys(state.answers || {}).length;
      app.innerHTML = `
        <section class="panel fade-in result-hero">
          ${sceneHtml("img/shoki-mobby-osaka-style.png", "Shoki様の世界観に合わせた垢抜けスタイル", "hero")}
          <p class="kicker">Mobby rough preview</p>
          <h2 class="big">Shoki 垢抜け<br>グロウ診断</h2>
          <p class="text-body" style="max-width:460px; margin:0 auto 30px;">直感で選ぶ20問から、自分磨き、ファッションの見せ方、ファンとつながるムードを診断します。Shoki様向けの参加型ラフ案です。</p>
          <button class="primary" id="btnStart" style="padding:16px 32px; font-size:16px;">${count > 0 ? "診断を再開する" : "診断をはじめる"}</button>
          ${count > 0 ? `<p style="font-size:12px; color:#747474; margin-top:16px;">${count} / ${QUESTIONS.length}問 回答済み</p>` : ""}
        </section>`;
      document.getElementById("btnStart").onclick = () => {
        const idx = getQuestions().findIndex(q => !state.answers[q.id]);
        state.page = Math.max(0, Math.floor((idx < 0 ? 0 : idx) / PAGE_SIZE));
        state.step = "quiz";
        saveState();
        render();
      };
    }
    function renderQuiz(){
      const qs = getQuestions();
      const start = state.page * PAGE_SIZE;
      const pageQs = qs.slice(start, start + PAGE_SIZE);
      const answered = Object.keys(state.answers || {}).length;
      const progress = Math.round((answered / QUESTIONS.length) * 100);
      app.innerHTML = `
        <section class="panel fade-in">
          <div class="progress-wrap">
            <div class="progress-meta"><span>${Math.min(start + 1, QUESTIONS.length)} - ${Math.min(start + PAGE_SIZE, QUESTIONS.length)} / ${QUESTIONS.length}</span><span>${progress}%</span></div>
            <div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div>
          </div>
          ${pageQs.map((q, i) => renderQuestion(q, start + i)).join("")}
          <div class="actions">
            <button id="btnPrev" ${state.page === 0 ? "disabled" : ""}>戻る</button>
            <button class="primary" id="btnNext">${start + PAGE_SIZE >= QUESTIONS.length ? "結果を見る" : "次へ"}</button>
          </div>
        </section>`;
      pageQs.forEach(q => {
        document.querySelectorAll(`[data-q="${q.id}"]`).forEach(btn => {
          btn.onclick = () => {
            state.answers[q.id] = Number(btn.dataset.value);
            saveState();
            renderQuiz();
          };
        });
      });
      document.getElementById("btnPrev").onclick = () => { if(state.page > 0){ state.page -= 1; saveState(); render(); } };
      document.getElementById("btnNext").onclick = () => {
        const allAnswered = pageQs.every(q => state.answers[q.id]);
        if(!allAnswered) return;
        if(start + PAGE_SIZE >= QUESTIONS.length){
          state.step = "result";
          saveState();
          render();
        } else {
          state.page += 1;
          saveState();
          render();
        }
      };
    }
    function renderQuestion(q, idx){
      const selected = state.answers[q.id];
      const buttons = [1,2,3,4,5,6,7].map(v => {
        const side = v < 4 ? "left" : v > 4 ? "right" : "mid";
        return `<button class="likert-btn ${side} ${selected === v ? "selected" : ""}" data-q="${q.id}" data-value="${v}" aria-label="${idx + 1}問目 ${v}"></button>`;
      }).join("");
      return `<div class="qCard fade-in"><p class="kicker">Q${idx + 1}</p><p class="qText">${q.text}</p><div class="likert-labels"><span>そう思う</span><span>どちらでもない</span><span>そう思わない</span></div><div class="likert-buttons">${buttons}</div></div>`;
    }
    function renderAxis(result){
      return AXIS_KEYS.map(k => {
        const axis = AXES[k];
        const pct = 50 - result.norm[k] * 45;
        return `<div class="axis-row"><div class="axis-meta"><span>${axis.left}</span><span>${axis.name}</span><span>${axis.right}</span></div><div class="axis-bar"><span class="axis-dot" style="left:${pct}%"></span></div></div>`;
      }).join("");
    }
    function renderResult(){
      if(!isComplete()){ state.step = "intro"; render(); return; }
      const result = calcResult();
      const c = result.char;
      app.innerHTML = `<div class="panel fade-in result-hero"><p class="kicker">RESULT</p><span class="type-code">TYPE ${result.code}</span><h2 class="big">${c.name}</h2>${sceneHtml(c.image, c.name, "result")}<p class="text-body" style="max-width:560px; margin:0 auto;">${c.summary}</p><p style="font-size:17px; font-weight:700; margin:22px auto 0; max-width:560px;">${c.catch}</p>${socialLinksHtml()}</div><div class="panel fade-in"><p class="kicker">3 AXES</p><h2 class="big">あなたのグロウバランス</h2>${renderAxis(result)}<p class="text-body">判定の濃さ: ${result.confidenceLabel}</p>${result.straightLine ? `<p class="text-body" style="color:#f97316;">同じ回答が多めです。気分を変えてもう一度試すと、少し違う結果になるかもしれません。</p>` : ""}${result.adjacentTypes.length ? `<p class="text-body">近いタイプ: ${result.adjacentTypes.map(t => t.name).join(" / ")}</p>` : ""}</div><div class="panel fade-in"><p class="kicker">DETAIL</p><h2 class="big">このタイプの見え方</h2><div class="section-grid"><div class="mini"><h3>似合うムード</h3><p>${c.hook}</p></div><div class="mini"><h3>しんどい時</h3><p>${c.downside}</p></div><div class="mini"><h3>周りから</h3><p>${c.perception}</p></div><div class="mini"><h3>今日の投稿ヒント</h3><p>${c.advice}</p></div><div class="mini"><h3>強み</h3><p>${c.strength}</p></div><div class="mini"><h3>気をつけたいこと</h3><p>${c.weakness}</p></div></div><div class="actions"><button class="primary" id="btnChars">8タイプを見る</button><button id="btnAgain">もう一度診断する</button></div></div>`;
      document.getElementById("btnChars").onclick = () => { state.step = "characters"; saveState(); render(); };
      document.getElementById("btnAgain").onclick = resetDiagnosis;
    }
    function renderCharacters(){
      const cards = Object.entries(CHARACTERS).map(([code, c]) => `<article class="char-card fade-in">${sceneHtml(c.image, c.name, "card")}<div class="char-body"><p class="kicker">TYPE ${code}</p><h3>${c.name}</h3><p>${c.summary}</p></div></article>`).join("");
      app.innerHTML = `<div class="panel fade-in"><p class="kicker">8 TYPES</p><h2 class="big">垢抜けグロウ診断 8タイプ</h2><p class="text-body">2枚のラフ画像をサンプルとして交互に配置しています。自分磨き、ファッション、親しみやすさ、ファンと共鳴する空気感をタイプごとに少しずつ表現しています。</p><div class="characters-grid">${cards}</div><div class="actions"><button class="primary" id="btnBackDiagnosis">${isComplete() ? "結果に戻る" : "診断する"}</button></div></div>`;
      document.getElementById("btnBackDiagnosis").onclick = () => { state.step = isComplete() ? "result" : "intro"; saveState(); render(); };
    }
    document.getElementById("brandHome").onclick = () => { state.step = isComplete() ? "result" : "intro"; saveState(); render(); };
    document.getElementById("navDiagnosis").onclick = () => { state.step = isComplete() ? "result" : "intro"; saveState(); render(); };
    document.getElementById("navCharacters").onclick = () => { state.step = "characters"; saveState(); render(); };
    render();
  </script>
</body>
</html>
