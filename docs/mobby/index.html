<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0">
  <title>モビー診断 | MBTIの裏モビー診断</title>
  <meta name="description" content="モビー診断は、あなたのMBTIに隠れた“よく見せている自己像”と“都合の悪い本音”を28問の7段階回答で見る無料診断です。よく見せメーター、不都合隠しメーター、闇スイッチをモビーが少し辛口に診断します。">
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large">
  <link rel="canonical" href="https://www.mobby.online/mobby/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="モビー診断 | MBTIの裏モビー診断">
  <meta property="og:description" content="MBTIでよく見せている自分の裏側を、28問の7段階回答で診断。あなたの裏メーターと闇スイッチをモビーが少し辛口に見ます。">
  <meta property="og:image" content="https://www.mobby.online/img/mobby/mobby_purple2.jpg">
  <meta property="og:url" content="https://www.mobby.online/mobby/">
  <meta property="og:site_name" content="Mobby - モビー診断">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="モビー診断 | MBTIの裏モビー診断">
  <meta name="twitter:description" content="MBTIでよく見せている自分の裏側を、28問の7段階回答で診断。あなたの裏メーターと闇スイッチをモビーが少し辛口に見ます。">
  <meta name="twitter:image" content="https://www.mobby.online/img/mobby/mobby_purple2.jpg">
  <meta name="theme-color" content="#0f0f15">
  <link rel="stylesheet" href="../shared/line-ai-mobby-cta.css">
  <link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-main: 'Yomogi', cursive;
      --bg: #0f0f15;
      --surface: #1a1a25;
      --surface2: #22222f;
      --text-main: #e8e6f0;
      --text-sub: #9b98aa;
      --accent: #a78bfa;
      --accent-soft: rgba(167, 139, 250, 0.15);
      --accent2: #f472b6;
      --line: #2d2c3d;
      --danger: #ff5a5a;
      --radius: 18px;
      --shadow-lg: 0 18px 42px rgba(0, 0, 0, 0.34);
    }

    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 50% -10%, rgba(167, 139, 250, 0.18), transparent 34%), var(--bg);
      color: var(--text-main);
      font-family: var(--font-main);
      line-height: 1.7;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 1px solid transparent;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      cursor: pointer;
      padding: 10px 18px;
      transition: transform 0.16s ease, background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.42;
      transform: none;
    }

    button.primary {
      background: linear-gradient(135deg, #a78bfa, #f472b6);
      color: #fff;
      font-weight: 700;
      box-shadow: 0 12px 28px rgba(167, 139, 250, 0.24);
    }

    button.danger {
      color: var(--danger);
      background: rgba(255, 90, 90, 0.08);
    }

    .wrap {
      width: min(860px, 100%);
      margin: 0 auto;
      padding: 34px 18px 72px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 34px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .logo {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      border-radius: 12px;
      background: url("../img/mobby/mobby_purple2.jpg") center/cover;
      box-shadow: 0 10px 26px rgba(167, 139, 250, 0.25);
    }

    .brand h1 {
      margin: 0;
      font-size: 15px;
      color: var(--accent);
    }

    .brand p {
      margin: 0;
      color: var(--text-sub);
      font-size: 12px;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .nav a,
    .nav button {
      font-size: 12px;
      padding: 8px 14px;
    }

    .panel {
      background: rgba(26, 26, 37, 0.94);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      padding: 30px;
      margin-bottom: 22px;
    }

    .panel.center {
      text-align: center;
      padding: 54px 24px;
    }

    .kicker {
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      margin: 0 0 8px;
      text-transform: uppercase;
    }

    .big {
      font-size: clamp(26px, 4vw, 42px);
      line-height: 1.25;
      margin: 0 0 16px;
    }

    .text-body {
      color: var(--text-sub);
      font-size: 15px;
      margin: 0;
    }

    .intro-copy {
      max-width: 560px;
      margin: 0 auto 28px;
      color: var(--text-main);
      font-size: 15px;
    }

    .mbti-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin: 24px 0;
    }

    .mbti-card,
    .choice-card {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface2);
      color: var(--text-main);
      text-align: left;
      padding: 14px;
    }

    .mbti-card strong {
      display: block;
      color: var(--text-main);
      font-size: 22px;
      line-height: 1;
      margin-bottom: 8px;
    }

    .mbti-card span {
      display: block;
      color: var(--text-sub);
      font-size: 12px;
      line-height: 1.45;
    }

    .mbti-card.selected,
    .choice-card.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
      box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.1);
    }

    .choice-list {
      display: grid;
      gap: 10px;
    }

    .choice-card {
      display: grid;
      grid-template-columns: 34px 1fr;
      align-items: start;
      gap: 12px;
      min-height: 56px;
    }

    .choice-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.07);
      color: var(--accent);
      font-weight: 700;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .likert7 {
      display: grid;
      gap: 10px;
      width: 100%;
    }

    .likert-labels {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--text-sub);
      font-size: 12px;
    }

    .likert-buttons {
      display: grid;
      grid-template-columns: 52px 44px 36px 30px 36px 44px 52px;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      min-height: 58px;
    }

    .likert-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1 / 1;
      width: 100%;
      min-width: 0;
      border-radius: 999px;
      padding: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 14px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-sub);
    }

    .likert-btn:hover {
      transform: translateY(-1px) scale(1.02);
    }

    .likert-low {
      border-color: rgba(96, 165, 250, 0.48);
      color: #93c5fd;
    }

    .likert-neutral {
      border-color: rgba(232, 230, 240, 0.22);
      color: var(--text-sub);
    }

    .likert-high {
      border-color: rgba(244, 114, 182, 0.52);
      color: #f9a8d4;
    }

    .likert-low.selected {
      background: rgba(96, 165, 250, 0.2);
      border-color: #60a5fa;
      box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.12);
      color: #dbeafe;
    }

    .likert-neutral.selected {
      background: rgba(232, 230, 240, 0.14);
      border-color: rgba(232, 230, 240, 0.5);
      box-shadow: 0 0 0 4px rgba(232, 230, 240, 0.08);
      color: var(--text-main);
    }

    .likert-high.selected {
      background: rgba(244, 114, 182, 0.22);
      border-color: #f472b6;
      box-shadow: 0 0 0 4px rgba(244, 114, 182, 0.13);
      color: #fce7f3;
    }

    .likert-current {
      min-height: 24px;
      color: var(--text-sub);
      font-size: 13px;
      text-align: center;
    }

    .q-card {
      border-bottom: 1px solid var(--line);
      margin-bottom: 28px;
      padding-bottom: 28px;
    }

    .q-card.has-error {
      border-color: rgba(255, 90, 90, 0.5);
    }

    .q-card:last-child {
      border-bottom: 0;
      margin-bottom: 8px;
      padding-bottom: 0;
    }

    .q-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--text-sub);
      font-size: 12px;
      margin-bottom: 6px;
    }

    .q-text {
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 16px;
    }

    .q-error {
      color: var(--danger);
      font-size: 12px;
      margin: 8px 0 0;
      text-align: center;
    }

    .progress-wrap {
      margin-bottom: 24px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      color: var(--text-sub);
      font-size: 12px;
      margin-bottom: 8px;
    }

    .progress-track,
    .meter-track {
      height: 7px;
      border-radius: 999px;
      overflow: hidden;
      background: var(--surface2);
    }

    .progress-fill,
    .meter-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
    }

    .pager,
    .actions {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 28px;
    }

    .form-grid {
      display: grid;
      gap: 14px;
      max-width: 540px;
    }

    .field label,
    .consent {
      display: block;
      color: var(--text-sub);
      font-size: 12px;
      margin-bottom: 6px;
    }

    input,
    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--surface2);
      color: var(--text-main);
      padding: 13px 14px;
    }

    .consent {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 4px 0 0;
    }

    .consent input {
      width: auto;
      margin-top: 5px;
    }

    .error {
      display: none;
      color: var(--danger);
      font-size: 12px;
      margin: 0;
    }

    .result-hero {
      text-align: center;
    }

    .mobby-image {
      width: min(320px, 88vw);
      aspect-ratio: 1/1;
      object-fit: cover;
      display: block;
      border-radius: 22px;
      margin: 22px auto;
      border: 1px solid var(--line);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.32);
    }

    .meter-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 22px;
    }

    .meter-card,
    .info-card {
      background: var(--surface2);
      border: 1px solid var(--line);
      border-radius: 15px;
      padding: 18px;
    }

    .meter-value {
      font-size: 34px;
      line-height: 1;
      font-weight: 700;
      margin: 8px 0 8px;
    }

    .meter-copy {
      color: var(--text-sub);
      font-size: 13px;
      margin: 12px 0 0;
    }

    .result-sections {
      display: grid;
      gap: 16px;
      margin-top: 22px;
    }

    .info-card h3 {
      font-size: 15px;
      margin: 0 0 8px;
      color: var(--accent);
    }

    .info-card p {
      margin: 0;
      color: var(--text-main);
    }

    .contradiction-list {
      margin: 0;
      padding-left: 22px;
      color: var(--text-main);
    }

    .contradiction-list li {
      margin-bottom: 8px;
    }

    .share-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 18px;
    }

    .share-buttons a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 132px;
      border-radius: 999px;
      color: #fff;
      font-weight: 700;
      padding: 10px 18px;
    }

    .share-x {
      background: #111;
    }

    .share-line {
      background: #06c755;
    }

    .note {
      color: var(--text-sub);
      font-size: 11px;
      margin-top: 20px;
      text-align: center;
    }

    @media (max-width: 680px) {
      .wrap {
        padding: 24px 14px 56px;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .nav {
        justify-content: flex-start;
      }

      .panel,
      .panel.center {
        padding: 22px 16px;
      }

      .mbti-grid,
      .meter-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .mbti-card {
        padding: 12px;
      }

      .mbti-card strong {
        font-size: 20px;
      }

      .likert-buttons {
        grid-template-columns: 42px 36px 32px 28px 32px 36px 42px;
        gap: 6px;
        min-height: 48px;
      }

      .likert-btn {
        font-size: 12px;
      }

      .pager,
      .actions {
        align-items: stretch;
      }
    }

    @media (max-width: 380px) {
      .likert-buttons {
        grid-template-columns: 36px 31px 28px 24px 28px 31px 36px;
        gap: 5px;
      }

      .q-meta {
        flex-direction: column;
        gap: 2px;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <a class="brand" href="../index.html" aria-label="Mobbyトップへ">
        <span class="logo" aria-hidden="true"></span>
        <span>
          <h1>モビー診断</h1>
          <p>MBTIの裏モビー診断</p>
        </span>
      </a>
      <nav class="nav" aria-label="ページ操作">
        <a href="../index.html">トップ</a>
        <button class="danger" id="btnReset" type="button">リセット</button>
      </nav>
    </header>

    <main id="app" aria-live="polite"></main>
  </div>

  <script src="../shared/line-ai-mobby-cta.js"></script>
  <script src="app.js"></script>
  <script src="questions.js"></script>
  <script src="copy.js"></script>
  <script src="logic.js"></script>
</body>

</html>
