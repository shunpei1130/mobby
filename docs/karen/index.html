y_name":"チェキで\n印象残す型","short":"短い会話でも気持ちを残せる、対面つよめ推し。","description":"あなたは、対面の短い時間でも印象を残しやすいタイプ。話しすぎなくても、空気感や一言でちゃんと伝わる強さがあります。特典会や現場で存在感を出しやすいファンです。","phrase":"短くても伝わる応援、印象に残るかも！","scores":{"SNS反応力":67,"現場印象度":94,"継続応援力":70,"見つかり度":89},"actions":["一言だけでも伝える内容を決めておく","「初めまして」＋感想1つをセットで言う","印象に残る自然なリアクションを意識する"],"color":"#ff5c8a"},{"id":"spread","number":"04","slug":"spread-craft","name":"布教職人型","display_name":"布教職人型","short":"好きの共有が得意。新しいファンを増やせる推し。","description":"あなたは、自分が好きになると周りにも共有したくなるタイプ。一人で楽しむだけでなく、“推しの魅力を広げる力”を持っています。新しいファンを増やしやすい、かなり貴重な存在です。","phrase":"魅力を広げてくれる応援、心強いかも！","scores":{"SNS反応力":79,"現場印象度":64,"継続応援力":77,"見つかり度":84},"actions":["診断結果をシェアして友達にも診断を勧める","お気に入り動画や投稿を人に共有する","「この子気になるかも」を増やす動きをする"],"color":"#e84a5f"},{"id":"steady","number":"05","slug":"steady-support","name":"ひたむき見守り型","display_name":"ひたむき\n見守り型","short":"派手じゃなくても長く支える、継続力のある推し。","description":"あなたは、目立つ応援よりも、長く静かに応援するタイプ。派手さはなくても、安定して好きでいられる継続力が強みです。推しにとっては、実はかなりありがたいファンです。","phrase":"ずっと見ていてくれる応援、力になるかも！","scores":{"SNS反応力":54,"現場印象度":60,"継続応援力":95,"見つかり度":73},"actions":["継続的に投稿へいいねや感想を送る","無理のない頻度で現場や配信を追う","応援の記録を自分なりに残していく"],"color":"#d6336c"},{"id":"visual","number":"06","slug":"visual-save","name":"ビジュ保存職人型","display_name":"ビジュ保存\n職人型","short":"かわいい瞬間を見逃さない、保存と拡散に強い推し。","description":"あなたは、写真・動画・世界観など“見た目のときめき”に強く反応するタイプ。かわいい瞬間を見つけるのが得意で、推しの魅力をビジュアルから深めていけます。SNSとの相性がかなり良いファンです。","phrase":"かわいい瞬間を残してくれるの、うれしいかも！","scores":{"SNS反応力":72,"現場印象度":58,"継続応援力":75,"見つかり度":78},"actions":["お気に入り投稿を保存してストーリーで紹介する","ビジュが刺さった理由を一言添えてシェアする","衣装や世界観ごと楽しむ"],"color":"#f06595"},{"id":"red","number":"07","slug":"red-tokimeki","name":"赤担当ときめき反応型","display_name":"赤担当\nときめき反応型","short":"色・衣装・世界観ごと楽しめる、感度高めの推し。","description":"あなたは、担当カラーや世界観に感情が大きく動くタイプ。赤、衣装、雰囲気、アイドルらしさにしっかり反応できるのが特徴です。“推しっぽさ”に一気にハマりやすいファンです。","phrase":"世界観ごと楽しんでくれるの、うれしいかも！","scores":{"SNS反応力":74,"現場印象度":80,"継続応援力":71,"見つかり度":85},"actions":["赤系アイテムやコーデで現場を楽しむ","担当カラーへの反応をSNSで発信する","“かれんちゃんらしさ”を自分なりに言葉にする"],"color":"#c9184a"},{"id":"effort","number":"08","slug":"recognition-effort","name":"認知されたい努力家型","display_name":"認知されたい\n努力家型","short":"見つかりたい気持ちを、前向きな応援に変える推し。","description":"あなたは、“見つかりたい”“覚えてもらいたい”気持ちをちゃんと行動に変えたいタイプ。その気持ちを重くしすぎず、前向きな応援に変えられればかなり強いです。伸びしろが大きく、推し活を楽しみながら成長できるファンです。","phrase":"一生懸命な応援、ちゃんと伝わるかも！","scores":{"SNS反応力":83,"現場印象度":86,"継続応援力":80,"見つかり度":93},"actions":["継続的に反応する","特典会では短く自然に気持ちを伝える","“認知されたい”を“楽しく応援したい”に変換する"],"color":"#a4133c"}]};
    const STORAGE_KEY = "karen_oshi_mobby_likert_v2";
    const PAGE_SIZE = 5;
    const LIKERT_OPTIONS = [
      { value: 1, label: "まったく違う" },
      { value: 2, label: "違う" },
      { value: 3, label: "やや違う" },
      { value: 4, label: "どちらでも" },
      { value: 5, label: "やや当てはまる" },
      { value: 6, label: "当てはまる" },
      { value: 7, label: "とても当てはまる" }
    ];
    const TYPE_MAP = Object.fromEntries(DIAG.types.map(type => [type.id, type]));
    const state = { step: "intro", page: 0, answers: {} };

    function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    function loadState() {
      try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) Object.assign(state, JSON.parse(raw)); } catch (_) {}
      state.answers ||= {};
      if (state.step !== "intro" && state.step !== "quiz" && state.step !== "result" && state.step !== "types") state.step = "intro";
    }
    function setStep(step) { state.step = step; saveState(); render(); }
    function resetAssessment() { state.page = 0; state.answers = {}; setStep("quiz"); }
    function esc(value) { return String(value).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char])); }
    function toast(message) {
      const el = document.getElementById("toast");
      el.textContent = message; el.classList.add("show");
      window.clearTimeout(toast._timer); toast._timer = window.setTimeout(() => el.classList.remove("show"), 1800);
    }
    function pageQuestions() {
      const start = state.page * PAGE_SIZE;
      return DIAG.questions.slice(start, start + PAGE_SIZE);
    }
    function hasAnswer(qid) { return Number.isFinite(Number(state.answers[qid])); }
    function isCurrentPageComplete() { return pageQuestions().every(q => hasAnswer(q.id)); }
    function completedCount() { return DIAG.questions.filter(q => hasAnswer(q.id)).length; }
    function chooseOption(qid, value) { state.answers[qid] = Number(value); saveState(); render(); }
    function getResult() {
      const scores = Object.fromEntries(DIAG.types.map(t => [t.id, 0]));
      DIAG.questions.forEach(q => {
        const value = Number(state.answers[q.id]);
        if (scores[q.type] !== undefined && Number.isFinite(value)) scores[q.type] += value;
      });
      const max = Math.max(...Object.values(scores));
      const tied = Object.keys(scores).filter(key => scores[key] === max);
      let winner = tied[0];
      if (tied.length > 1) {
        for (let i = DIAG.questions.length - 1; i >= 0; i--) {
          const type = DIAG.questions[i].type;
          if (tied.includes(type)) { winner = type; break; }
        }
      }
      return { type: TYPE_MAP[winner], scores };
    }
    function shareText(type) {
      return `私は「${type.name}」でした！
${DIAG.title}
#${DIAG.hashtags.join(" #")}`;
    }
    function shareUrl(type) {
      const url = encodeURIComponent(location.href.split('#')[0]);
      const text = encodeURIComponent(shareText(type));
      return `https://twitter.com/intent/tweet?text=${text}&url=${url}`;
    }
    async function copyResult(typeId) {
      const type = TYPE_MAP[typeId];
      try { await navigator.clipboard.writeText(shareText(type) + "\n" + location.href.split('#')[0]); toast("シェア文をコピーしました"); }
      catch (_) { toast("コピーできませんでした"); }
    }
    async function nativeShare(typeId) {
      const type = TYPE_MAP[typeId];
      const payload = { title: DIAG.title, text: shareText(type), url: location.href.split('#')[0] };
      if (navigator.share) { try { await navigator.share(payload); } catch (_) {} }
      else { copyResult(typeId); }
    }
    function renderIntro() {
      const done = completedCount();
      const hasProgress = done > 0;
      return `
        <section class="panel hero stack">
          <img class="hero-img" src="assets/anime.png" alt="かれんちゃんに見つかる推し活診断 メインビジュアル">
          <div>
            <span class="kicker">Mobby Collaboration</span>
            <h2 class="big">あなたは、どんな推し方？</h2>
            <p class="text">SNS派、現場派、布教派、見守り派。10問に答えるだけで、あなたらしい応援タイプが8タイプから分かります。</p>
          </div>
          <div class="note">
            <p class="helper">公開面では「認知される」と断言せず、“見つかりやすいかも”“印象に残りやすいかも”として設計しています。</p>
          </div>
          <div class="actions">
            <button class="btn btn-primary" onclick="resetAssessment()">診断スタート</button>
            ${hasProgress ? '<button class="btn btn-secondary" onclick="setStep(&quot;quiz&quot;)">続きから回答</button>' : ''}
            <button class="btn btn-secondary" onclick="setStep('types')">全8タイプを見る</button>
          </div>
        </section>`;
    }
    function renderQuiz() {
      const totalPages = Math.ceil(DIAG.questions.length / PAGE_SIZE);
      const questions = pageQuestions();
      const progress = Math.round((completedCount() / DIAG.questions.length) * 100);
      return `<section class="panel stack">
        <div>
          <div class="progress-meta"><span>Q${state.page * PAGE_SIZE + 1} - Q${Math.min((state.page + 1) * PAGE_SIZE, DIAG.questions.length)}</span><span>${completedCount()} / ${DIAG.questions.length}</span></div>
          <div class="track"><div class="fill" style="width:${progress}%"></div></div>
        </div>
        ${questions.map((q, index) => `
          <article class="qcard">
            <p class="qindex">Question ${state.page * PAGE_SIZE + index + 1}</p>
            <h3 class="qtext">${esc(q.text)}</h3>
            <div class="scale-wrap">
              <div class="scale-labels" aria-hidden="true"><span>まったく違う</span><span>どちらでも</span><span>とても当てはまる</span></div>
              <div class="options" role="group" aria-label="${esc(q.text)}">
                ${LIKERT_OPTIONS.map(opt => `
                  <button type="button" class="option ${Number(state.answers[q.id]) === opt.value ? 'selected' : ''}" onclick="chooseOption('${q.id}',${opt.value})" aria-label="${opt.value}: ${esc(opt.label)}" aria-pressed="${Number(state.answers[q.id]) === opt.value}">
                    <span class="scale-no">${opt.value}</span>
                  </button>`).join('')}
              </div>
              <div class="selected-scale">${hasAnswer(q.id) ? esc(LIKERT_OPTIONS.find(opt => opt.value === Number(state.answers[q.id]))?.label || '') : '1から7で気持ちに近い数字を選んでください'}</div>
            </div>
          </article>`).join('')}
        <div class="footer-row">
          <button class="btn btn-secondary" onclick="state.page=Math.max(0,state.page-1);saveState();render();" ${state.page === 0 ? 'disabled style="opacity:.45;cursor:not-allowed"' : ''}>戻る</button>
          <button class="btn btn-primary" onclick="nextPage()">${state.page + 1 >= totalPages ? '結果を見る' : '次へ'}</button>
        </div>
      </section>`;
    }
    function nextPage() {
      if (!isCurrentPageComplete()) { toast("このページの質問にすべて回答してください"); return; }
      const totalPages = Math.ceil(DIAG.questions.length / PAGE_SIZE);
      if (state.page + 1 >= totalPages) { setStep("result"); window.scrollTo({ top: 0, behavior: "smooth" }); }
      else { state.page += 1; saveState(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
    }
    function renderResult() {
      if (completedCount() < DIAG.questions.length) { state.step = "quiz"; return renderQuiz(); }
      const { type } = getResult();
      const liveCta = DIAG.links.live && DIAG.links.live !== '#' ? `<a class="btn btn-secondary" href="${DIAG.links.live}" target="_blank" rel="noopener">ライブ情報を見る</a>` : '';
      const karenCta = DIAG.links.karen && DIAG.links.karen !== '#' ? `<a class="btn btn-secondary" href="${DIAG.links.karen}" target="_blank" rel="noopener">かれんちゃんをフォロー</a>` : '';
      return `<section class="panel stack">
        <div class="result-head">
          <div class="type-no">${esc(type.number)}</div>
          <div class="result-title">
            <span class="kicker">Your Oshi Type</span>
            <div class="result-sample">
              <img src="assets/kekka.png" alt="${esc(type.name)}の結果サンプル画像">
            </div>
            <h2>あなたは<br>「${esc(type.name)}」</h2>
            <p>${esc(type.description)}</p>
          </div>
        </div>
        <div class="result-grid">
          <div class="result-main stack">
            <div class="result-copy">
              <h3>かれんちゃんからの一言風</h3>
              <p class="text">「${esc(type.phrase)}」</p>
            </div>
            <div class="mini-card">
              <h3>おすすめ推し活ミッション</h3>
              <ul>${type.actions.map(item => `<li>${esc(item)}</li>`).join('')}</ul>
            </div>
            <div class="status-grid">
              <div class="status mini-card">
                <h3>推し活ステータス</h3>
                ${Object.entries(type.scores).map(([label, value]) => `
                  <div class="bar-row"><div class="bar-meta"><span>${esc(label)}</span><strong>${value}</strong></div><div class="bar"><span style="width:${value}%"></span></div></div>`).join('')}
              </div>
            </div>
          </div>
        </div>
        <div class="share">
          <a href="${shareUrl(type)}" target="_blank" rel="noopener">Xでシェア</a>
          <button type="button" onclick="nativeShare('${type.id}')">共有する</button>
          <button type="button" onclick="copyResult('${type.id}')">シェア文コピー</button>
          <a href="assets/kekka.png" download>結果画像を保存</a>
        </div>
        <div class="actions">
          ${karenCta}${liveCta}
          <a class="btn btn-secondary" href="${DIAG.links.mobby}" target="_blank" rel="noopener">Mobbyを見る</a>
          <button class="btn btn-ghost" onclick="resetAssessment()">もう一度診断する</button>
        </div>
      </section>`;
    }
    function renderTypes() {
      return `<section class="panel stack">
        <div><span class="kicker">All Types</span><h2 class="big">全8タイプ</h2><p class="text">結果名を開くと、特徴とおすすめ行動を確認できます。</p></div>
        <div class="types">
          ${DIAG.types.map(type => `
            <details class="type-item">
              <summary>
                <div class="type-head"><div><h3>${esc(type.number)}｜${esc(type.name)}</h3><p>${esc(type.short)}</p></div></div>
              </summary>
              <div class="type-sample">
                <img src="assets/kekka.png" alt="${esc(type.name)}のサンプル結果画像">
              </div>
              <p>${esc(type.description)}</p>
              <p style="margin-top:8px"><strong>一言風：</strong>「${esc(type.phrase)}」</p>
            </details>`).join('')}
        </div>
        <div class="actions"><button class="btn btn-primary" onclick="resetAssessment()">診断スタート</button><button class="btn btn-secondary" onclick="setStep('intro')">トップへ戻る</button></div>
      </section>`;
    }
    function render() {
      document.getElementById('navDiagnosis').classList.toggle('active', state.step !== 'types');
      document.getElementById('navTypes').classList.toggle('active', state.step === 'types');
      const app = document.getElementById('app');
      if (state.step === 'quiz') app.innerHTML = renderQuiz();
      else if (state.step === 'result') app.innerHTML = renderResult();
      else if (state.step === 'types') app.innerHTML = renderTypes();
      else app.innerHTML = renderIntro();
    }
    document.getElementById('brandHome').addEventListener('click', () => setStep('intro'));
    document.getElementById('brandHome').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') setStep('intro'); });
    document.getElementById('navDiagnosis').addEventListener('click', (e) => { e.preventDefault(); setStep('intro'); });
    document.getElementById('navTypes').addEventListener('click', (e) => { e.preventDefault(); setStep('types'); });
    loadState(); render();
  </script>
</body>
</html>
