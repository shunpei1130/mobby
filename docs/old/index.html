<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mobby Fortune</title>
  <meta name="description" content="Mobby 今日の運勢 第1位" />
  <link rel="icon" type="image/jpeg" href="img/fav.jpg" />
  <link rel="apple-touch-icon" href="img/Mobby.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Yomogi&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --ink: #1b1b1b;
      --paper: #f4efe3;
      --grid: rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      color: var(--ink);
      font-family: "Yomogi", cursive;
      background-color: var(--paper);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 38px 38px;
    }

    .app {
      width: min(920px, calc(100% - 20px));
      margin: 8px auto 18px;
      border: 3px solid var(--ink);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.24);
      padding: 10px 10px 12px;
    }

    .logo {
      text-align: center;
      font-family: "Patrick Hand", cursive;
      font-size: clamp(2.2rem, 8vw, 4rem);
      line-height: 1;
      letter-spacing: 0.04em;
      margin-top: 2px;
    }

    .rule {
      width: 100%;
      height: 3px;
      border: none;
      background: var(--ink);
      margin: 6px 0 8px;
    }

    .main-card {
      border: 3px solid var(--ink);
      border-radius: 14px;
      padding: 8px;
      background: rgba(255, 255, 255, 0.18);
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      gap: 10px;
      min-height: 380px;
    }

    .char-box {
      border: 3px solid var(--ink);
      border-radius: 16px;
      overflow: hidden;
      background: #fff;
      align-self: stretch;
      min-height: 300px;
    }

    .char-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .fortune {
      display: grid;
      align-content: center;
      gap: 8px;
      padding: 6px 2px;
    }

    .fortune h1 {
      font-size: clamp(1.8rem, 5.5vw, 3rem);
      line-height: 1;
      letter-spacing: 0.02em;
    }

    .fortune h2 {
      font-size: clamp(1.7rem, 5vw, 2.7rem);
      line-height: 1;
      letter-spacing: 0.03em;
      text-decoration: underline;
      text-underline-offset: 8px;
      text-decoration-thickness: 3px;
    }

    .name {
      font-size: clamp(1rem, 3.6vw, 1.6rem);
      font-weight: 700;
      line-height: 1.3;
      word-break: break-word;
    }

    .lines {
      display: grid;
      gap: 6px;
      margin-top: 4px;
      font-size: clamp(0.92rem, 2.8vw, 1.05rem);
      line-height: 1.4;
    }

    .lines p {
      position: relative;
      padding-left: 14px;
    }

    .lines p::before {
      content: "~";
      position: absolute;
      left: 0;
      top: 0;
    }

    .bottom-nav {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .nav-btn {
      border: 3px solid var(--ink);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.44);
      text-decoration: none;
      color: var(--ink);
      padding: 8px 6px 6px;
      display: grid;
      justify-items: center;
      gap: 4px;
    }

    button.nav-btn {
      font-family: inherit;
      cursor: pointer;
      width: 100%;
    }

    .nav-icon {
      width: 100%;
      aspect-ratio: 1 / 1;
      border: 3px solid var(--ink);
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
      display: grid;
      place-items: center;
    }

    .nav-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .nav-label {
      font-size: clamp(1rem, 3.2vw, 1.4rem);
      line-height: 1;
    }

    .icon-svg {
      width: 68%;
      height: 68%;
      stroke: var(--ink);
      stroke-width: 3.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 12px;
    }

    .modal-overlay.is-open {
      display: flex;
    }

    .modal-card {
      width: min(560px, 100%);
      border: 3px solid var(--ink);
      border-radius: 14px;
      background: var(--paper);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 34px 34px;
      padding: 10px;
      display: grid;
      gap: 10px;
    }

    .modal-card.encyclopedia {
      width: min(920px, 100%);
      max-height: 86vh;
      grid-template-rows: auto auto minmax(0, 1fr);
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .modal-title {
      font-family: "Patrick Hand", cursive;
      font-size: clamp(1.6rem, 6vw, 2.2rem);
      line-height: 1;
    }

    .close-btn {
      border: 3px solid var(--ink);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      font-family: inherit;
      font-size: 1rem;
      line-height: 1;
      padding: 8px 10px;
      cursor: pointer;
    }

    .modal-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .modal-grid.five {
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }

    .ency-tabs {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
    }

    .ency-tab {
      border: 3px solid var(--ink);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.75);
      color: var(--ink);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      line-height: 1;
      padding: 8px 4px;
      cursor: pointer;
    }

    .ency-tab.is-active {
      background: rgba(27, 27, 27, 0.92);
      color: #fff;
    }

    .ency-content {
      min-height: 0;
      overflow: auto;
      padding-right: 2px;
    }

    .ency-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(94px, 1fr));
      gap: 7px;
    }

    .ency-item {
      display: block;
      border: 3px solid var(--ink);
      border-radius: 10px;
      background: #fff;
      text-decoration: none;
      color: var(--ink);
      overflow: hidden;
    }

    .ency-item img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
    }

    .ency-item span {
      display: block;
      padding: 4px 4px 5px;
      font-size: 0.6rem;
      line-height: 1.2;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }

    .modal-item {
      border: 3px solid var(--ink);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.66);
      color: var(--ink);
      text-decoration: none;
      padding: 8px 6px;
      display: grid;
      justify-items: center;
      gap: 5px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .modal-item img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border: 3px solid var(--ink);
      border-radius: 8px;
      background: #fff;
      display: block;
    }

    @media (max-width: 760px) {
      .main-card {
        grid-template-columns: 1fr;
        min-height: auto;
      }

      .char-box {
        min-height: 230px;
      }

      .fortune {
        align-content: start;
      }

      .modal-grid.five {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .ency-tabs {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 520px) {
      .modal-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .modal-grid.five {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .ency-tabs {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>

        "LINE既読熟考モビー", "テスト前だけ直球モビー", "ランチ会聞き役モビー", "友だち関係ナビモビー",
        "家庭内スケジュール司令モビー", "寝る前そっとカウンセルモビー", "影の進路リサーチモビー", "後方席静観モビー",
        "成績表こっそり分析モビー", "放課後相談ホットラインモビー", "校門あいさつ隊モビー", "親子直球作戦会議モビー",
        "送迎車内サクッと相談モビー", "連絡網即断司令塔モビー", "運動会タイムキーパーモビー", "面談前リサーチモビー"
      ];

      const CATALOG = [
        ...SCHOOL_WOMEN_NAMES.map((name) => ({ name, img: `16school/imgsub/${name}.jpg` })),
        ...SCHOOL_BOY_CODES.map((code) => ({ name: `${code.toUpperCase()}モビー`, img: `16school/cha/${code}.jpg` })),
        ...NIGHT_CODES.map((code) => ({ name: `${code}モビー`, img: `16night/img/${code}.jpg` })),
        ...STAN_NAMES.map((name) => ({ name, img: `16stan/img/${name}.jpg` })),
        ...LOVE_NAMES.map((name) => ({ name, img: `16love/img/${name}.jpg` })),
        ...MAMA_NAMES.map((name) => ({ name, img: `16school/mama/img/${name}.jpg` }))
      ];

      const topImage = document.getElementById("topImage");
      const thumbTop1 = document.getElementById("thumbTop1");
      const thumbEncyclopedia = document.getElementById("thumbEncyclopedia");
      const thumbDiagnosis = document.getElementById("thumbDiagnosis");
      const topName = document.getElementById("topName");
      const fortuneLines = document.getElementById("fortuneLines");
      const openModalButtons = document.querySelectorAll("[data-open-modal]");
      const closeModalButtons = document.querySelectorAll("[data-close-modal]");
      const encyclopediaContent = document.getElementById("encyContent");
      const encyclopediaTabs = document.querySelectorAll(".ency-tab");

      const ENCYCLOPEDIA = {
        school: [
          ...SCHOOL_WOMEN_NAMES.map((name) => ({ name, img: `16school/imgsub/${name}.jpg`, href: "16school/index.html" })),
          ...SCHOOL_BOY_CODES.map((code) => ({ name: `${code.toUpperCase()}モビー`, img: `16school/cha/${code}.jpg`, href: "16school/index.html" }))
        ],
        night: NIGHT_CODES.map((code) => ({ name: `${code}モビー`, img: `16night/img/${code}.jpg`, href: "16night/index.html" })),
        stan: STAN_NAMES.map((name) => ({ name, img: `16stan/img/${name}.jpg`, href: "16stan/index.html" })),
        love: LOVE_NAMES.map((name) => ({ name, img: `16love/img/${name}.jpg`, href: "16love/index.html" })),
        mama: MAMA_NAMES.map((name) => ({ name, img: `16school/mama/img/${name}.jpg`, href: "16school/mama/index.html" }))
      };

      function hashText(text) {
        let h = 2166136261;
        for (let i = 0; i < text.length; i++) {
          h ^= text.charCodeAt(i);
          h = Math.imul(h, 16777619);
        }
        return h >>> 0;
      }

      function makeRng(seed) {
        let s = seed >>> 0;
        return () => {
          s = (s * 1664525 + 1013904223) >>> 0;
          return s / 4294967296;
        };
      }

      function getDateKey() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      }

      function pickTopByDay() {
        const seed = hashText(getDateKey());
        const rnd = makeRng(seed);
        const idx = Math.floor(rnd() * CATALOG.length);
        return { item: CATALOG[idx], seed };
      }

      function pickCatalogBySeed(seedText) {
        const seed = hashText(seedText);
        const rnd = makeRng(seed);
        const idx = Math.floor(rnd() * CATALOG.length);
        return CATALOG[idx];
      }

      function pickFortuneLines(seed) {
        const rnd = makeRng(seed ^ 0x9e3779b9);
        const lines = [];
        const used = new Set();
        while (lines.length < 3 && used.size < FORTUNE_LINES.length) {
          const idx = Math.floor(rnd() * FORTUNE_LINES.length);
          if (used.has(idx)) continue;
          used.add(idx);
          lines.push(FORTUNE_LINES[idx]);
        }
        return lines;
      }

      const { item, seed } = pickTopByDay();
      topName.textContent = item.name;
      topImage.src = item.img;
      topImage.alt = item.name;
      thumbTop1.src = item.img;
      thumbTop1.alt = item.name;
      topImage.onerror = () => { topImage.src = "img/nokey.png"; };
      thumbTop1.onerror = () => { thumbTop1.src = "img/nokey.png"; };

      const dateKey = getDateKey();
      const encyclopediaThumbItem = pickCatalogBySeed(`${dateKey}-encyclopedia`);
      const diagnosisThumbItem = pickCatalogBySeed(`${dateKey}-diagnosis`);

      if (thumbEncyclopedia) {
        thumbEncyclopedia.src = encyclopediaThumbItem.img;
        thumbEncyclopedia.alt = encyclopediaThumbItem.name;
        thumbEncyclopedia.onerror = () => { thumbEncyclopedia.src = "img/nokey.png"; };
      }

      if (thumbDiagnosis) {
        thumbDiagnosis.src = diagnosisThumbItem.img;
        thumbDiagnosis.alt = diagnosisThumbItem.name;
        thumbDiagnosis.onerror = () => { thumbDiagnosis.src = "img/nokey.png"; };
      }

      const lines = pickFortuneLines(seed);
      fortuneLines.innerHTML = "";
      lines.forEach((line) => {
        const p = document.createElement("p");
        p.textContent = line;
        fortuneLines.appendChild(p);
      });

      function renderEncyclopedia(series) {
        const items = ENCYCLOPEDIA[series] || [];
        encyclopediaContent.innerHTML = "";
        const grid = document.createElement("div");
        grid.className = "ency-grid";

        items.forEach((item) => {
          const a = document.createElement("a");
          a.className = "ency-item";
          a.href = item.href;

          const img = document.createElement("img");
          img.src = item.img;
          img.alt = item.name;
          img.loading = "lazy";
          img.onerror = () => {
            img.src = "img/nokey.png";
          };

          const name = document.createElement("span");
          name.textContent = item.name;

          a.appendChild(img);
          a.appendChild(name);
          grid.appendChild(a);
        });

        encyclopediaContent.appendChild(grid);
      }

      function setEncyclopediaTab(series) {
        encyclopediaTabs.forEach((tab) => {
          tab.classList.toggle("is-active", tab.dataset.series === series);
        });
        renderEncyclopedia(series);
      }

      encyclopediaTabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          setEncyclopediaTab(tab.dataset.series || "school");
        });
      });

      setEncyclopediaTab("school");

      function closeAllModals() {
        document.querySelectorAll(".modal-overlay.is-open").forEach((m) => m.classList.remove("is-open"));
      }

      openModalButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-open-modal");
          const modal = document.getElementById(id);
          if (!modal) return;
          modal.classList.add("is-open");
        });
      });

      closeModalButtons.forEach((btn) => {
        btn.addEventListener("click", closeAllModals);
      });

      document.querySelectorAll(".modal-overlay").forEach((overlay) => {
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay) closeAllModals();
        });
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeAllModals();
      });
    })();
  </script>
</body>

</html>
