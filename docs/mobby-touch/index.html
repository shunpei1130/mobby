    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const throwOnly = params.get('mode') === 'throw-only' || params.get('v') === 'throw-only';
        if (!throwOnly) return;
        document.documentElement.classList.add('throw-only');

        const applyThrowOnly = () => {
          const buttons = [...document.querySelectorAll('.mode')];
          const throwButton = buttons.find((button) => button.textContent.includes('FLICK') || button.textContent.includes('とばす'));
          if (!throwButton) return false;

          if (!throwButton.classList.contains('active')) throwButton.click();
          const introCopy = document.querySelector('.intro-copy');
          if (introCopy) introCopy.innerHTML = 'モビーを指で飛ばして、<br>ぷにっと遊んでみて。';
          const instructionNumber = document.querySelector('.instruction-number');
          if (instructionNumber) instructionNumber.textContent = '01';
          return true;
        };

        const observer = new MutationObserver(() => {
          if (applyThrowOnly()) observer.disconnect();
        });
        observer.observe(document.getElementById('root'), { childList: true, subtree: true });
        applyThrowOnly();
      })();
    </script>
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        if (params.get('mode') !== 'pull-only' && params.get('v') !== 'pull-only') return;
        document.documentElement.classList.add('pull-only');
        const applyPullOnly = () => {
          const pullButton = [...document.querySelectorAll('.mode')].find((button) => {
            const text = button.textContent || '';
            return text.includes('PULL') || text.includes('ひっぱ') || text.includes('引っ張');
          });
          if (!pullButton) return false;
          if (!pullButton.classList.contains('active')) pullButton.click();
          return true;
        };
        const observer = new MutationObserver(() => {
          if (applyPullOnly()) observer.disconnect();
        });
        observer.observe(document.getElementById('root'), { childList: true, subtree: true });
        applyPullOnly();
      })();

          });

          const sectorSize = fullTurn / 5;
          const normalized = (angle + fullTurn + sectorSize / 2) % fullTurn;
          const candidateSector = Math.floor(normalized / sectorSize) % 5;
          const currentCenter = eyeSector * sectorSize;
          const distanceFromCurrent = Math.abs(Math.atan2(
            Math.sin(angle - currentCenter),
            Math.cos(angle - currentCenter),
          ));
          if (magnitude >= 12 && distanceFromCurrent > sectorSize / 2 + Math.PI / 18) {

        const syncOverlay = () => {

          const modeText = document.querySelector('.mode.active')?.textContent || '';

          const setFeedback = (message) => {

          const layoutDefaultEye = () => {
            if (!defaultEye || !canvas) return;
            const width = canvas.clientWidth;
            const height = canvas.clientHeight;
            const spriteSize = Math.min(width * 0.82, height * 0.74);
            const imageLeft = (width - spriteSize) / 2;
            const imageTop = height * 0.89 - spriteSize * 0.99;
            const sourceScale = spriteSize / eyeFreeSourceSize;
            defaultEye.style.width = `${defaultEyeCrop.width * sourceScale}px`;

            defaultEye.style.left = `${imageLeft + defaultEyeCrop.x * sourceScale}px`;
            defaultEye.style.top = `${imageTop + defaultEyeCrop.y * sourceScale}px`;
          };
          const layoutEyeOverlay = () => {

            const height = canvas.clientHeight;
            const spriteSize = Math.min(width * 0.82, height * 0.74);

            const targetX = imageLeft + reactionEyeBox.x * sourceScale;
            // Eye 1 is the anchor reference. The later reaction assets have

            const reactionEyeLift = eyeIndex > 0 ? 4 : 0;
            const targetY = imageTop + reactionEyeBox.y * sourceScale - reactionEyeLift;
            const baseTargetWidth = reactionEyeBox.width * sourceScale;
            const baseTargetHeight = reactionEyeBox.height * sourceScale;
            const targetCenterX = targetX + baseTargetWidth / 2;
            const targetCenterY = targetY + baseTargetHeight / 2;
            const targetWidth = baseTargetWidth * reactionEyeScale;
            const targetHeight = baseTargetHeight * reactionEyeScale;
            // All variants share the approved eye-5 frame so changing the
            // expression does not resize or jump the eye layer.
            const [boxX, boxY, boxWidth, boxHeight] = eyeAlphaBoxes[4];
            const outerWidth = targetWidth * 400 / boxWidth;
            const outerHeight = targetHeight * 170 / boxHeight;
            overlay.style.width = `${outerWidth}px`;
            overlay.style.height = `${outerHeight}px`;

            overlay.style.top = `${targetCenterY - outerHeight * (boxY + boxHeight / 2) / 170}px`;
          };
          const updateDefaultSource = () => {

            const width = canvas.clientWidth;
            const height = canvas.clientHeight;
            const spriteSize = Math.min(width * 0.82, height * 0.74);

            // The eye-free body now renders inside the deforming canvas.

            if (defaultSource.getAttribute('src') !== sourceFile) defaultSource.src = sourceFile;
            defaultSource.style.display = 'none';

            if (defaultEye) defaultEye.style.display = pullMode && !isPulling && !reactionVisible ? 'block' : 'none';
            layoutDefaultEye();

          if (!defaultSource) {

            canvas.parentElement?.appendChild(defaultEye);

                layoutEyeOverlay();
                overlay.src = eyeFiles[eyeIndex];

              if (!pointerDown && !isPulling) return;
              const didDrag = isPulling;
              pointerDown = false;
              activePointerId = null;
              isPulling = false;
              reactionVisible = didDrag;
              mouthOverlay.style.display = 'none';
              if (defaultMouth) defaultMouth.style.display = 'none';
              updateDefaultSource();
              if (didDrag) {
                // Keep the reaction visible briefly after release so the
                // eye-only change is easy to see in the embedded page.
                if (defaultEye) defaultEye.style.display = 'none';
                overlay.style.display = 'block';
                if (reactionHideTimer) clearTimeout(reactionHideTimer);
                reactionHideTimer = setTimeout(() => {

                  reactionVisible = false;
                  overlay.style.display = 'none';
                  updateDefaultSource();
                }, 550);

                overlay.style.display = 'none';
              }
              if (didDrag) setFeedback('ぷるん');

            interactionTarget.addEventListener('pointerup', endPull, { passive: true });
            interactionTarget.addEventListener('pointercancel', endPull, { passive: true });

            // for that path so a hover alone still cannot trigger reactions.
            interactionTarget.addEventListener('mousedown', (event) => {
              const modeText = document.querySelector('.mode.active')?.textContent || '';

              if (reactionHideTimer) {
                clearTimeout(reactionHideTimer);
                reactionHideTimer = null;
              }
              reactionVisible = false;
              overlay.style.display = 'none';
              setFeedback('そのまま外へ、ぐーっと');
              startX = event.clientX;
              startY = event.clientY;
              activePointerId = 'mouse';
              pointerDown = true;
              isPulling = false;
              eyeIndex = -1;
              eyeSector = 0;
              eyeStrong = false;
              layoutEyeOverlay();

              const deltaX = event.clientX - startX;
              const deltaY = event.clientY - startY;
              const dragDistance = Math.hypot(deltaX, deltaY);
              if (!isPulling && dragDistance < 4) return;
              if (!isPulling) {
                isPulling = true;
                reactionVisible = true;
                if (defaultEye) defaultEye.style.display = 'none';
                if (defaultMouth) defaultMouth.style.display = 'none';
                overlay.style.display = 'block';
                mouthOverlay.style.display = 'none';
              }
              const nextEyeIndex = selectEyeIndex(deltaX, deltaY, Math.max(canvas.clientWidth, 1));
              if (nextEyeIndex !== eyeIndex) {
                eyeIndex = nextEyeIndex;
                layoutEyeOverlay();
                overlay.src = eyeFiles[eyeIndex];
              }
              canvas.dataset.mobiyanEyeVariant = String(eyeIndex + 1);
            }, { passive: true });
            interactionTarget.addEventListener('mouseup', endPull, { passive: true });
            interactionTarget.addEventListener('mouseleave', endPull, { passive: true });

            hitLayer.style.pointerEvents = 'none';
          }
          if (!isPulling) {
            defaultEye.style.display = pullMode && !reactionVisible ? 'block' : 'none';
            defaultMouth.style.display = 'none';
            updateDefaultSource();
          }
        };

        const observer = new MutationObserver(syncOverlay);
        observer.observe(document.getElementById('root'), {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ['class'],
          characterData: true,
        });
        syncOverlay();

        let startX = 0;
        let startY = 0;
        let eyeIndex = -1;
        let eyeSector = 0;
        let eyeStrong = false;
        let reactionHideTimer = null;

        const activeConfig = () => {
          const source = document.querySelector('.character-button.active img')?.getAttribute('src') || '';
          return Object.values(configs).find((config) => source.includes(config.source)) || null;
        };

        const pullModeActive = () => {
          const text = document.querySelector('.mode.active')?.textContent || '';
          return text.includes('PULL') || text.includes('ひっぱる') || text.includes('縺ｲ縺｣縺ｱ');
        };

        const setFeedback = (text) => {
          const bubble = document.querySelector('.feedback-bubble');
          if (bubble) bubble.textContent = text;
        };

        const cleanup = () => {
          if (reactionHideTimer) clearTimeout(reactionHideTimer);
          reactionHideTimer = null;
          overlay?.remove();
          defaultEye?.remove();
          overlay = null;
          defaultEye = null;
          canvas = null;
          boundCharacter = null;
          pointerDown = false;
          validCheekHit = false;
          isPulling = false;
          activePointerId = null;
        };

        const layoutEyes = (config) => {
          if (!canvas || !overlay || !defaultEye) return;
          const width = canvas.clientWidth;
          const height = canvas.clientHeight;
          const spriteSize = Math.min(width * 0.82, height * 0.74);
          const imageLeft = (width - spriteSize) / 2;
          const imageTop = height * 0.89 - spriteSize * 0.99;
          const scale = spriteSize / config.sourceSize;
          const { x, y, width: frameWidth, height: frameHeight } = config.frame;
          for (const image of [overlay, defaultEye]) {
            image.style.width = `${frameWidth * scale}px`;
            image.style.height = `${frameHeight * scale}px`;
            image.style.left = `${imageLeft + x * scale}px`;
            image.style.top = `${imageTop + y * scale}px`;
          }
        };

        // Mirror the touch bundle's pull hit-test.  Some embedded browsers do
        // not expose pointer capture to an observing listener even though the
        // canvas interaction itself is active, so the eye layer uses the same
        // cheek geometry as an explicit, local gate instead of relying only on
        // hasPointerCapture().
        const isPullCheekPoint = (clientX, clientY) => {
          if (!canvas) return false;
          const rect = canvas.getBoundingClientRect();
          const width = rect.width;
          const height = rect.height;
          const spriteSize = Math.min(width * 0.82, height * 0.74, 590);
          const centerX = width / 2;
          const floorY = height * 0.89;
          const centerY = floorY - spriteSize * 0.49;
          const u = (clientX - rect.left - (centerX - spriteSize / 2)) / spriteSize;
          const v = (clientY - rect.top - (centerY - spriteSize / 2)) / spriteSize;
          const body = ((u - 0.5) / 0.47) ** 6 + ((v - 0.48) / 0.49) ** 6 <= 1.14
            && u >= 0.02 && u <= 0.98 && v >= 0.01 && v <= 0.99;
          const leftCheek = ((u - 0.18) / 0.11) ** 2 + ((v - 0.5) / 0.19) ** 2 <= 1;
          const rightCheek = ((u - 0.86) / 0.1) ** 2 + ((v - 0.5) / 0.19) ** 2 <= 1;
          return body && (leftCheek || rightCheek);
        };

        const selectEye = (deltaX, deltaY, canvasWidth) => {
          const magnitude = Math.hypot(deltaX, deltaY);
          const angle = Math.atan2(deltaY, deltaX);
          const sectorSize = (Math.PI * 2) / directionPairs.length;
          const normalized = (angle + Math.PI * 2 + sectorSize / 2) % (Math.PI * 2);
          const candidateSector = Math.floor(normalized / sectorSize) % directionPairs.length;
          const currentCenter = eyeSector * sectorSize;
          const distanceFromCurrent = Math.abs(Math.atan2(
            Math.sin(angle - currentCenter),
            Math.cos(angle - currentCenter),
          ));
          if (magnitude >= 12 && distanceFromCurrent > sectorSize / 2 + Math.PI / 18) {
            eyeSector = candidateSector;
          }
          const strongOn = Math.max(70, canvasWidth * 0.16);
          const strongOff = Math.max(52, canvasWidth * 0.12);
          if (!eyeStrong && magnitude >= strongOn) eyeStrong = true;
          if (eyeStrong && magnitude <= strongOff) eyeStrong = false;
          return directionPairs[eyeSector][eyeStrong ? 1 : 0];
        };

        const bind = (nextCanvas, config) => {
          cleanup();
          canvas = nextCanvas;
          boundCharacter = config.source;
          overlay = document.createElement('img');
          overlay.className = 'character-eye-overlay';
          overlay.alt = '';
          overlay.src = config.eyes[0];
          defaultEye = document.createElement('img');
          defaultEye.className = 'character-eye-default';
          defaultEye.alt = '';
          defaultEye.src = config.eyes[0];
          for (const image of [overlay, defaultEye]) {
            image.style.cssText = 'position:absolute;z-index:3;display:none;pointer-events:none;object-fit:fill;';
            canvas.parentElement?.appendChild(image);
          }
          const updateLayout = () => layoutEyes(config);
          new ResizeObserver(updateLayout).observe(canvas);
          updateLayout();

          canvas.addEventListener('pointerdown', (event) => {
            // The interaction bundle may call setPointerCapture just after its
            // own pointerdown listener runs.  Record the press first, then let
            // pointermove verify that the native cheek hit actually captured
            // the pointer before showing any eye reaction.
            if (!pullModeActive()) return;
            validCheekHit = isPullCheekPoint(event.clientX, event.clientY);
            if (!validCheekHit) return;
            if (reactionHideTimer) clearTimeout(reactionHideTimer);
            reactionHideTimer = null;
            startX = event.clientX;
            startY = event.clientY;
            activePointerId = event.pointerId;
            pointerDown = true;
            isPulling = false;
            eyeIndex = -1;
            eyeSector = 0;
            eyeStrong = false;
            overlay.style.display = 'none';
            defaultEye.style.display = 'block';
            setFeedback('そのまま外へ、ぐーっと');
          }, { passive: true });
          canvas.addEventListener('pointermove', (event) => {
            if (!pointerDown || !validCheekHit || activePointerId !== event.pointerId) return;
            const deltaX = event.clientX - startX;
            const deltaY = event.clientY - startY;
            const distance = Math.hypot(deltaX, deltaY);
            if (!isPulling && distance < 4) return;
            if (!isPulling) {
              isPulling = true;
              defaultEye.style.display = 'none';
              overlay.style.display = 'block';
            }
            const nextEyeIndex = selectEye(deltaX, deltaY, Math.max(canvas.clientWidth, 1));
            if (nextEyeIndex !== eyeIndex) {
              eyeIndex = nextEyeIndex;
              overlay.src = config.eyes[eyeIndex];
            }
            canvas.dataset.eyeReactionVariant = String(eyeIndex + 1);
          }, { passive: true });
          const end = () => {
            if (!pointerDown) return;
            const didPull = isPulling;
            pointerDown = false;
            validCheekHit = false;
            activePointerId = null;
            isPulling = false;
            if (!didPull) {
              overlay.style.display = 'none';
              defaultEye.style.display = pullModeActive() ? 'block' : 'none';
              return;
            }
            overlay.style.display = 'block';
            defaultEye.style.display = 'none';
            setFeedback('ぷるん');
            if (reactionHideTimer) clearTimeout(reactionHideTimer);
            reactionHideTimer = setTimeout(() => {
              reactionHideTimer = null;
              overlay.style.display = 'none';
              defaultEye.style.display = pullModeActive() ? 'block' : 'none';
            }, 550);
          };
          canvas.addEventListener('pointerup', end, { passive: true });
          canvas.addEventListener('pointercancel', end, { passive: true });
          canvas.addEventListener('lostpointercapture', end, { passive: true });
          canvas.dataset.eyeReactionBound = config.source;
        };

        const sync = () => {
          const config = activeConfig();
          const nextCanvas = document.querySelector('.canvas-wrap canvas');
          if (!config || !nextCanvas) {
            if (boundCharacter) cleanup();
            return;
          }
          if (boundCharacter !== config.source || canvas !== nextCanvas) bind(nextCanvas, config);
          if (!pullModeActive()) {
            overlay.style.display = 'none';
            defaultEye.style.display = 'none';
          } else if (!pointerDown && !reactionHideTimer) {
            defaultEye.style.display = 'block';
            layoutEyes(config);
          }
        };

        const observer = new MutationObserver(sync);
        observer.observe(document.getElementById('root'), {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ['class'],
        });
        sync();
      })();
    </script>
    <script src="../assets/mobby-guide.js"></script>
  </body>
</html>
