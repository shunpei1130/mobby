<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="モビーを引っぱる、押す、飛ばす。キャラクターを触って遊べるインタラクティブ体験。"
    />
    <title>モビー ぷにぷに体験</title>
    <script type="module" crossorigin src="./assets/index-B0UzwmYj.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index--hYk2uJk.css">
    <style>
      /* Main-page embed: keep only the throw interaction from Touch Lab. */
      .mode-picker,
      .control-heading {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const applyThrowOnly = () => {
          const buttons = [...document.querySelectorAll('.mode')];
          const throwButton = buttons.find((button) => button.textContent.includes('とばす'));
          if (!throwButton) return false;

          if (!throwButton.classList.contains('active')) throwButton.click();
          const introCopy = document.querySelector('.intro-copy');
          if (introCopy) introCopy.innerHTML = 'モビーを指で飛ばして、<br>ぷにっと遊んでみて。';
          const instructionNumber = document.querySelector('.instruction-number');
          if (instructionNumber) instructionNumber.textContent = '01';
          return true;
        };

        const observer = new MutationObserver(() => {
          if (applyThrowOnly()) observer.disconnect();
        });
        observer.observe(document.getElementById('root'), { childList: true, subtree: true });
        applyThrowOnly();
      })();
    </script>
  </body>
</html>
