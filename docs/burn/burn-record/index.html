  <script>
    (() => {
      const restoreBackgroundScroll = (left) => {
        const grid = document.querySelector("[data-record-background-grid]");
        if (grid) grid.scrollLeft = left;
      };

      document.addEventListener("click", (event) => {
        if (!event.target.closest("[data-record-background]")) return;
        const left = document.querySelector("[data-record-background-grid]")?.scrollLeft || 0;
        requestAnimationFrame(() => restoreBackgroundScroll(left));
        window.setTimeout(() => restoreBackgroundScroll(left), 0);
      }, true);
    })();
  </script>
  <script>
    (() => {
      const MAX_MEMO_CHARS = 56;
      const MAX_MEMO_LINES = 4;

      function syncMemoLimit(input) {
        if (!input || !input.matches("[data-record-memo], [data-record-edit-memo]")) return;
        let value = String(input.value || "").replace(/\r\n/g, "\n");
        let lines = value.split("\n");
        if (lines.length > MAX_MEMO_LINES) {
          lines = lines.slice(0, MAX_MEMO_LINES);
          value = lines.join("\n");
        }
        if (value.length > MAX_MEMO_CHARS) value = value.slice(0, MAX_MEMO_CHARS);
        if (input.value !== value) input.value = value;

        const limit = input.closest(".record-field")?.querySelector("[data-record-memo-limit], .record-field__limit");
        const nextLimitText = `${value.length}/${MAX_MEMO_CHARS}文字・${value.split("\n").length}/${MAX_MEMO_LINES}行`;
        if (limit && limit.textContent !== nextLimitText) limit.textContent = nextLimitText;
      }

      function syncAllMemoLimits() {
        document.querySelectorAll("[data-record-memo], [data-record-edit-memo]").forEach(syncMemoLimit);
      }

      document.addEventListener("input", (event) => syncMemoLimit(event.target));
      document.addEventListener("keydown", (event) => {
        const input = event.target;
        if (!input?.matches?.("[data-record-memo], [data-record-edit-memo]")) return;
        if (event.key === "Enter" && String(input.value || "").split(/\r\n|\n|\r/).length >= MAX_MEMO_LINES) {
          event.preventDefault();
        }
      });

      new MutationObserver(syncAllMemoLimits).observe(document.documentElement, { childList: true, subtree: true });
      document.addEventListener("DOMContentLoaded", syncAllMemoLimits);
    })();
  </script>
  <script>
    (() => {
      const HEART_ICON = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='none' stroke='%2353463d' stroke-width='5' stroke-linecap='round' stroke-linejoin='round' d='M32 54S8 39 8 22c0-8 6-14 14-14 5 0 9 3 10 7 1-4 5-7 10-7 8 0 14 6 14 14 0 17-24 32-24 32Z'/%3E%3C/svg%3E";
      const PIN_ICON_SRC = "./assets/reference/pin_toka.png";
      const fixBrokenHeartIcon = (root = document) => {
        root.querySelectorAll?.('img[src$="/image/icon/feature/like.webp"], img[src="image/icon/feature/like.webp"]').forEach((img) => {
          img.src = HEART_ICON;
        });
      };
      const replacePinIcons = (root = document) => {
        root.querySelectorAll?.(".record-input-wrap svg, .record-template-slot--text strong svg").forEach((svg) => {
          const path = svg.querySelector("path")?.getAttribute("d") || "";
          if (!path.includes("5.2-9.2") && !path.includes("5.2 0 1 0")) return;
          const img = document.createElement("img");
          img.src = PIN_ICON_SRC;
          img.alt = "";
          img.decoding = "async";
          img.loading = "eager";
          img.dataset.recordPinImage = "true";
          img.setAttribute("aria-hidden", "true");
          svg.replaceWith(img);
        });
      };
      document.addEventListener("error", (event) => {
        const target = event.target;
        if (target?.tagName === "IMG" && /\/?image\/icon\/feature\/like\.webp$/.test(target.getAttribute("src") || "")) {
          target.src = HEART_ICON;
        }
      }, true);
      new MutationObserver((records) => {
        records.forEach((record) => record.addedNodes.forEach((node) => {
          if (node.nodeType === 1) fixBrokenHeartIcon(node);
          if (node.nodeType === 1) replacePinIcons(node);
        }));
      }).observe(document.documentElement, { childList: true, subtree: true });
      document.addEventListener("DOMContentLoaded", () => {
        fixBrokenHeartIcon();
        replacePinIcons();
      });
    })();
  </script>

<body>
  <main id="recordRoot"></main>
  <div class="burn-guide-overlay" id="burnGuideOverlay" role="dialog" aria-modal="true" aria-labelledby="burnGuideTitle">
    <section class="burn-guide-card">
      <p class="burn-guide-step" id="burnGuideStep">STEP 1 / 5</p>
      <h2 class="burn-guide-title" id="burnGuideTitle">写真を追加しよう</h2>
      <div class="burn-guide-heart" aria-hidden="true">♡</div>
      <p class="burn-guide-copy" id="burnGuideCopy">まずは思い出の写真をアップロードします。大きな追加枠をタップして、1〜3枚の写真を選びましょう。</p>
      <div class="burn-guide-visual" id="burnGuideVisual" aria-hidden="true"></div>

      <div class="burn-guide-actions">

      </div>
      <div class="burn-guide-dots" id="burnGuideDots" aria-hidden="true"></div>
    </section>
  </div>
  <script>
    (() => {
      const overlay = document.getElementById("burnGuideOverlay");
      if (!overlay) return;

      const steps = [
        {
          title: "写真を追加しよう",
          copy: "まずは思い出の写真をアップロードします。大きな追加枠をタップして、1〜3枚の写真を選びましょう。",
          visual: '<div class="burn-guide-upload"><strong>＋</strong><span>写真を追加</span></div>'
        },
        {
          title: "場所と感想を入れよう",
          copy: "写真を追加したら、場所と感想を入力します。ページに載せたい一言もここで記録できます。",
          visual: '<div class="burn-guide-memory-card"><img class="burn-guide-real-photo" src="../reference/splash_photo1.jpg" alt=""><div class="burn-guide-form"><div class="burn-guide-field">◎　代官山</div><div class="burn-guide-field">☵　カフェの雰囲気が素敵だった</div></div></div>'
        },
        {
          title: "タイトルと配置を選ぼう",
          copy: "写真がそろったら、順番やテンプレートを選びます。ページタイトルもここで決めましょう。",
          visual: '<div class="burn-guide-template-panel"><div class="burn-guide-mini-photos"><div class="burn-guide-mini-photo"><img class="burn-guide-real-photo" src="../reference/splash_photo1.jpg" alt=""><span>配置順</span><div class="burn-guide-order">↑ 1 ↓</div></div><div class="burn-guide-mini-photo"><img class="burn-guide-real-photo" src="../reference/splash_photo2.jpg" alt=""><span>配置順</span><div class="burn-guide-order">↑ 2 ↓</div></div><div class="burn-guide-mini-photo"><img class="burn-guide-real-photo" src="../reference/splash_photo3.jpg" alt=""><span>配置順</span><div class="burn-guide-order">↑ 3 ↓</div></div></div><p>Template</p><div class="burn-guide-template-row"><div class="burn-guide-template is-selected"><img src="./assets/template/template001-C4MCDSgU.webp" alt="">Template 001</div><div class="burn-guide-template"><img src="./assets/template/template002-BCt9LpnA.webp" alt="">Template 002</div></div><p>Page title</p><input value="菜月とこうきは伝説かも!?" readonly /></div>'
        },
        {
          title: "背景を選ぼう",
          copy: "プレビューを見ながら、ページに合う背景を選べます。雰囲気に合う一枚で、思い出をもっとかわいく。",
          visual: '<img class="burn-guide-page-image" src="../reference/splash_page.webp" alt=""><div style="height:14px"></div><div class="burn-guide-background-row"><div class="burn-guide-bg"><img src="./assets/background/back_ex13-DNPGpq3n.webp" alt=""></div><div class="burn-guide-bg is-selected"><img src="./assets/background/back_ex26-DBw7egja.webp" alt=""></div><div class="burn-guide-bg"><img src="./assets/background/back_newwave_4-B20ILSGG.webp" alt=""></div></div>'
        },
        {
          title: "完成・保存しよう",
          copy: "最後に1ページになった思い出を保存して完成です。できあがったページは、そのまま見返せます。",
          visual: '<img class="burn-guide-page-image" src="../reference/splash_page.webp" alt=""><div class="burn-guide-field" style="justify-content:center;margin-top:14px">↓　写真を保存</div>'
        }
      ];

      let index = 0;
      const stepEl = document.getElementById("burnGuideStep");
      const titleEl = document.getElementById("burnGuideTitle");
      const copyEl = document.getElementById("burnGuideCopy");
      const visualEl = document.getElementById("burnGuideVisual");
      const dotsEl = document.getElementById("burnGuideDots");
      const nextButton = document.getElementById("burnGuideNext");
      const skipButton = document.getElementById("burnGuideSkip");

      const close = () => {
        overlay.hidden = true;
      };

      const guideTitles = [
        "写真をアップする",
        "場所と感想を入力",
        "タイトルと配置を選ぶ",
        "好みの背景を選んで",
        "完成！保存！"
      ];

      const render = () => {
        const step = steps[index];
        stepEl.textContent = `STEP ${index + 1} / ${steps.length}`;
        titleEl.textContent = guideTitles[index] || step.title;
        copyEl.textContent = guideTitles[index] || step.copy;
        visualEl.innerHTML = step.visual;
        if (index === 2) {
          visualEl.querySelector(".burn-guide-mini-photos")?.remove();
        }
        nextButton.textContent = index === steps.length - 1 ? "はじめる" : "次へ";
        skipButton.textContent = index === steps.length - 1 ? "戻る" : "スキップ";
        dotsEl.innerHTML = steps.map((_, dotIndex) => `<span class="${dotIndex === index ? "is-active" : ""}"></span>`).join("");
      };

      nextButton.addEventListener("click", () => {
        if (index >= steps.length - 1) {
          close();
          return;
        }
        index += 1;
        render();
      });

      skipButton.addEventListener("click", () => {
        if (index === steps.length - 1) {
          index -= 1;
          render();
          return;
        }
        close();
      });

      render();
    })();

    (() => {
      const root = document.getElementById("recordRoot");
      if (!root) return;
      let preparedPageSave = null;
      let preparedPageElement = null;
      let preparePageSavePromise = null;

      const clearPreparedPageSave = () => {
        if (preparedPageSave?.objectUrl) URL.revokeObjectURL(preparedPageSave.objectUrl);
        preparedPageSave = null;
      };

      const waitForImage = (img) => {
        if (img.complete && img.naturalWidth > 0) return Promise.resolve();
        return new Promise((resolve) => {
          img.addEventListener("load", resolve, { once: true });
          img.addEventListener("error", resolve, { once: true });
        });
      };

      const imageToDataUrl = async (img) => {
        const src = img.currentSrc || img.src || "";
        if (!src || src.startsWith("data:")) return src;
        try {
          const response = await fetch(src, { cache: "force-cache" });
          if (!response.ok) return src;
          const blob = await response.blob();
          return await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(String(reader.result || src));
            reader.onerror = reject;
            reader.readAsDataURL(blob);
          });
        } catch (_) {
          return src;
        }
      };

      const drawWrappedText = (ctx, text, x, y, maxWidth, lineHeight, maxHeight) => {
        const rawLines = String(text || "").split(/\r\n|\n|\r/);
        let cursorY = y;
        for (const rawLine of rawLines) {
          let line = "";
          for (const char of rawLine) {
            const testLine = line + char;
            if (line && ctx.measureText(testLine).width > maxWidth) {
              if (cursorY + lineHeight > y + maxHeight) return;
              ctx.fillText(line, x, cursorY);
              cursorY += lineHeight;
              line = char;
            } else {
              line = testLine;
            }
          }
          if (cursorY + lineHeight > y + maxHeight) return;
          ctx.fillText(line, x, cursorY);
          cursorY += lineHeight;
        }
      };

      const drawContainedImage = (ctx, img, x, y, width, height, fit = "cover", feather = false) => {
        const naturalWidth = img.naturalWidth || img.width;
        const naturalHeight = img.naturalHeight || img.height;
        if (!naturalWidth || !naturalHeight || width <= 0 || height <= 0) return;

        const scale = fit === "contain"
          ? Math.min(width / naturalWidth, height / naturalHeight)
          : Math.max(width / naturalWidth, height / naturalHeight);
        const drawWidth = naturalWidth * scale;
        const drawHeight = naturalHeight * scale;
        const drawX = x + (width - drawWidth) / 2;
        const drawY = y + (height - drawHeight) / 2;

        if (!feather) {
          ctx.save();
          ctx.beginPath();
          ctx.rect(x, y, width, height);
          ctx.clip();
          ctx.drawImage(img, drawX, drawY, drawWidth, drawHeight);
          ctx.restore();
          return;
        }

        const layer = document.createElement("canvas");
        layer.width = Math.max(1, Math.round(width));
        layer.height = Math.max(1, Math.round(height));
        const layerCtx = layer.getContext("2d");
        layerCtx.drawImage(img, drawX - x, drawY - y, drawWidth, drawHeight);

        const pixels = layerCtx.getImageData(0, 0, layer.width, layer.height);
        const fadeX = Math.max(1, layer.width * 0.07);
        const fadeY = Math.max(1, layer.height * 0.07);
        for (let py = 0; py < layer.height; py += 1) {
          const alphaY = Math.min(1, py / fadeY, (layer.height - 1 - py) / fadeY);
          for (let px = 0; px < layer.width; px += 1) {
            const alphaX = Math.min(1, px / fadeX, (layer.width - 1 - px) / fadeX);
            const alpha = Math.max(0, Math.min(alphaX, alphaY));
            pixels.data[(py * layer.width + px) * 4 + 3] *= alpha;
          }
        }
        layerCtx.putImageData(pixels, 0, 0);
        ctx.drawImage(layer, x, y);
      };

      const drawPinIcon = (ctx, element, pageRect, scale) => {
        const icon = element.querySelector("[data-record-pin-image], svg");
        if (!icon) return 0;

        const iconRect = icon.getBoundingClientRect();
        if (iconRect.width <= 0 || iconRect.height <= 0) return 0;
        const style = getComputedStyle(icon);
        if (style.visibility === "hidden" || style.display === "none" || Number(style.opacity) === 0) return 0;

        const x = (iconRect.left - pageRect.left) * scale;
        const y = (iconRect.top - pageRect.top) * scale;
        const width = iconRect.width * scale;
        const height = iconRect.height * scale;
        const color = style.color || getComputedStyle(element).color || "#b46a62";

        const elementRect = element.getBoundingClientRect();
        const gap = (parseFloat(getComputedStyle(element).fontSize) || iconRect.width) * 0.32;

        if (icon.matches("img") && icon.complete && icon.naturalWidth > 0) {
          ctx.drawImage(icon, x, y, width, height);
          return Math.max(0, (iconRect.right - elementRect.left + gap) * scale);
        }

        ctx.save();
        ctx.strokeStyle = color;
        ctx.lineWidth = Math.max(1, 1.8 * scale);
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.translate(x, y);
        ctx.scale(width / 24, height / 24);
        ctx.beginPath();
        ctx.moveTo(8.05, 4.6);
        ctx.lineTo(15.95, 4.6);
        ctx.lineTo(14.9, 9.8);
        ctx.lineTo(18.15, 13.05);
        ctx.bezierCurveTo(18.51, 13.41, 18.25, 14.03, 17.73, 14.03);
        ctx.lineTo(6.27, 14.03);
        ctx.bezierCurveTo(5.75, 14.03, 5.49, 13.41, 5.85, 13.05);
        ctx.lineTo(9.1, 9.8);
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(12, 14.05);
        ctx.lineTo(12, 20.45);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(9.95, 19.05);
        ctx.lineTo(12, 21.4);
        ctx.lineTo(14.05, 19.05);
        ctx.stroke();
        ctx.restore();

        return Math.max(0, (iconRect.right - elementRect.left + gap) * scale);
      };

      const drawElementText = (ctx, element, pageRect, scale) => {
        const text = String(element.textContent || "").trim();
        if (!text) return;

        const rect = element.getBoundingClientRect();
        if (rect.width <= 0 || rect.height <= 0) return;
        const style = getComputedStyle(element);
        if (style.visibility === "hidden" || style.display === "none" || Number(style.opacity) === 0) return;

        const fontSize = parseFloat(style.fontSize) || 14;
        const lineHeight = style.lineHeight === "normal" ? fontSize * 1.4 : parseFloat(style.lineHeight) || fontSize * 1.4;
        const fontWeight = style.fontWeight || "400";
        const fontFamily = style.fontFamily || "serif";
        const x = (rect.left - pageRect.left) * scale;
        const y = (rect.top - pageRect.top) * scale;
        const width = rect.width * scale;
        const height = rect.height * scale;
        const padTop = (parseFloat(style.paddingTop) || 0) * scale;
        const padRight = (parseFloat(style.paddingRight) || 0) * scale;
        const padBottom = (parseFloat(style.paddingBottom) || 0) * scale;
        const padLeft = (parseFloat(style.paddingLeft) || 0) * scale;

        ctx.save();
        ctx.fillStyle = style.color || "#302623";
        ctx.font = `${fontWeight} ${fontSize * scale}px ${fontFamily}`;
        ctx.textBaseline = "top";
        ctx.textAlign = style.textAlign === "center" ? "center" : style.textAlign === "right" ? "right" : "left";

        const isTemplateText = Boolean(element.closest(".record-template-slot--text"));
        const contentHeight = Math.max(1, height - padTop - padBottom);
        const drawHeight = isTemplateText
          ? Math.max(contentHeight, (pageRect.bottom - rect.top) * scale - padTop)
          : contentHeight;
        const isPinHeading = element.matches(".record-template-slot--text strong");
        const textY = isPinHeading || style.alignContent === "center" || style.placeItems.includes("center")
          ? y + padTop + Math.max(0, (contentHeight - lineHeight * scale) / 2)
          : y + padTop;
        const textX = ctx.textAlign === "center"
          ? x + width / 2
          : ctx.textAlign === "right"
            ? x + width - padRight
            : x + padLeft;
        const iconOffset = isPinHeading ? drawPinIcon(ctx, element, pageRect, scale) : 0;
        const adjustedTextX = ctx.textAlign === "left" ? Math.max(textX, x + iconOffset) : textX;
        const maxWidth = Math.max(1, width - padLeft - padRight - (adjustedTextX - textX));
        if (isPinHeading) {
          ctx.fillText(text, adjustedTextX, textY, maxWidth);
          ctx.restore();
          return;
        }
        drawWrappedText(ctx, text, adjustedTextX, textY, maxWidth, lineHeight * scale, drawHeight);
        ctx.restore();
      };

      const drawPageToCanvas = async (page, canvas, scale) => {
        const ctx = canvas.getContext("2d");
        const pageRect = page.getBoundingClientRect();
        const pageStyle = getComputedStyle(page);
        ctx.fillStyle = pageStyle.backgroundColor && pageStyle.backgroundColor !== "rgba(0, 0, 0, 0)"
          ? pageStyle.backgroundColor
          : "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const images = Array.from(page.querySelectorAll("img"));
        for (const element of images) {
          if (element.matches("[data-record-pin-image]")) continue;
          const rect = element.getBoundingClientRect();
          if (rect.width <= 0 || rect.height <= 0) continue;
          const x = (rect.left - pageRect.left) * scale;
          const y = (rect.top - pageRect.top) * scale;
          const width = rect.width * scale;
          const height = rect.height * scale;

          await waitForImage(element);
          const feather = Boolean(element.closest(".record-generated-page--photo-soft .record-template-slot--image"));
          drawContainedImage(ctx, element, x, y, width, height, getComputedStyle(element).objectFit || "cover", feather);
        }

        page.querySelectorAll(".record-template-slot--title, .record-template-slot--text strong, .record-template-slot--text p").forEach((element) => {
          drawElementText(ctx, element, pageRect, scale);
        });
      };

      const buildGeneratedPageFile = async (page) => {
        await Promise.all(Array.from(page.querySelectorAll("img")).map(waitForImage));
        const rect = page.getBoundingClientRect();
        const width = Math.max(1, Math.round(rect.width));
        const height = Math.max(1, Math.round(rect.height));
        const scale = Math.max(2, Math.min(4, window.devicePixelRatio || 2));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(width * scale);
        canvas.height = Math.round(height * scale);
        await drawPageToCanvas(page, canvas, scale);

        const fileName = `mobby-page-${new Date().toISOString().slice(0, 10)}.png`;
        const blob = await new Promise((resolve, reject) => {
          canvas.toBlob((result) => {
            if (result) resolve(result);
            else reject(new Error("Canvas export failed"));
          }, "image/png");
        });

        return {
          blob,
          fileName,
          objectUrl: URL.createObjectURL(blob),
        };
      };

      const prepareGeneratedPageSave = () => {
        const page = root.querySelector(".record-generated-page");
        const button = root.querySelector("[data-record-save-page]");
        if (!page) return;

        if (preparedPageElement === page && preparedPageSave) return;
        if (preparedPageElement === page && preparePageSavePromise) return;

        preparedPageElement = page;
        clearPreparedPageSave();
        if (button) {
          button.setAttribute("aria-busy", "true");
          button.disabled = true;
        }
        preparePageSavePromise = buildGeneratedPageFile(page)
          .then((result) => {
            if (preparedPageElement === page) {
              preparedPageSave = result;
            } else if (result.objectUrl) {
              URL.revokeObjectURL(result.objectUrl);
            }
            return result;
          })
          .catch((error) => {
            console.error("[record-save-page:prepare]", error);
            if (preparedPageElement === page) clearPreparedPageSave();
            throw error;
          })
          .finally(() => {
            if (preparedPageElement === page) preparePageSavePromise = null;
            if (button) {
              button.removeAttribute("aria-busy");
              button.disabled = false;
            }
          });
      };

      const saveGeneratedPage = async () => {
        const page = root.querySelector(".record-generated-page");
        const button = root.querySelector("[data-record-save-page]");
        if (!page) return;

        if (preparedPageElement !== page || (!preparedPageSave && !preparePageSavePromise)) {
          prepareGeneratedPageSave();
        }

        if (button) button.setAttribute("aria-busy", "true");
        try {
          const prepared = preparedPageSave || await preparePageSavePromise || await buildGeneratedPageFile(page);
          preparedPageElement = page;
          preparedPageSave = prepared;

          const link = document.createElement("a");
          link.download = prepared.fileName;
          link.href = prepared.objectUrl;
          link.rel = "noopener";
          document.body.appendChild(link);
          link.click();
          link.remove();
        } catch (error) {
          console.error("[record-save-page]", error);
          alert("画像保存に失敗しました。時間をおいてもう一度試してください。");
        } finally {
          if (button) button.removeAttribute("aria-busy");
        }
      };

      const addHomeReturn = () => {
        const actions = root.querySelector(".record-page--complete .record-complete-actions");
        if (!actions) return;

        const saveButton = actions.querySelector("[data-record-save-page]");
        if (!saveButton) return;
        prepareGeneratedPageSave();

        const completePage = root.querySelector(".record-page--complete");
        if (completePage && !completePage.querySelector("[data-record-complete-back]")) {
          const backButton = document.createElement("button");
          backButton.type = "button";
          backButton.dataset.recordCompleteBack = "true";
          backButton.setAttribute("aria-label", "戻る");
          backButton.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14.8 6.8 9.3 12l5.5 5.2"/></svg>';
          completePage.insertAdjacentElement("afterbegin", backButton);
        }

        if (actions.querySelector("[data-record-home-return]")) return;

        const homeButton = document.createElement("button");
        homeButton.type = "button";
        homeButton.dataset.recordHomeReturn = "true";
        homeButton.innerHTML = "<span>Homeに戻る</span>";
        saveButton.insertAdjacentElement("afterend", homeButton);
      };

      root.addEventListener("click", (event) => {
        if (event.target.closest("[data-record-save-page]")) {
          event.preventDefault();
          event.stopImmediatePropagation();
          saveGeneratedPage();
          return;
        }
        if (event.target.closest("[data-record-complete-back]")) {
          event.preventDefault();
          event.stopImmediatePropagation();
          root.querySelector(".record-page--complete [data-record-stage='select']")?.click();
          return;
        }
        if (!event.target.closest("[data-record-home-return]")) return;
        window.location.href = "../../index.html";
      }, true);

      new MutationObserver(addHomeReturn).observe(root, {
        childList: true,
        subtree: true
      });
      addHomeReturn();
    })();
  </script>
</body>
</html>
