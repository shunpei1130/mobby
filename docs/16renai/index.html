</head>
<body>
  <div id="loveRoot"></div>
  <script>
    (() => {
      const labels = new Map([
        ["[data-love-tab-diagnosis]", "診断"],
        ["[data-love-character-list]", "キャラ一覧"],
        ["[data-love-compatibility]", "相性を見る"],
        ["[data-love-reset]", "リセット"],
        ["[data-love-type-guide]", "タイプ解説"],
        ["[data-love-fortune]", "占い"]
      ]);

      const updateIntro = () => {
        labels.forEach((text, selector) => {
          document.querySelectorAll(selector).forEach((el) => {
            if (el.textContent !== text) el.textContent = text;
          });
        });
        document.querySelectorAll("[data-love-diagnosis-start]").forEach((el) => {
          const text = "♡　診断をはじめる　›";
          if (el.textContent !== text) el.textContent = text;
        });

        const hero = document.querySelector(".love-diagnosis--intro .love-diagnosis__hero");
        if (!hero || hero.dataset.renaiIntroReady === "true") return;
        hero.dataset.renaiIntroReady = "true";
        hero.innerHTML = `
          <div class="love-intro-ornament" aria-hidden="true">❤︎ ❤ ❤︎</div>
          <p class="love-diagnosis__eyebrow">・ 恋愛モビー診断 ・</p>
          <h3>あなたの恋愛タイプを<br><strong>4つの軸</strong>で診断します。</h3>
          <div class="love-intro-divider" aria-hidden="true">❤</div>
          <p>直感で選ぶ40問の質問から、あなたの恋愛タイプを16種類から診断します。</p>
        `;
      };

      const observer = new MutationObserver(updateIntro);
      observer.observe(document.getElementById("loveRoot"), { childList: true, subtree: true });
      document.addEventListener("DOMContentLoaded", updateIntro);
      const scrollDiagnosisTop = () => {
        window.scrollTo({ top: 0, left: 0, behavior: "auto" });
        document.querySelector(".page--diagnosis")?.scrollTo?.({ top: 0, left: 0, behavior: "auto" });
      };
      document.addEventListener("click", (event) => {
        const target = event.target.closest("[data-love-diagnosis-start], [data-love-page-prev], [data-love-page-next], [data-love-gate-back]");
        if (!target) return;
        window.requestAnimationFrame(scrollDiagnosisTop);
        window.setTimeout(scrollDiagnosisTop, 0);
      }, true);
      updateIntro();
    })();
  </script>
</body>
</html>
