      const SCALE = 7, MID = 4, MAX_DEV = 3, GAMMA = 1.35, EXTREME_BONUS = 0.35, COHERENCE_SHRINK = 0.20;

      const shapeAns = ans => {
        const centered = MID - ans;
        const t = centered / MAX_DEV;

        return Math.sign(t) * Math.pow(mag, GAMMA);
      };

        submitEl.disabled = true;
        submitEl.textContent = "結果を準備中...";
        pendingEl.style.display = "block";
        state.profile = {name, email, age};
        try {
          await fetch("/api/lead", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({name, email, age, type:result.code, diagnosisName:result.char?.name || "", source:"hinata-aoi", createdAt:new Date().toISOString()}),
            keepalive:true
          });
          state.sentToLead = true;
        } catch (_) {}
        state.step = "result";
        saveState();
        render();
      };
    }
    function renderResult(){
      if(!isRegistered()){ state.step = "gate"; saveState(); render(); return; }
      if(!isComplete()){ state.step = "intro"; render(); return; }
      const result = computeResult();
      state.axes = result;
      saveState();
      const c = result.char;
      const beauty = HINATA_BEAUTY_NOTES[result.code];
      const beautyHtml = beauty ? `
          <div class="panel fade-in" style="background:linear-gradient(135deg, #fff7fb 0%, #fff 100%); border-left:4px solid var(--accent);">
            <p class="kicker">HINATA BEAUTY NOTE</p>
            <div style="margin:0 0 18px;">
              <div style="display:flex; align-items:center; gap:16px; margin:0 0 14px;">
                <img src="img/hinatatoka.png" alt="日向葵衣からの一言" style="width:96px; height:96px; object-fit:cover; border-radius:50%; box-shadow:var(--shadow-sm); flex:0 0 auto;">
                <h2 class="big" style="margin:0;">日向葵衣からの一言</h2>
              </div>
              <p class="text-body" style="color:#111111; font-weight:600; font-size:15px; line-height:1.9; margin:0;">${beauty.message}</p>
            </div>
            <div class="section-grid">
              <div class="mini"><h3>今日の小さな美容ミッション</h3><p>${beauty.mission}</p></div>
              <div class="mini"><h3>シェア用一言</h3><p>${beauty.share}</p></div>
            </div>
          </div>` : "";
      app.innerHTML = `
        <div class="panel fade-in">
          <div class="result-hero">
            <p class="kicker">診断結果</p>
            <h2 class="big" style="font-size:28px;">${c.name}</h2>
            <p class="text-body" style="color:var(--text-main); font-weight:600; font-size:16px; max-width:560px; margin:0 auto 18px;">
              ${c.catch}
            </p>
            <img class="result-img" src="${c.image}" alt="${c.name}">
            <p class="text-body" style="max-width:560px; margin:18px auto 0;">${c.summary}</p>
            ${socialLinksHtml()}
          </div>
        </div>

        <div class="panel fade-in">
          <p class="kicker">3 AXES</p>
          <h2 class="big">あなたのビューティバランス</h2>
          ${renderAxis(result)}
          ${result.straightLine ? `<p class="text-body" style="color:#ff9500; margin-top:18px;">同じ回答が多めです。気分を変えてもう一度試すと、少し違う結果になるかもしれません。</p>` : ""}
          ${result.adjacentTypes.length ? `
            <div style="margin-top:22px; padding:16px; background:#fff8f6; border-radius:14px; border-left:4px solid var(--accent);">
              <p style="font-size:13px; font-weight:700; color:var(--accent); margin:0 0 8px;">場合によっては...</p>
              <p class="text-body" style="margin:0;">近いタイプ: ${result.adjacentTypes.map(t => t.name).join(" / ")}</p>
            </div>
          ` : ""}
        </div>

        <div id="detailSections">
          <div class="panel fade-in">
            <p class="kicker">MOOD</p>
            <h2 class="big">似合うムード</h2>
            <p class="text-body" style="color:#111111; font-weight:600; font-size:15px; line-height:1.9; margin:0;">${c.hook}</p>
          </div>

          <div class="panel fade-in" style="background:linear-gradient(135deg, #fff5f5 0%, #fff 100%); border-left:4px solid #ff6b6b;">
            <p class="kicker" style="color:#ff6b6b;">WHEN TIRED</p>
            <h2 class="big">しんどい時</h2>
            <p class="text-body" style="color:#111111; font-weight:600; font-size:15px; line-height:1.9; margin:0;">${c.downside}</p>
          </div>

          <div class="panel fade-in" style="background:linear-gradient(135deg, #f0f9ff 0%, #fff 100%); border-left:4px solid #4dabf7;">
            <p class="kicker" style="color:#4dabf7;">FROM OTHERS</p>
            <h2 class="big">周りからの見え方</h2>
            <p class="text-body" style="color:#111111; font-weight:600; font-size:15px; line-height:1.9; margin:0;">${c.perception}</p>
          </div>

          <div class="panel fade-in">
            <p class="kicker">CARE POINT</p>
            <h2 class="big">今日の美容ヒント</h2>
            <div class="section-grid">
              <div class="mini"><h3>強み</h3><p>${c.strength}</p></div>
              <div class="mini"><h3>気をつけたいこと</h3><p>${c.weakness}</p></div>
              <div class="mini" style="grid-column:1 / -1;"><h3>今日の美容ヒント</h3><p>${c.advice}</p></div>
            </div>
          </div>
          ${beautyHtml}
        </div>

        <div class="panel fade-in" style="text-align:center;">
          <p class="kicker">NEXT</p>
          <div class="actions">
            <button class="primary" id="btnAgain">もう一度診断する</button>
          </div>
        </div>`;
      document.getElementById("btnAgain").onclick = resetDiagnosis;
    }
    function renderCharacters(){
      const cards = Object.entries(CHARACTERS).map(([code, c]) => {
        return `<article class="char-card fade-in">
          <img src="${c.image}" alt="${c.name}">
          <div class="char-body">
            <h3>${c.name}</h3>
            <p>${c.catch}</p>
            <button class="primary" style="width:100%; font-size:12px; margin-top:14px;" data-code="${code}">詳細</button>
          </div>
        </article>`;
      }).join("");
      app.innerHTML = `<div class="panel fade-in"><h2 class="big">日向葵衣 あなたは何タイプ？ビューティ診断</h2><p class="text-body characters-intro">それぞれのタイプごとに、似合うムード、日向葵衣からの一言、今日できる小さな美容ミッションをまとめています。結果だけで終わらず、明日からの見せ方やケアに使えるタイプ解説です。</p><div class="characters-grid">${cards}</div><div class="actions"><button class="primary" id="btnBackDiagnosis">${isComplete() ? "結果に戻る" : "診断する"}</button></div></div>`;
      document.querySelectorAll("button[data-code]").forEach(btn => { btn.onclick = () => showCharDetail(btn.dataset.code); });
      document.getElementById("btnBackDiagnosis").onclick = () => { state.step = isComplete() ? "result" : "intro"; saveState(); render(); };
    }
    function showCharDetail(code){
      const c = CHARACTERS[code];
      const beauty = HINATA_BEAUTY_NOTES[code];
      const beautyHtml = beauty ? `
        <div style="margin-top:20px; padding:14px; background:#fff7fb; border-radius:12px; border-left:3px solid var(--accent);">
          <h3 style="font-size:14px; font-weight:700; color:var(--accent); margin:0 0 8px;">日向葵衣からの一言</h3>
          <p style="font-size:13px; line-height:1.8; margin:0 0 12px;">${beauty.message}</p>
          <div style="display:grid; gap:10px;">
            <div style="padding:12px; background:#fff; border:1px solid var(--line); border-radius:12px;"><h3 style="font-size:13px; margin:0 0 6px;">今日の小さな美容ミッション</h3><p style="font-size:13px; line-height:1.7; margin:0;">${beauty.mission}</p></div>
            <div style="padding:12px; background:#fff; border:1px solid var(--line); border-radius:12px;"><h3 style="font-size:13px; margin:0 0 6px;">シェア用一言</h3><p style="font-size:13px; line-height:1.7; margin:0;">${beauty.share}</p></div>
          </div>
        </div>` : "";
      const modal = `<div id="charModalOverlay" style="position:fixed; inset:0; z-index:100; background:rgba(0,0,0,0.42); display:flex; align-items:center; justify-content:center; padding:18px;">
        <div style="width:min(560px, 100%); max-height:88vh; overflow:auto; background:#fff; border-radius:20px; box-shadow:0 24px 60px rgba(0,0,0,0.22); padding:22px;">
          <button id="charModalClose" aria-label="閉じる" style="float:right; width:36px; height:36px; padding:0; border-radius:50%;">×</button>
          <div style="text-align:center; clear:both;">
            <img src="${c.image}" alt="${c.name}" style="width:min(260px, 100%); aspect-ratio:1/1; object-fit:cover; border-radius:16px; box-shadow:var(--shadow-sm); margin:0 auto 18px; display:block;">
            <h2 style="font-size:24px; margin:0 0 12px;">${c.name}</h2>
            <p style="font-size:14px; font-weight:700; line-height:1.8; margin:0 0 18px;">${c.catch}</p>
          </div>
          <div style="margin-bottom:16px;"><h3 style="font-size:14px; font-weight:700; color:var(--accent); margin:0 0 8px;">似合うムード</h3><p style="font-size:13px; line-height:1.8; margin:0;">${c.hook}</p></div>
          <div style="margin-bottom:16px; padding:12px; background:#fff5f5; border-radius:12px; border-left:3px solid #ff6b6b;"><h3 style="font-size:14px; font-weight:700; color:#ff6b6b; margin:0 0 8px;">しんどい時</h3><p style="font-size:13px; line-height:1.8; margin:0;">${c.downside}</p></div>
          <div style="margin-bottom:16px; padding:12px; background:#f0f9ff; border-radius:12px; border-left:3px solid #4dabf7;"><h3 style="font-size:14px; font-weight:700; color:#4dabf7; margin:0 0 8px;">周りからの見え方</h3><p style="font-size:13px; line-height:1.8; margin:0;">${c.perception}</p></div>
          <div style="display:grid; gap:10px;">
            <div style="padding:12px; background:#fafafa; border:1px solid var(--line); border-radius:12px;"><h3 style="font-size:13px; margin:0 0 6px;">強み</h3><p style="font-size:13px; line-height:1.7; margin:0;">${c.strength}</p></div>
            <div style="padding:12px; background:#fafafa; border:1px solid var(--line); border-radius:12px;"><h3 style="font-size:13px; margin:0 0 6px;">気をつけたいこと</h3><p style="font-size:13px; line-height:1.7; margin:0;">${c.weakness}</p></div>
            <div style="padding:12px; background:#fafafa; border:1px solid var(--line); border-radius:12px;"><h3 style="font-size:13px; margin:0 0 6px;">今日の美容ヒント</h3><p style="font-size:13px; line-height:1.7; margin:0;">${c.advice}</p></div>
          </div>
          ${beautyHtml}
        </div>
      </div>`;
      document.body.insertAdjacentHTML("beforeend", modal);
      const overlay = document.getElementById("charModalOverlay");
      document.getElementById("charModalClose").onclick = () => overlay.remove();
      overlay.onclick = e => { if(e.target === overlay) overlay.remove(); };
    }
    function showTypeGuideModal(){
      const modalHtml = `<div id="typeGuideOverlay" style="position:fixed; inset:0; z-index:100; background:rgba(0,0,0,0.42); display:flex; align-items:center; justify-content:center; padding:18px;">
        <div style="width:min(700px, 100%); max-height:88vh; overflow:auto; background:#fff; border-radius:20px; box-shadow:0 24px 60px rgba(0,0,0,0.22); padding:26px;">
          <button id="typeGuideClose" aria-label="閉じる" style="float:right; width:36px; height:36px; padding:0; border-radius:50%;">×</button>
          <div style="text-align:center; clear:both; margin-bottom:24px;">
            <p class="kicker">TYPE CODE GUIDE</p>
            <h2 class="big" style="font-size:22px; margin-bottom:8px;">タイプコード解説</h2>
            <p class="text-body" style="font-size:13px;">3文字のひらがなコードは、ビューティー診断の3つの軸の傾向を表しています。</p>
          </div>
          <div style="display:grid; gap:16px;">${renderTypeGuideContent()}</div>
        </div>
      </div>`;
      document.body.insertAdjacentHTML("beforeend", modalHtml);
      const overlay = document.getElementById("typeGuideOverlay");
      document.getElementById("typeGuideClose").onclick = () => overlay.remove();
      overlay.onclick = e => { if(e.target === overlay) overlay.remove(); };
    }
    function renderTypeGuideContent(){
      const axisData = [
        {key:"A", name:"癒しスタイル", left:"り", leftName:"リラックス", leftDesc:"静かでやわらかい癒し", right:"き", rightName:"きらめき", rightDesc:"明るく目を引く華やかさ"},
        {key:"B", name:"ビューティームード", left:"と", leftName:"透明感", leftDesc:"清潔感・淡さ・抜け感", right:"ぐ", rightName:"グロウ", rightDesc:"ツヤ・血色感・輝き"},
        {key:"C", name:"楽しみ方", left:"ま", leftName:"マイペース", leftDesc:"自分のリズムで整える", right:"し", rightName:"シェア", rightDesc:"誰かと共有して楽しむ"}
      ];
      return axisData.map(a => `<div style="background:#f7f7f9; border-radius:16px; padding:18px;">
        <h3 style="color:var(--accent); margin:0 0 12px; font-size:15px;">軸${a.key}: ${a.name}</h3>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
          <div style="background:#fff; padding:14px; border-radius:12px; border-left:4px solid #34b27b;">
            <div style="font-size:28px; font-weight:800; color:#34b27b; line-height:1;">${a.left}</div>
            <div style="font-size:13px; font-weight:800; margin:8px 0 4px;">${a.leftName}</div>
            <div style="font-size:11px; color:var(--text-sub);">${a.leftDesc}</div>
          </div>
          <div style="background:#fff; padding:14px; border-radius:12px; border-left:4px solid #9b6bd3;">
            <div style="font-size:28px; font-weight:800; color:#9b6bd3; line-height:1;">${a.right}</div>
            <div style="font-size:13px; font-weight:800; margin:8px 0 4px;">${a.rightName}</div>
            <div style="font-size:11px; color:var(--text-sub);">${a.rightDesc}</div>
          </div>
        </div>
      </div>`).join("") + `<div style="background:#fff; padding:16px; border-radius:12px; border:1px solid var(--line);">
        <div style="font-size:13px; font-weight:800; color:var(--accent); margin-bottom:8px;">コードの読み方</div>
        <div style="font-size:12px; color:var(--text-sub); line-height:1.7;">例: <span style="font-family:monospace; background:#f7f7f9; padding:2px 8px; border-radius:6px; font-weight:700;">りとま</span><br>リラックス(り) + 透明感(と) + マイペース(ま) = リラックス透明感タイプ</div>
      </div>`;
    }
    const titleHome = document.getElementById("titleHome");
    const titleMenu = document.getElementById("titleMenu");
    titleHome.onclick = (e) => {
      e.preventDefault();
      e.stopPropagation();
      titleMenu.classList.toggle("is-open");
    };
    document.addEventListener("click", (e) => {
      if (!titleMenu.contains(e.target) && e.target !== titleHome) titleMenu.classList.remove("is-open");
    });
    document.getElementById("logoHome").onclick = () => { state.step = isComplete() ? "result" : "intro"; saveState(); render(); };
    document.getElementById("navDiagnosis").onclick = (e) => { e.preventDefault(); state.step = isComplete() ? "result" : "intro"; saveState(); render(); };
    document.getElementById("navTypeGuide").onclick = (e) => { e.preventDefault(); showTypeGuideModal(); };
    document.getElementById("navCharacters").onclick = (e) => { e.preventDefault(); state.step = "characters"; saveState(); render(); };
    document.getElementById("btnReset").onclick = resetDiagnosis;
    render();
  </script>
</body>
</html>
