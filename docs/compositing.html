<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ポスター作成 | Mobby</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">
  <link href="compositing/compositing.css?v=step3-layout" rel="stylesheet">
  <style>
    :root {
      --color-earth: #6c5240;
      --font-ja: 'Yomogi', cursive;
      --font-en: 'Yomogi', cursive;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-ja);
      color: var(--color-earth);
      background:
        radial-gradient(circle at 18% 10%, rgba(255, 226, 239, 0.72), transparent 30%),
        radial-gradient(circle at 82% 20%, rgba(255, 239, 210, 0.82), transparent 28%),
        linear-gradient(180deg, #fff8ef 0%, #f7eadc 100%);
    }

    .compositing-page {
      width: min(1120px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 20px 16px 34px;
    }

    .compositing-page__top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .compositing-page__back {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      border: 1px solid rgba(108, 82, 64, 0.16);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.68);
      color: var(--color-earth);
      font: inherit;
      font-size: 0.9rem;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 10px 22px rgba(89, 70, 52, 0.1);
    }

    .btn {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 999px;
      border: 1px solid rgba(108, 82, 64, 0.16);
      padding: 0 18px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(145deg, #ff8a12, #f45a00);
      color: #fff;
      border-color: rgba(185, 94, 19, 0.28);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.86);
      color: var(--color-earth);
    }

    @media (max-width: 760px) {
      .compositing-page {
        padding: 14px 12px 28px;
      }
    }
  </style>
  <link rel="stylesheet" href="assets/mobby-guide.css">
</head>
<body>
  <main class="compositing-page">
    <div class="compositing-page__top">
      <a class="compositing-page__back" href="index.html">← トップへ戻る</a>
    </div>

    <div class="compositing-shell">
      <div id="compositingLoadingOverlay" class="compositing-loading-overlay" hidden>
        <div class="compositing-loading-spinner" aria-hidden="true"></div>
        <p class="compositing-loading-text">画像を処理しています...</p>
      </div>
      <div id="compositingSplash" class="compositing-splash" hidden role="dialog" aria-modal="true" aria-label="ポスター作成のはじめ方">
        <div class="compositing-splash__backdrop" aria-hidden="true"></div>
        <div class="compositing-splash__card">
          <span class="compositing-splash__spark compositing-splash__spark--left" aria-hidden="true">✦</span>
          <span class="compositing-splash__spark compositing-splash__spark--left-small" aria-hidden="true">✦</span>
          <span class="compositing-splash__spark compositing-splash__spark--right" aria-hidden="true">♥</span>
          <span class="compositing-splash__spark compositing-splash__spark--right-small" aria-hidden="true">✦</span>
          <span class="compositing-splash__accent compositing-splash__accent--left" aria-hidden="true"></span>
          <span class="compositing-splash__accent compositing-splash__accent--right" aria-hidden="true"></span>
          <span class="compositing-splash__heartline" aria-hidden="true"></span>
          <div id="compositingSplashContent" class="compositing-splash__content"></div>
          <div class="compositing-splash__count" id="compositingSplashCount">1 / 4</div>
          <div class="compositing-splash__dots" id="compositingSplashDots" aria-hidden="true"></div>
          <button id="compositingSplashNext" class="compositing-splash__next" type="button">次へ</button>
          <button id="compositingSplashSkip" class="compositing-splash__skip" type="button">スキップ</button>
        </div>
      </div>
      <div class="compositing-head">
        <h2>ポスター作成</h2>
        <p id="compositingLead">背景を抜くかそのまま使うかを選んで、テンプレに配置できます。外部サイトで背景透過した画像を使用するときれいな画像が完成します。</p>
      </div>
      <div class="compositing-layout">
        <div class="compositing-stage-card">
          <div class="compositing-stage-wrap">
            <canvas id="compositingCanvas" class="compositing-canvas" width="1080" height="1080" aria-label="ポスター作成プレビュー"></canvas>
          </div>
        </div>
        <div class="compositing-controls-card">
          <div class="compositing-section is-open" data-compositing-section="template">
            <button type="button" class="compositing-toggle" data-compositing-toggle="template" aria-expanded="true">
              <span>テンプレート</span>
            </button>
            <div class="compositing-section-body" data-compositing-body="template">
              <div id="compositingTemplateGrid" class="compositing-template-grid"></div>
              <button id="compositingTemplateConfirmButton" class="btn btn-primary compositing-confirm-btn" type="button">このテンプレートで決定する</button>
            </div>
          </div>
          <div class="compositing-section" data-compositing-section="upload" hidden>
            <div class="compositing-section-body" data-compositing-body="upload" hidden>
              <button id="compositingBackButton" class="compositing-back-btn" type="button" aria-label="テンプレート選択に戻る">← テンプレートに戻る</button>
              <div id="compositingUploadBlock" class="compositing-upload">
                <input id="compositingFileInput" type="file" accept="image/*">
                <div class="compositing-upload-actions">
                  <button id="compositingUploadButton" class="btn btn-primary compositing-upload-btn" type="button">背景を抜いて使う</button>
                  <button id="compositingUploadOriginalButton" class="btn btn-secondary compositing-upload-btn compositing-upload-btn-secondary" type="button">画像をそのまま使う</button>
                </div>
              </div>
            </div>
          </div>
          <div id="compositingScaleBlock" hidden>
            <p class="compositing-label">人物サイズ</p>
            <input id="compositingScale" class="compositing-range" type="range" min="20" max="80" value="30">
          </div>
          <div id="compositingRotationBlock" hidden>
            <p class="compositing-label">角度調整</p>
            <input id="compositingRotation" class="compositing-range" type="range" min="-180" max="180" value="0">
          </div>
          <div class="compositing-section" data-compositing-section="subtitle" hidden>
            <div class="compositing-section-body" data-compositing-body="subtitle" hidden>
              <div class="compositing-copy">
                <input id="compositingSubtitle" class="compositing-text-input" type="text" maxlength="28" placeholder="サブタイトルを入力">
              </div>
            </div>
          </div>
          <div id="compositingActions" class="compositing-actions" hidden>
            <button id="compositingDownloadButton" class="btn btn-secondary compositing-download-btn" type="button">画像を保存</button>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="compositing/compositing.js?v=step3-layout" defer></script>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const start = () => {
        window.initCompositingTool?.();
        window.showCompositingSplash?.();
      };
      if (window.initCompositingTool) {
        start();
      } else {
        window.addEventListener("compositing:ready", start, { once: true });
      }
    });
  </script>
  <script src="assets/mobby-guide.js"></script>
</body>
</html>
