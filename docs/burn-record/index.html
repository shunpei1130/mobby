  <style>
    .burn-guide-overlay {
      position: fixed;
      inset: 0;
      z-index: 5000;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(25, 22, 20, 0.55);
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px);
    }

    .burn-guide-overlay[hidden] {
      display: none;
    }

    .burn-guide-card {
      width: min(100%, 440px);
      max-height: min(86vh, 720px);
      display: grid;
      gap: 18px;
      padding: 32px 24px 26px;
      overflow: auto;
      border: 1px solid rgba(255, 214, 232, 0.62);
      border-radius: 26px;
      background:
        linear-gradient(145deg, rgba(255, 248, 252, 0.58), rgba(255, 229, 241, 0.36)) !important;
      -webkit-backdrop-filter: blur(18px) saturate(1.18);
      backdrop-filter: blur(18px) saturate(1.18);

        inset 0 1px rgba(255, 255, 255, 0.7),

    }

    .burn-guide-step {

    .burn-guide-title {

    .burn-guide-heart {

    }

    .burn-guide-copy {

    }

    .record-edit-card [data-record-update-memory] {

      background: rgba(255, 244, 250, 0.72);
      color: #7b5063;
    }

    .burn-guide-upload strong {
      display: grid;
      place-items: center;

      height: 58px;

      border-radius: 999px;
      color: #b95f88;
      font-size: 2rem;
      font-weight: 400;
      line-height: 1;
    }

    .burn-guide-photo {
      width: 100%;
      aspect-ratio: 1.45 / 1;
      border-radius: 7px;
      background:

    .burn-guide-template img {

    .burn-guide-bg img {

    .burn-guide-page::after {
      right: 11%;

      width: 38%;
      height: 22%;
    }

    .burn-guide-page span {
      position: absolute;
      left: 13%;
      bottom: 15%;
      width: 36%;

      border-radius: 3px;

    .burn-guide-final-image {
      position: relative;

    .burn-guide-page-image {

      box-shadow: 0 12px 28px rgba(77, 48, 39, 0.14);
      background: #fff;

    .burn-guide-final-image::before,
    .burn-guide-final-image::after,
    .burn-guide-final-photo {

    .burn-guide-final-image::before {

      top: 18%;
      width: 38%;
      height: 22%;
    }

    .burn-guide-final-image::after {

      top: 43%;
      width: 38%;
      height: 22%;
    }

    .burn-guide-final-photo {

      bottom: 12%;

    .burn-guide-final-title {

    .burn-guide-final-note {

    .burn-guide-rule {

    .burn-guide-rule::before,
    .burn-guide-rule::after {
      content: "";

    .burn-guide-actions {
      display: grid;
      grid-template-columns: 1fr 1.2fr;

    .burn-guide-skip,

    .burn-guide-next {

    .burn-guide-dots {
      display: flex;

    .burn-guide-dots span {

    }

    .record-header__back svg,

<body>
  <main id="recordRoot"></main>
  <div class="burn-guide-overlay" id="burnGuideOverlay" role="dialog" aria-modal="true" aria-labelledby="burnGuideTitle">
    <section class="burn-guide-card">
      <p class="burn-guide-step" id="burnGuideStep">STEP 1 / 5</p>
      <h2 class="burn-guide-title" id="burnGuideTitle">写真を追加しよう</h2>
      <div class="burn-guide-heart" aria-hidden="true">♡</div>
      <p class="burn-guide-copy" id="burnGuideCopy">まずは思い出の写真をアップロードします。大きな追加枠をタップして、1〜3枚の写真を選びましょう。</p>
      <div class="burn-guide-visual" id="burnGuideVisual" aria-hidden="true"></div>
      <div class="burn-guide-rule" aria-hidden="true">♡</div>
      <div class="burn-guide-actions">
        <button class="burn-guide-skip" type="button" id="burnGuideSkip">スキップ</button>
        <button class="burn-guide-next" type="button" id="burnGuideNext">次へ</button>
      </div>
      <div class="burn-guide-dots" id="burnGuideDots" aria-hidden="true"></div>
    </section>
  </div>
  <script>
    (() => {
      const overlay = document.getElementById("burnGuideOverlay");
      if (!overlay) return;

      const steps = [
        {
          title: "写真を追加しよう",
          copy: "まずは思い出の写真をアップロードします。大きな追加枠をタップして、1〜3枚の写真を選びましょう。",
          visual: '<div class="burn-guide-upload"><strong>＋</strong><span>写真を追加</span></div>'
        },
        {
          title: "場所と感想を入れよう",
          copy: "写真を追加したら、場所と感想を入力します。ページに載せたい一言もここで記録できます。",
          visual: '<div class="burn-guide-memory-card"><img class="burn-guide-real-photo" src="../reference/splash_photo1.jpg" alt=""><div class="burn-guide-form"><div class="burn-guide-field">◎　代官山</div><div class="burn-guide-field">☵　カフェの雰囲気が素敵だった</div></div></div>'
        },
        {
          title: "タイトルと配置を選ぼう",
          copy: "写真がそろったら、順番やテンプレートを選びます。ページタイトルもここで決めましょう。",
          visual: '<div class="burn-guide-template-panel"><div class="burn-guide-mini-photos"><div class="burn-guide-mini-photo"><img class="burn-guide-real-photo" src="../reference/splash_photo1.jpg" alt=""><span>配置順</span><div class="burn-guide-order">↑ 1 ↓</div></div><div class="burn-guide-mini-photo"><img class="burn-guide-real-photo" src="../reference/splash_photo2.jpg" alt=""><span>配置順</span><div class="burn-guide-order">↑ 2 ↓</div></div><div class="burn-guide-mini-photo"><img class="burn-guide-real-photo" src="../reference/splash_photo3.jpg" alt=""><span>配置順</span><div class="burn-guide-order">↑ 3 ↓</div></div></div><p>Template</p><div class="burn-guide-template-row"><div class="burn-guide-template is-selected"><img src="./assets/template001-C4MCDSgU.webp" alt="">Template 001</div><div class="burn-guide-template"><img src="./assets/template002-BCt9LpnA.webp" alt="">Template 002</div></div><p>Page title</p><input value="菜月とこうきは伝説かも!?" readonly /></div>'
        },
        {
          title: "背景を選ぼう",
          copy: "プレビューを見ながら、ページに合う背景を選べます。雰囲気に合う一枚で、思い出をもっとかわいく。",
          visual: '<img class="burn-guide-page-image" src="../reference/splash_page.png" alt=""><div style="height:14px"></div><div class="burn-guide-background-row"><div class="burn-guide-bg"><img src="./assets/back_bubble_1-DnJI0jZu.webp" alt=""></div><div class="burn-guide-bg is-selected"><img src="./assets/back_newwave_2-DPK3clIJ.webp" alt=""></div><div class="burn-guide-bg"><img src="./assets/back_sui_3-CRL-AiTA.webp" alt=""></div></div>'
        },
        {
          title: "完成・保存しよう",
          copy: "最後に1ページになった思い出を保存して完成です。できあがったページは、そのまま見返せます。",
          visual: '<img class="burn-guide-page-image" src="../reference/splash_page.png" alt=""><div class="burn-guide-field" style="justify-content:center;margin-top:14px">↓　写真を保存</div>'
        }
      ];

      let index = 0;
      const stepEl = document.getElementById("burnGuideStep");
      const titleEl = document.getElementById("burnGuideTitle");
      const copyEl = document.getElementById("burnGuideCopy");
      const visualEl = document.getElementById("burnGuideVisual");
      const dotsEl = document.getElementById("burnGuideDots");
      const nextButton = document.getElementById("burnGuideNext");
      const skipButton = document.getElementById("burnGuideSkip");

      const close = () => {
        overlay.hidden = true;
      };

      const guideTitles = [
        "写真をアップする",
        "場所と感想を入力",
        "タイトルと配置を選ぶ",
        "好みの背景を選んで",
        "完成！保存！"
      ];

      const render = () => {
        const step = steps[index];
        stepEl.textContent = `STEP ${index + 1} / ${steps.length}`;
        titleEl.textContent = guideTitles[index] || step.title;
        copyEl.textContent = guideTitles[index] || step.copy;
        visualEl.innerHTML = step.visual;
        if (index === 2) {
          visualEl.querySelector(".burn-guide-mini-photos")?.remove();
        }
        nextButton.textContent = index === steps.length - 1 ? "はじめる" : "次へ";
        skipButton.textContent = index === steps.length - 1 ? "戻る" : "スキップ";
        dotsEl.innerHTML = steps.map((_, dotIndex) => `<span class="${dotIndex === index ? "is-active" : ""}"></span>`).join("");
      };

      nextButton.addEventListener("click", () => {
        if (index >= steps.length - 1) {
          close();
          return;
        }
        index += 1;
        render();
      });

      skipButton.addEventListener("click", () => {
        if (index === steps.length - 1) {
          index -= 1;
          render();
          return;
        }
        close();
      });

      render();
    })();

    (() => {
      const root = document.getElementById("recordRoot");
      if (!root) return;

      const addHomeReturn = () => {
        const actions = root.querySelector(".record-page--complete .record-complete-actions");
        if (!actions || actions.querySelector("[data-record-home-return]")) return;

        const saveButton = actions.querySelector("[data-record-save-page]");
        if (!saveButton) return;

        const homeButton = document.createElement("button");
        homeButton.type = "button";
        homeButton.dataset.recordHomeReturn = "true";
        homeButton.innerHTML = "<span>Homeに戻る</span>";
        saveButton.insertAdjacentElement("afterend", homeButton);
      };

      root.addEventListener("click", (event) => {
        if (!event.target.closest("[data-record-home-return]")) return;
        window.location.href = "../index.html";
      });

      new MutationObserver(addHomeReturn).observe(root, {
        childList: true,
        subtree: true
      });
      addHomeReturn();
    })();
  </script>
</body>
</html>
