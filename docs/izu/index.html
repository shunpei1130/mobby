        { id: "q01", text: "朝のうちに体を動かすと、その日全体の調子が整う。", agree: [["morning", 2], ["rhythm", 1]], disagree: [["balance", 1], ["mental", 1]] },
        { id: "q02", text: "食事はカロリーだけでなく、タンパク質量も自然と気になる。", agree: [["protein", 2], ["meal", 1]], disagree: [["balance", 1], ["rhythm", 1]] },
        { id: "q03", text: "新しい種目をやる前に、フォームや効かせ方を確認したい。", agree: [["form", 2], ["protein", 1]], disagree: [["switch", 1], ["morning", 1]] },
        { id: "q04", text: "疲れている日は強度を落としてでも、できる形で続けたい。", agree: [["balance", 2], ["rhythm", 1]], disagree: [["switch", 1], ["mental", 1]] },
        { id: "q05", text: "短時間でも毎日続けられるメニューの方が安心する。", agree: [["rhythm", 2], ["morning", 1]], disagree: [["switch", 1], ["form", 1]] },
        { id: "q06", text: "追い込む日は、限界近くまで集中してやり切りたい。", agree: [["switch", 2], ["form", 1]], disagree: [["balance", 1], ["meal", 1]] },
        { id: "q07", text: "作り置きや外食の選び方を考える時間がわりと好き。", agree: [["meal", 2], ["protein", 1]], disagree: [["mental", 1], ["morning", 1]] },
        { id: "q08", text: "数字の変化だけでなく、睡眠・むくみ・気分の変化も見る。", agree: [["balance", 2], ["meal", 1]], disagree: [["switch", 1], ["form", 1]] },
        { id: "q09", text: "気分が落ちた時こそ、軽く動くと切り替わることがある。", agree: [["mental", 2], ["rhythm", 1]], disagree: [["balance", 1], ["protein", 1]] },
        { id: "q10", text: "重量や回数の記録を見返すと、次も頑張りやすい。", agree: [["form", 2], ["switch", 1]], disagree: [["meal", 1], ["balance", 1]] },
        { id: "q11", text: "外食でも選び方を工夫すれば、十分整えられると思う。", agree: [["meal", 2], ["balance", 1]], disagree: [["protein", 1], ["rhythm", 1]] },
        { id: "q12", text: "新しいメニューを増やすより、定番メニューを磨く方が続く。", agree: [["rhythm", 2], ["form", 1]], disagree: [["switch", 1], ["morning", 1]] },
        { id: "q13", text: "体づくりは、自分との約束を守れた感覚が大事だと思う。", agree: [["mental", 2], ["rhythm", 1]], disagree: [["meal", 1], ["balance", 1]] },
        { id: "q14", text: "イベント前や撮影前など、目的があるとスイッチが入りやすい。", agree: [["switch", 2], ["morning", 1]], disagree: [["rhythm", 1], ["balance", 1]] },
        { id: "q15", text: "栄養バランスの理由まで分かると、納得して続けられる。", agree: [["protein", 2], ["meal", 1]], disagree: [["mental", 1], ["switch", 1]] },
        { id: "q16", text: "休む日を計画に入れると、逆に継続しやすい。", agree: [["balance", 2], ["rhythm", 1]], disagree: [["switch", 1], ["morning", 1]] },
        { id: "q17", text: "トレーニング動画は、テンションより説明の分かりやすさを見たい。", agree: [["form", 2], ["protein", 1]], disagree: [["mental", 1], ["switch", 1]] },
        { id: "q18", text: "何を食べたかだけでなく、なぜそれを選んだかも言語化したい。", agree: [["meal", 2], ["mental", 1]], disagree: [["morning", 1], ["balance", 1]] },
        { id: "q19", text: "まず着替えて5分だけ動くと、自然に始められることが多い。", agree: [["morning", 2], ["mental", 1]], disagree: [["protein", 1], ["form", 1]] },
        { id: "q20", text: "結果がすぐ出なくても、積み上げている感覚があれば続けられる。", agree: [["rhythm", 2], ["mental", 1]], disagree: [["switch", 1], ["meal", 1]] }
      ]
    };

    const SCALE = [
      { value: 1, label: "全然違う" },
      { value: 2, label: "違う" },
      { value: 3, label: "少し違う" },
      { value: 4, label: "どちらでも" },
      { value: 5, label: "少しそう" },
      { value: 6, label: "そう" },
      { value: 7, label: "かなりそう" }
    ];
    const TIE_ORDER = ["rhythm", "morning", "meal", "protein", "form", "mental", "switch", "balance"];

    const app = document.getElementById("app");
    const toastNode = document.getElementById("toast");
    let state = loadState();

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function initialState() {
      return { step: "intro", index: 0, answers: {}, resultId: "", scores: {}, saved: false };
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        return { ...initialState(), ...saved, answers: saved.answers || {}, scores: saved.scores || {} };
      } catch {
        return initialState();
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function typeById(id) {
      return DIAG.types.find((type) => type.id === id) || DIAG.types.find((type) => type.id === "rhythm");
    }

    function answeredCount() {
      return DIAG.questions.filter((question) => Number.isFinite(state.answers[question.id])).length;
    }

    function isComplete() {
      return answeredCount() === DIAG.questions.length;
    }

    function addScores(scores, entries, strength) {
      entries.forEach(([id, weight]) => {
        scores[id] = (scores[id] || 0) + strength * weight;
      });
    }

    function computeResult() {
      const scores = Object.fromEntries(DIAG.types.map((type) => [type.id, 0]));
      DIAG.questions.forEach((question) => {
        const value = Number(state.answers[question.id]);
        if (!Number.isFinite(value)) return;
        if (value > 4) addScores(scores, question.agree, value - 4);
        else if (value < 4) addScores(scores, question.disagree, 4 - value);
        else scores.rhythm += 0.15;
      });
      const winnerId = [...DIAG.types]
        .sort((a, b) => {
          const diff = (scores[b.id] || 0) - (scores[a.id] || 0);
          if (diff !== 0) return diff;
          return TIE_ORDER.indexOf(a.id) - TIE_ORDER.indexOf(b.id);
        })[0].id;
      return { id: winnerId, scores };
    }

    function completeDiagnosis() {
      const result = computeResult();
      state.resultId = result.id;
      state.scores = result.scores;
      state.step = "result";
      state.saved = false;
      saveState();
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function toast(message) {
      toastNode.textContent = message;
      toastNode.classList.add("show");
      window.clearTimeout(toastNode._timer);
      toastNode._timer = window.setTimeout(() => toastNode.classList.remove("show"), 2200);
    }

    function setNav() {
      document.getElementById("navDiagnosis").classList.toggle("active", state.step !== "types");
      document.getElementById("navTypes").classList.toggle("active", state.step === "types");
    }

    function goDiagnosis() {
      state.step = isComplete() ? "result" : (answeredCount() > 0 ? "question" : "intro");
      saveState();
      render();
    }

    function renderIntro() {
      app.innerHTML = `
        <section class="panel hero-grid">
          <div class="stack">
            <div>
              <p class="kicker">Body-make diagnosis</p>
              <h2 class="big">${escapeHtml(DIAG.title)}</h2>
              <p class="text">${escapeHtml(DIAG.subtitle)}</p>
            </div>
            <div class="tags" aria-label="診断キーワード">
              <span class="tag">筋トレ習慣</span>
              <span class="tag">食事管理</span>
              <span class="tag">継続タイプ</span>
              <span class="tag">SSA準優勝</span>
              <span class="tag">SNS100万人</span>
            </div>
            <div class="note">
              <img src="../img/Mobby.webp" alt="Mobby" loading="lazy" />
              <p class="text">MobbyがIzu💪🏼イズさんの筋トレ・食事管理の世界に入って、ファンが自分の続け方をシェアできる診断ラフです。</p>
            </div>
            <div class="actions">
              <button class="btn btn-primary" type="button" id="btnStart">診断をはじめる</button>
              <button class="btn btn-secondary" type="button" id="btnTypesIntro">全8タイプを見る</button>
            </div>
          </div>
          <div class="hero-visual">
            <img class="hero-img" src="${DIAG.hero}" alt="Izu💪🏼イズ式ボディメイク診断のMobbyヒーロー画像" />
          </div>
        </section>
      `;
      document.getElementById("btnStart").addEventListener("click", () => {
        state.step = "question";
        state.index = Math.min(state.index || 0, DIAG.questions.length - 1);
        saveState();
        render();
      });
      document.getElementById("btnTypesIntro").addEventListener("click", () => {
        state.step = "types";
        saveState();
        render();
      });
    }

    function renderQuestion() {
      const index = Math.max(0, Math.min(state.index || 0, DIAG.questions.length - 1));
      const question = DIAG.questions[index];
      const selected = Number(state.answers[question.id]);
      const percent = Math.round((answeredCount() / DIAG.questions.length) * 100);
      const buttons = SCALE.map((item) => `
        <button class="option ${selected === item.value ? "selected" : ""}" type="button" data-value="${item.value}" aria-label="${escapeHtml(item.label)}">
          <span class="scale-no">${item.value}</span>
        </button>
      `).join("");
      app.innerHTML = `
        <section class="panel">
          <div class="progress-meta">
            <span>Q${index + 1} / ${DIAG.questions.length}</span>
            <span>${answeredCount()}問回答済み</span>
          </div>
          <div class="track" aria-hidden="true"><div class="fill" style="width:${percent}%"></div></div>
          <article class="qcard">
            <p class="qindex">Izu body-make question</p>
            <h2 class="qtext">${escapeHtml(question.text)}</h2>
            <div class="scale-wrap">
              <div class="scale-labels">
                <span>全然違う</span>
                <span>どちらでも</span>
                <span>かなりそう</span>
              </div>
              <div class="options">${buttons}</div>
              <div class="selected-scale">${Number.isFinite(selected) ? escapeHtml(SCALE.find((item) => item.value === selected).label) : "直感で近い丸を選んでください"}</div>
            </div>
          </article>
          <div class="footer-row">
            <button class="btn btn-ghost" type="button" id="btnBack">${index === 0 ? "トップへ" : "前の質問"}</button>
            <button class="btn btn-primary" type="button" id="btnNext" ${Number.isFinite(selected) ? "" : "disabled"}>${index === DIAG.questions.length - 1 ? "結果を見る" : "次へ"}</button>
          </div>
        </section>
      `;
      app.querySelectorAll("[data-value]").forEach((button) => {
        button.addEventListener("click", () => {
          state.answers[question.id] = Number(button.dataset.value);
          saveState();
          if (index < DIAG.questions.length - 1) {
            window.setTimeout(() => {
              state.index = index + 1;
              saveState();
              render();
            }, 120);
          } else {
            window.setTimeout(completeDiagnosis, 120);
          }
          render();
        });
      });
      document.getElementById("btnBack").addEventListener("click", () => {
        if (index === 0) state.step = "intro";
        else state.index = index - 1;
        saveState();
        render();
      });
      document.getElementById("btnNext").addEventListener("click", () => {
        if (!Number.isFinite(Number(state.answers[question.id]))) return;
        if (index === DIAG.questions.length - 1) completeDiagnosis();
        else {
          state.index = index + 1;
          saveState();
          render();
        }
      });
    }

    function shareText(type) {
      return `Izu💪🏼イズ式ボディメイクタイプ診断の結果は「${type.name}」でした。${type.catch}`;
    }

    async function copyShare(type) {
      const text = `${shareText(type)}\n${PAGE_URL}`;
      try {
        await navigator.clipboard.writeText(text);
        toast("シェア文をコピーしました");
      } catch {
        toast("コピーできませんでした");
      }
    }

    async function nativeShare(type) {
      const payload = { title: DIAG.title, text: shareText(type), url: PAGE_URL };
      if (!navigator.share) {
        await copyShare(type);
        return;
      }
      try {
        await navigator.share(payload);
      } catch {
      }
    }

    function scoreBars(scores) {
      const max = Math.max(1, ...Object.values(scores).map(Number));
      return [...DIAG.types]
        .sort((a, b) => (scores[b.id] || 0) - (scores[a.id] || 0))
        .slice(0, 4)
        .map((type) => {
          const score = scores[type.id] || 0;
          const width = Math.max(8, Math.round((score / max) * 100));
          return `
            <div class="bar-row">
              <div class="bar-meta"><span>${escapeHtml(type.name)}</span><span>${Math.round(score)} pt</span></div>
              <div class="bar"><span style="width:${width}%"></span></div>
            </div>
          `;
        }).join("");
    }

    function linePayload(type) {
      return {
        source: "izu",
        diagnosisName: DIAG.title,
        resultCode: type.code,
        resultName: type.name,
        resultSummary: type.lead,
        pageUrl: PAGE_URL
      };
    }

    function renderResult() {
      if (!state.resultId) {
        const result = computeResult();
        state.resultId = result.id;
        state.scores = result.scores;
        saveState();
      }
      const type = typeById(state.resultId);
      const share = encodeURIComponent(shareText(type));
      const url = encodeURIComponent(PAGE_URL);
      const lineData = encodeURIComponent(JSON.stringify(linePayload(type)));
      app.innerHTML = `
        <section class="panel stack">
          <div class="result-head">
            <div class="type-no">${escapeHtml(type.no)}</div>
            <div class="result-title">
              <p class="kicker">Your body-make type</p>
              <h2>${escapeHtml(type.name)}</h2>
              <p>${escapeHtml(type.catch)}</p>
            </div>
          </div>
          <div class="result-grid">
            <div class="stack">
              <div class="result-copy">
                <h3>診断コメント</h3>
                <p class="text">${escapeHtml(type.lead)}</p>
              </div>
              <div class="result-copy">
                <h3>Izu💪🏼イズさんの投稿導線案</h3>
                <ul>
                  <li>${escapeHtml(type.izu)}</li>
                  <li>結果画面からTikTok、Instagram、おすすめ投稿、食事管理コンテンツへ自然に送客できます。</li>
                  <li>「今日のミッション」を入れることで、保存と実践報告を作りやすくします。</li>
                </ul>
              </div>
              <div class="result-copy">
                <h3>結果に入れる一言</h3>
                <ul>
                  <li>${escapeHtml(type.hook)}</li>
                  <li>${escapeHtml(type.mission)}</li>
                </ul>
              </div>
            </div>
            <aside class="stack">
              <img class="result-img" src="${DIAG.resultImage}" alt="Izu💪🏼イズ式ボディメイク診断の結果サンプル画像" />
              <div class="mini">
                <h3>スコア上位</h3>
                <div class="score-list">${scoreBars(state.scores || {})}</div>
              </div>
            </aside>
          </div>
          <div class="share">
            <a href="https://twitter.com/intent/tweet?text=${share}&url=${url}" target="_blank" rel="noopener">Xでシェア</a>
            <button type="button" id="btnNativeShare">スマホで共有</button>
            <button type="button" id="btnCopyShare">コピー</button>
          </div>
          <div id="line-ai-mobby-cta" data-line-ai-mobby-cta data-diagnosis="${lineData}"></div>
          <div class="lead-form">
            <h3>確認用メモを残す</h3>
            <p class="helper">ラフ案の確認用に、任意で名前・メール・年齢を保存できます。</p>
            <form id="leadForm">
              <div class="field-row">
                <input name="name" autocomplete="name" placeholder="名前" />
                <input name="email" autocomplete="email" type="email" placeholder="メール" />
                <input name="age" inputmode="numeric" placeholder="年齢" />
              </div>
              <button class="btn btn-hot" type="submit">結果を保存する</button>
              <p class="helper" id="saveStatus">${state.saved ? "保存済みです。" : ""}</p>
            </form>
          </div>
          <div class="actions">
            <button class="btn btn-primary" type="button" id="btnTypesResult">全8タイプを見る</button>
            <button class="btn btn-secondary" type="button" id="btnRestart">もう一度診断する</button>
          </div>
        </section>
      `;
      document.getElementById("btnNativeShare").addEventListener("click", () => nativeShare(type));
      document.getElementById("btnCopyShare").addEventListener("click", () => copyShare(type));
      document.getElementById("btnTypesResult").addEventListener("click", () => {
        state.step = "types";
        saveState();
        render();
      });
      document.getElementById("btnRestart").addEventListener("click", () => {
        state = initialState();
        localStorage.removeItem(STORAGE_KEY);
        render();
      });
      document.getElementById("leadForm").addEventListener("submit", saveLead);
    }

    async function saveLead(event) {
      event.preventDefault();
      const form = event.currentTarget;
      const status = document.getElementById("saveStatus");
      const type = typeById(state.resultId);
      const payload = {
        source: "izu",
        diagTitle: DIAG.title,
        diagnosis_type: type.name,
        type: type.code,
        name: form.elements.name.value.trim(),
        email: form.elements.email.value.trim(),
        age: form.elements.age.value.trim(),
        axes: state.scores || {},
        answers: state.answers || {},
        pageUrl: window.location.href,
        userAgent: navigator.userAgent,
        createdAt: new Date().toISOString()
      };
      status.textContent = "保存中...";
      try {
        const response = await fetch("/api/diagnosis", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        if (!response.ok) throw new Error("save failed");
        state.saved = true;
        saveState();
        status.textContent = "保存しました。";
      } catch {
        status.textContent = "今だけ保存できませんでした。診断結果はこの画面で確認できます。";
      }
    }

    function renderTypes() {
      const cards = DIAG.types.map((type) => `
        <details class="type-card" ${type.id === "rhythm" ? "open" : ""}>
          <summary>
            <div class="type-head">
              <div>
                <span class="type-chip">${escapeHtml(type.code)}</span>
                <h3>${escapeHtml(type.name)}</h3>
              </div>
              <span class="type-no" aria-hidden="true">${escapeHtml(type.no)}</span>
            </div>
            <p>${escapeHtml(type.catch)}</p>
          </summary>
          <p>${escapeHtml(type.lead)}</p>
          <div class="actions">
            <button class="btn btn-secondary" type="button" data-type="${escapeHtml(type.id)}">このタイプを見る</button>
          </div>
        </details>
      `).join("");
      app.innerHTML = `
        <section class="panel stack">
          <div>
            <p class="kicker">8 body-make types</p>
            <h2 class="big">全8タイプ</h2>
            <p class="text">筋トレ、食事管理、継続、休息、メンタル切替のどこに強みが出るかを、Izu💪🏼イズさんの投稿導線に接続しやすい形で整理しています。</p>
          </div>
          <img class="hero-img" src="${DIAG.hero}" alt="Mobbyが登場するIzu💪🏼イズ式ボディメイク診断のサンプル画像" />
          <div class="types">${cards}</div>
          <div class="actions">
            <button class="btn btn-primary" type="button" id="btnBackDiagnosis">${isComplete() ? "結果に戻る" : "診断する"}</button>
          </div>
        </section>
      `;
      app.querySelectorAll("[data-type]").forEach((button) => {
        button.addEventListener("click", () => {
          state.resultId = button.dataset.type;
          if (!Object.keys(state.scores || {}).length) state.scores = Object.fromEntries(DIAG.types.map((type) => [type.id, type.id === state.resultId ? 10 : 2]));
          state.step = "result";
          saveState();
          render();
        });
      });
      document.getElementById("btnBackDiagnosis").addEventListener("click", goDiagnosis);
    }

    function render() {
      setNav();
      if (state.step === "types") renderTypes();
      else if (state.step === "question") renderQuestion();
      else if (state.step === "result") renderResult();
      else renderIntro();
    }

    document.getElementById("navDiagnosis").addEventListener("click", (event) => {
      event.preventDefault();
      goDiagnosis();
    });
    document.getElementById("navTypes").addEventListener("click", (event) => {
      event.preventDefault();
      state.step = "types";
      saveState();
      render();
    });
    document.getElementById("brandHome").addEventListener("click", () => { window.location.href = "../index.html"; });
    document.getElementById("brandHome").addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") window.location.href = "../index.html";
    });

    render();
  </script>
</body>
</html>
