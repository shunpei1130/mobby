        action: "お気に入りの世界観を、写真ではなく一文の感想で誰かに届けてみて。"
      },
      "mellow-fantasy-solo": {
        no: "05",
        name: "空想の魔女",
        catch: "深く考えた分だけ、世界を自分の色に染められる人。",
        image: "img/p06-black-witch.webp",
        raw: "img/p06-black-witch-raw.webp",
        palette: "ナイトパープル、古書ブラウン、パンジーイエロー",
        charm: "すぐに答えを出さず、好きなものの奥行きをゆっくり味わえるところが魅力です。",

        item: "深色アイライナー、アンティーク風ノート、紫の花",
        action: "好きな世界観について、言葉にできる部分と言葉にしない部分を分けてメモしてみて。"
      },
      "mellow-fantasy-share": {
        no: "06",
        name: "穏やかな妖精",
        catch: "言いすぎないやさしさで、相手の想像をふくらませる人。",
        image: "img/p35-purple-perfume.webp",
        raw: "img/p35-purple-perfume-raw.webp",
        palette: "ラベンダー、夜明けブルー、ミストグリーン",
        charm: "強く主張しなくても印象に残り、余白のある言葉で世界観を伝えられます。",
        letter: "あなたが残す香りは、説明よりも先に心に届きます。静かな一言が、長く残る魔法です。",
        item: "淡い香水、透け感トップス、ラベンダーのネイル",
        action: "今日の気分を、色か香りにたとえて一言だけ残してみて。"
      },
      "mellow-ritual-solo": {
        no: "07",
        name: "月の女王",
        catch: "自分の美意識を、時間をかけて仕立てられる人。",
        image: "img/p73-night-tailor.webp",
        raw: "img/p73-night-tailor-raw.webp",
        palette: "ミッドナイトブルー、シルバー、インクブラック",
        charm: "流行よりも納得感を大事にし、似合うものを自分の中で磨き込めます。",
        letter: "夜更けのアトリエで布を選ぶように、あなたは心地よい形を自分で決めていけます。",
        item: "ネイビーのジャケット、シルバーアクセ、整った眉",
        action: "今の自分に似合うものと、これから似合いそうなものを一つずつ選んでみて。"
      },
      "mellow-ritual-share": {
        no: "08",
        name: "元気いっぱいな妖精",
        catch: "安心するかわいさを、そっと誰かに渡せる人。",
        image: "img/p27-green-flower.webp",
        raw: "img/p27-green-flower-raw.webp",
        palette: "リーフグリーン、花びらイエロー、クリームホワイト",
        charm: "やわらかい空気で周りを包み、無理なく人を癒す雰囲気を持っています。",
        letter: "あなたの魔法は、派手な光ではなく花冠みたいなやさしさ。近くにいる人の表情をほどきます。",
        item: "グリーンのアイカラー、花モチーフ、保湿バーム",
        action: "自分がほっとしたものを、押しつけずに一つだけ誰かへ共有してみて。"
      }
    };
    const QUESTIONS = [
      { id: "q01", axis: "A", pole: "left", text: "かわいいと思ったら、理由を考える前に心が動く。" },
      { id: "q02", axis: "B", pole: "left", text: "現実っぽさより、少し不思議な世界に惹かれる。" },
      { id: "q03", axis: "C", pole: "right", text: "好きな作品やアイテムは、誰かにも見せたくなる。" },
      { id: "q04", axis: "A", pole: "right", text: "派手な一目惚れより、あとからじわじわ好きになることが多い。" },
      { id: "q05", axis: "B", pole: "right", text: "コスメや服は、毎日の気持ちを整えるお守りに近い。" },
      { id: "q06", axis: "C", pole: "left", text: "大事な世界観は、まず自分の中でゆっくり味わいたい。" },
      { id: "q07", axis: "A", pole: "left", text: "色や形の第一印象で、今日の気分が決まることがある。" },
      { id: "q08", axis: "B", pole: "left", text: "物語の中に出てくる小物や背景まで想像するのが好き。" },
      { id: "q09", axis: "C", pole: "right", text: "良かったものは、短い言葉でも感想を伝えたい。" },
      { id: "q10", axis: "A", pole: "right", text: "落ち着いた色や余白のある絵に、長く心を持っていかれる。" },
      { id: "q11", axis: "B", pole: "right", text: "朝や夜の身支度に、小さなルーティンがあると安心する。" },
      { id: "q12", axis: "C", pole: "left", text: "好きなものをすぐ投稿するより、保存して何度も見返したい。" },
      { id: "q13", axis: "A", pole: "left", text: "きらっとした装飾やリボンを見ると、つい目で追ってしまう。" },
      { id: "q14", axis: "B", pole: "left", text: "魔法、香水、古い本、秘密の部屋のようなモチーフに弱い。" },
      { id: "q15", axis: "C", pole: "right", text: "友達の雰囲気に合いそうなものを見つけるのが得意だ。" },
      { id: "q16", axis: "A", pole: "right", text: "明るさよりも、静かに残る品のよさに惹かれる。" },
      { id: "q17", axis: "B", pole: "right", text: "かわいさは、見るだけでなく自分の日常にも少し取り入れたい。" },
      { id: "q18", axis: "C", pole: "left", text: "自分だけがわかる好きなポイントを持っていると満たされる。" },
      { id: "q19", axis: "A", pole: "left", text: "新しい色や組み合わせを試すと、気持ちまで変わる。" },
      { id: "q20", axis: "B", pole: "right", text: "作品に出てくるアイテムを、実際のコスメや持ち物に置き換えて考える。" }
    ];
    const LIKERT = [
      { value: 1, label: "違う" },
      { value: 2, label: "かなり違う" },
      { value: 3, label: "少し違う" },
      { value: 4, label: "どちらでも" },
      { value: 5, label: "少し当てはまる" },
      { value: 6, label: "当てはまる" },
      { value: 7, label: "とても当てはまる" }
    ];
    const app = document.getElementById("app");
    const state = { step: "intro", page: 0, answers: {}, profile: { name: "", email: "", age: "" }, sentToLead: false };

    function esc(value) {
      return String(value ?? "").replace(/[&<>'"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[char]));
    }
    function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) Object.assign(state, JSON.parse(raw));
      } catch (_) {}
      state.answers ||= {};
      state.profile ||= { name: "", email: "", age: "" };
      if (!["intro", "quiz", "profile", "result", "types"].includes(state.step)) state.step = "intro";
    }
    function setStep(step) { state.step = step; saveState(); render(); }
    function toast(message) {
      const el = document.getElementById("toast");
      el.textContent = message;
      el.classList.add("show");
      window.clearTimeout(toast.timer);
      toast.timer = window.setTimeout(() => el.classList.remove("show"), 1700);
    }
    function pageQuestions() {
      const start = state.page * PAGE_SIZE;
      return QUESTIONS.slice(start, start + PAGE_SIZE);
    }
    function isPageComplete() { return pageQuestions().every((q) => Number.isFinite(Number(state.answers[q.id]))); }
    function isComplete() { return QUESTIONS.every((q) => Number.isFinite(Number(state.answers[q.id]))); }
    function hasProfile() { return Boolean(state.profile?.name && state.profile?.email && state.profile?.age); }
    function resetAll() {
      state.step = "intro";
      state.page = 0;
      state.answers = {};
      state.profile = { name: "", email: "", age: "" };
      state.sentToLead = false;
      saveState();
      render();
    }
    function computeResult() {
      const scores = { A: 0, B: 0, C: 0 };
      QUESTIONS.forEach((q) => {
        const value = Number(state.answers[q.id]);
        if (!Number.isFinite(value)) return;
        const delta = value - 4;
        scores[q.axis] += q.pole === "right" ? delta : -delta;
      });
      const parts = AXIS_KEYS.map((key) => scores[key] > 0 ? AXES[key].right.code : AXES[key].left.code);
      const resultKey = parts.join("-");
      return { key: resultKey, scores, char: CHARACTERS[resultKey] || CHARACTERS["spark-fantasy-share"] };
    }
    function axisMax(axisKey) {
      return QUESTIONS.filter((q) => q.axis === axisKey).length * 3;
    }
    function updateNav() {
      document.getElementById("navDiagnosis").classList.toggle("active", state.step !== "types");
      document.getElementById("navTypes").classList.toggle("active", state.step === "types");
    }
    function renderIntro() {
      app.innerHTML = `
        <section class="hero fade-in">
          <div class="hero-copy">
            <p class="kicker">WITCH’S FANTASY COSMETICS CHARACTER TYPE</p>
            <h2 class="hero-title">『魔女の空想コスメ』<br>キャラタイプ診断</h2>
            <p class="hero-lead">8つのクリエイティブをもとに、あなたの中にある「魔女の空想コスメ」のムードを診断します。</p>
            <div class="hero-actions">
              <button class="btn primary" id="btnStart" type="button">診断スタート</button>
              <button class="btn" id="btnTypeIntro" type="button">タイプを見る</button>
            </div>
          </div>
          <div class="hero-art">
            <img src="img/hero.webp" alt="魔女の空想コスメ診断のメインビジュアル">
            <div class="hero-label">『魔女の空想コスメ』作品世界とMobbyの診断体験を組み合わせたコラボ診断</div>
          </div>
        </section>
      `;
      document.getElementById("btnStart").onclick = () => {
        state.page = 0;
        state.step = isComplete() ? (hasProfile() ? "result" : "profile") : "quiz";
        saveState();
        render();
      };
      document.getElementById("btnTypeIntro").onclick = () => setStep("types");
    }
    function renderQuiz() {
      const totalPages = Math.ceil(QUESTIONS.length / PAGE_SIZE);
      const answered = QUESTIONS.filter((q) => Number.isFinite(Number(state.answers[q.id]))).length;
      const qs = pageQuestions();
      app.innerHTML = `
        <section class="stage fade-in">
          <div class="progress">
            <div class="progress-meta"><span>${answered} / ${QUESTIONS.length}</span><span>${state.page + 1} / ${totalPages}</span></div>
            <div class="progress-track"><div class="progress-fill" style="width:${(answered / QUESTIONS.length) * 100}%"></div></div>
          </div>
          <div class="question-list">
            ${qs.map((q, index) => `
              <fieldset class="question">
                <legend>Q${state.page * PAGE_SIZE + index + 1}. ${esc(q.text)}</legend>
                <div class="likert-labels"><span>違う</span><span>どちらでも</span><span>当てはまる</span></div>
                <div class="likert" role="group" aria-label="${esc(q.text)}">
                  ${LIKERT.map((item) => `<button type="button" class="${Number(state.answers[q.id]) === item.value ? "selected" : ""}" data-qid="${q.id}" data-value="${item.value}" aria-label="${esc(item.label)}">${item.value}</button>`).join("")}
                </div>
              </fieldset>
            `).join("")}
          </div>
          <div class="quiz-nav">
            <button class="btn" id="btnPrev" type="button" ${state.page === 0 ? "disabled" : ""}>戻る</button>
            <button class="btn primary" id="btnNext" type="button" ${isPageComplete() ? "" : "disabled"}>${state.page + 1 >= totalPages ? "結果へ" : "次へ"}</button>
          </div>
        </section>
      `;
      app.querySelectorAll(".likert button").forEach((button) => {
        button.onclick = () => {
          state.answers[button.dataset.qid] = Number(button.dataset.value);
          saveState();
          renderQuiz();
        };
      });
      document.getElementById("btnPrev").onclick = () => {
        if (state.page > 0) {
          state.page -= 1;
          saveState();
          render();
        }
      };
      document.getElementById("btnNext").onclick = () => {
        if (!isPageComplete()) return;
        if (state.page + 1 < totalPages) {
          state.page += 1;
          saveState();
          render();
        } else {
          state.step = hasProfile() ? "result" : "profile";
          saveState();
          render();
        }
      };
    }
    function renderProfile() {
      const result = computeResult();
      app.innerHTML = `
        <section class="stage fade-in">
          <p class="kicker">RESULT READY</p>
          <h2 class="section-title">結果は「${esc(result.char.name)}」です</h2>
          <p class="text">結果ページでは、キャラタイプ別の世界観・コスメムード・おすすめ行動を表示します。</p>
          <form id="profileForm">
            <div class="form-grid">
              <div class="field">
                <label for="profileName">お名前</label>
                <input id="profileName" name="name" autocomplete="name" required value="${esc(state.profile.name)}">
              </div>
              <div class="field">
                <label for="profileEmail">メール</label>
                <input id="profileEmail" name="email" type="email" autocomplete="email" required value="${esc(state.profile.email)}">
              </div>
              <div class="field">
                <label for="profileAge">年齢</label>
                <select id="profileAge" name="age" required>
                  <option value="">選択</option>
                  ${AGE_OPTIONS.map((age) => `<option value="${esc(age)}" ${state.profile.age === age ? "selected" : ""}>${esc(age)}</option>`).join("")}
                </select>
              </div>
            </div>
            <div class="actions">
              <button class="btn primary" type="submit">結果を見る</button>
              <button class="btn" id="btnBackQuiz" type="button">回答に戻る</button>
            </div>
          </form>
        </section>
      `;
      document.getElementById("btnBackQuiz").onclick = () => {
        state.step = "quiz";
        state.page = Math.max(0, Math.ceil(QUESTIONS.length / PAGE_SIZE) - 1);
        saveState();
        render();
      };
      document.getElementById("profileForm").onsubmit = async (event) => {
        event.preventDefault();
        const form = new FormData(event.currentTarget);
        state.profile = {
          name: String(form.get("name") || "").trim(),
          email: String(form.get("email") || "").trim(),
          age: String(form.get("age") || "").trim()
        };
        state.step = "result";
        saveState();
        await submitDiagnosis(result);
        render();
      };
    }
    async function submitDiagnosis(result) {
      if (state.sentToLead || !hasProfile()) return;
      try {
        await fetch("/api/diagnosis", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            source: SITE.source,
            diagTitle: SITE.sourceLabel,
            diagnosis_type: result.char.name,
            type: result.key,
            name: state.profile.name,
            email: state.profile.email,
            age: state.profile.age,
            axes: result.scores,
            answers: state.answers,
            pageUrl: window.location.href,
            userAgent: navigator.userAgent,
            createdAt: new Date().toISOString()
          }),
          keepalive: true
        });
        state.sentToLead = true;
        saveState();
      } catch (_) {}
    }
    function renderAxisCards(result) {
      return AXIS_KEYS.map((key) => {
        const axis = AXES[key];
        const max = axisMax(key);
        const score = result.scores[key];
        const pct = Math.max(4, Math.min(96, ((score + max) / (max * 2)) * 100));
        return `
          <div class="axis-card">
            <div class="axis-meta"><span>${esc(axis.left.label)}</span><span>${esc(axis.name)}</span><span>${esc(axis.right.label)}</span></div>
            <div class="axis-bar"><span class="axis-dot" style="left:${pct}%"></span></div>
          </div>
        `;
      }).join("");
    }
    function renderResult() {
      const result = computeResult();
      const ch = result.char;
      const shareText = encodeURIComponent(SITE.shareText.replace("{result}", ch.name));
      const shareUrl = encodeURIComponent(SITE.publicUrl);
      const lineData = encodeURIComponent(JSON.stringify({
        source: SITE.source,
        sourceLabel: SITE.sourceLabel,
        type: result.key,
        diagnosisType: ch.name,
        pagePath: "/meeco/",
        axes: result.scores,
        resultImage: ch.image
      }));
      app.innerHTML = `
        <section class="stage fade-in">
          <div class="result-layout">
            <div>
              <img class="result-img" src="${esc(ch.image)}" alt="${esc(ch.name)}">
              <div class="share-panel">
                <div class="share-actions">
                  <a class="share-btn" href="https://twitter.com/intent/tweet?text=${shareText}&url=${shareUrl}" target="_blank" rel="noopener noreferrer">Xでシェア</a>
                  <a class="share-btn" href="https://social-plugins.line.me/lineit/share?url=${shareUrl}" target="_blank" rel="noopener noreferrer">LINEで送る</a>
                  <button class="share-btn" id="btnCopy" type="button">コピー</button>
                </div>
                <div class="line-mount" data-line-ai-mobby-cta data-diagnosis="${lineData}"></div>
              </div>
            </div>
            <div>
              <p class="kicker">TYPE ${esc(ch.no)}</p>
              <h2 class="result-name">${esc(ch.name)}</h2>
              <p class="catch">${esc(ch.catch)}</p>
              <div class="axis-list">${renderAxisCards(result)}</div>
              <div class="result-blocks">
                <article class="info-card"><h3>魅力</h3><p>${esc(ch.charm)}</p></article>
                <article class="info-card"><h3>魔女からの手紙</h3><p>${esc(ch.letter)}</p></article>
                <article class="info-card"><h3>似合うコスメムード</h3><p>${esc(ch.item)}</p></article>
                <article class="info-card"><h3>今日の小さな魔法</h3><p>${esc(ch.action)}</p></article>
              </div>
              <div class="official-band">
                <h3>『魔女の空想コスメ』を見るなら</h3>
                <p class="text">診断で言語化されたムードを持ったまま作品を見ると、好きなカットやキャラクターの見え方も少し変わるかもしれません。</p>
                <div class="link-list">
                  ${SITE.links.map((link) => `<a class="btn" href="${esc(link.url)}" target="_blank" rel="noopener noreferrer">${esc(link.label)}</a>`).join("")}
                </div>
              </div>
              <div class="actions">
                <button class="btn rose" id="btnAgain" type="button">もう一度診断</button>
                <button class="btn" id="btnTypesFromResult" type="button">8キャラタイプを見る</button>
              </div>
            </div>
          </div>
        </section>
      `;
      document.getElementById("btnCopy").onclick = async () => {
        try {
          await navigator.clipboard.writeText(SITE.copyText.replace("{result}", ch.name));
          toast("シェア文をコピーしました");
        } catch (_) {
          toast("コピーできませんでした");
        }
      };
      document.getElementById("btnAgain").onclick = () => resetAll();
      document.getElementById("btnTypesFromResult").onclick = () => setStep("types");
      window.MobbyLineAiCTA?.autoRender?.(app);
    }
    function renderTypes() {
      const cards = Object.entries(CHARACTERS).map(([key, ch]) => `
        <article class="type-card">
          <img src="${esc(ch.image)}" alt="${esc(ch.name)}">
          <div class="type-body">
            <p class="type-code">TYPE ${esc(ch.no)} / ${esc(key)}</p>
            <h3>${esc(ch.name)}</h3>
            <p>${esc(ch.catch)}</p>
          </div>
        </article>
      `).join("");
      app.innerHTML = `
        <section class="stage fade-in">
          <p class="kicker">8 TYPES</p>
          <h2 class="section-title">魔女の空想コスメの8キャラタイプ</h2>
          <div class="types-grid">${cards}</div>
          <div class="actions">
            <button class="btn primary" id="btnBackDiagnosis" type="button">${isComplete() ? "結果に戻る" : "診断する"}</button>
          </div>
        </section>
      `;
      document.getElementById("btnBackDiagnosis").onclick = () => {
        state.step = isComplete() ? (hasProfile() ? "result" : "profile") : "intro";
        saveState();
        render();
      };
    }
    function render() {
      updateNav();
      if (state.step === "quiz") renderQuiz();
      else if (state.step === "profile") renderProfile();
      else if (state.step === "result") renderResult();
      else if (state.step === "types") renderTypes();
      else renderIntro();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
    document.getElementById("navDiagnosis").onclick = (event) => {
      event.preventDefault();
      state.step = isComplete() ? (hasProfile() ? "result" : "profile") : "intro";
      saveState();
      render();
    };
    document.getElementById("navTypes").onclick = (event) => {
      event.preventDefault();
      setStep("types");
    };
    document.getElementById("btnReset").onclick = resetAll;
    loadState();
    render();
  </script>
  <script src="../assets/mobby-guide.js"></script>
</body>
</html>
