  ${ch.downside ? `<div style="margin-bottom:20px;padding:12px;background:rgba(255,90,90,0.05);border-radius:12px;border-left:3px solid #ff5a5a;"><h3 style="font-size:14px;font-weight:700;color:#ff5a5a;margin:0 0 8px;">😣 気をつけたいこと</h3><p style="font-size:13px;line-height:1.8;margin:0;">${ch.downside}</p></div>` : ""}
  ${ch.perception ? `<div style="margin-bottom:20px;padding:12px;background:rgba(77,171,247,0.05);border-radius:12px;border-left:3px solid #4dabf7;"><h3 style="font-size:14px;font-weight:700;color:#4dabf7;margin:0 0 8px;">👀 周りからの見え方</h3><p style="font-size:13px;line-height:1.8;margin:0;">${ch.perception}</p></div>` : ""}
  <div style="display:grid;gap:12px;margin-top:20px;"><div style="padding:12px;background:var(--surface2);border-radius:12px;"><h3 style="font-size:13px;font-weight:700;margin:0 0 6px;">✨ 強み</h3><p style="font-size:13px;line-height:1.6;margin:0;">${ch.strength}</p></div><div style="padding:12px;background:var(--surface2);border-radius:12px;"><h3 style="font-size:13px;font-weight:700;margin:0 0 6px;">⚡ 弱み</h3><p style="font-size:13px;line-height:1.6;margin:0;">${ch.weakness}</p></div></div>
  ${ch.altCheck ? `<div style="margin-top:20px;padding:10px;background:rgba(201,160,80,0.05);border:1px dashed var(--accent);border-radius:12px;"><p style="font-size:12px;line-height:1.6;margin:0;">${ch.altCheck}</p></div>` : ""}</div></div>`;
            document.body.insertAdjacentHTML("beforeend", m);
            const ov = document.getElementById("cmo");
            document.getElementById("cmc").onclick = () => { ov.style.animation = "fadeOut 0.2s ease forwards"; setTimeout(() => ov.remove(), 200); };
            ov.onclick = e => { if (e.target === ov) { ov.style.animation = "fadeOut 0.2s ease forwards"; setTimeout(() => ov.remove(), 200); } };
        }
        loadState(); render();
    </script>
</body>
