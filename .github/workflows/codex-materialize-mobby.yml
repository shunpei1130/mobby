name: Materialize Codex Mobby MBTI

on:
  push:
    branches:
      - codex/add-mobby-mbti-diagnosis

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/add-mobby-mbti-diagnosis
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply generated patch
        run: node scripts/codex-materialize-mobby.mjs
      - name: Commit materialized changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "add mobby mbti shadow diagnosis"
          git push origin codex/add-mobby-mbti-diagnosis
